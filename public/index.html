  .cc-drug-detail { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; }
  .cc-drug-meta { display: flex; gap: 18px; font-size: 11px; color: var(--text-dim); padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .cc-drug-meta span strong { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-right: 6px; font-weight: 400; }
  .cc-verified-badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; margin-left: 6px; vertical-align: middle; }
  .cc-verified-badge.unverified { background: rgba(200,52,26,0.15); color: var(--accent-bright); border: 1px solid var(--accent); }

  .cc-hts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .cc-ht-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 2px; padding: 12px 16px; }
  .cc-ht-card .label { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .cc-ht-card .detail { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

  .cc-empty { text-align: center; padding: 50px 24px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px dashed var(--border); border-radius: 2px; }

  body.cc-code-mode { overflow: hidden; }
  .cc-code-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; overflow-y: auto; display: none; }
  body.cc-code-mode .cc-code-overlay { display: block; }
  .cc-code-banner { position: sticky; top: 0; background: var(--accent); color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 3px solid #000; box-shadow: 0 4px 20px rgba(200,52,26,0.4); }
  .cc-code-banner-left { display: flex; align-items: center; gap: 16px; }
  .cc-code-pulse { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: cc-pulse 1s infinite; }
  @keyframes cc-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 50% { opacity: 0.7; box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
  .cc-code-banner-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-code-banner-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
  .cc-exit-btn { background: rgba(0,0,0,0.3); border: 2px solid white; color: white; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; padding: 8px 18px; border-radius: 2px; cursor: pointer; }
  .cc-exit-btn:hover { background: rgba(0,0,0,0.6); }
  .cc-code-content { padding: 24px 32px 80px; max-width: 1200px; margin: 0 auto; }
  .cc-code-patient { background: #1a1a1a; border: 2px solid var(--accent); padding: 20px 24px; margin-bottom: 28px; display: flex; justify-content: space-around; gap: 24px; flex-wrap: wrap; }
  .cc-code-patient-item { text-align: center; }
  .cc-code-patient-item .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  .cc-code-patient-item .value { font-family: 'Oswald', sans-serif; font-size: 42px; font-weight: 700; color: white; line-height: 1; }
  .cc-code-patient-item .value .unit { font-size: 22px; color: #888; }
  .cc-code-section { margin-bottom: 32px; }
  .cc-code-section-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }
  .cc-code-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .cc-code-card { background: #1a1a1a; border: 1px solid #333; border-left: 4px solid var(--accent); padding: 18px 20px; }
  .cc-code-card .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .cc-code-card .name { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: white; margin-bottom: 10px; }
  .cc-code-card .big { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; color: var(--accent-bright); line-height: 1; margin-bottom: 4px; }
  .cc-code-card .vol { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--gold); margin-top: 4px; }
  .cc-code-card .note { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.5; }

  @media (max-width: 720px) {
    .cc-input-grid, .cc-input-grid.with-age { grid-template-columns: 1fr; }
    .cc-input-bar { position: static; }
    .cc-section { scroll-margin-top: 20px; }
    .cc-dose-row { grid-template-columns: 1fr; }
    .cc-code-banner-title { font-size: 16px; }
    .cc-code-patient-item .value { font-size: 32px; }
    .cc-code-card .big { font-size: 28px; }
    .cc-code-content { padding: 16px 16px 60px; }
  }

  /* ====== RUN A CODE (merged tool) ====== */
  .rc-patient-bar { display: grid; grid-template-columns: 1.2fr 1.5fr auto auto; gap: 12px; align-items: end; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px; padding: 16px 20px; margin-bottom: 20px; }
  .rc-patient-bar.with-age { grid-template-columns: 1.2fr 1.5fr 0.8fr auto auto; }
  .rc-patient-bar.active { border-color: var(--gold); border-left: 3px solid var(--gold); }
  .rc-drug-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .rc-drug-btn { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 4px; padding: 14px 16px; cursor: pointer; text-align: left; transition: all 0.15s; color: var(--text); font-family: inherit; }
  .rc-drug-btn:hover { border-left-color: var(--accent); transform: translateY(-1px); }
  .rc-drug-btn.primary { border-left-color: var(--accent); }
  .rc-drug-btn .name { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .rc-drug-btn .dose { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--accent-bright); line-height: 1; }
  .rc-drug-btn .vol { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 4px; }
  .rc-drug-btn .ind { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .rc-drug-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rc-shock-btn { background: var(--accent); border: 1px solid var(--accent); border-left: 3px solid #fff; color: white; }
  .rc-shock-btn:hover { background: var(--accent-bright); }
  .rc-shock-btn .dose { color: white; font-size: 28px; }
  .rc-shock-btn .vol { color: rgba(255,255,255,0.85); }
  .rc-action-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .rc-rhythm-btn { background: var(--bg-elev-2); border: 1px solid var(--border-bright); color: var(--text); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px; border-radius: 2px; cursor: pointer; }
  .rc-rhythm-btn:hover { border-color: var(--accent); color: var(--accent-bright); }
  .rc-rhythm-btn.rosc { border-color: var(--success); color: var(--success); }
  .rc-rhythm-btn.rosc:hover { background: var(--success); color: white; }

  @media (max-width: 720px) {
    .rc-patient-bar, .rc-patient-bar.with-age { grid-template-columns: 1fr 1fr; }
  }

  /* ====== RUN A CODE — Bottom Tab Bar ====== */
  .rc-tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-top: 2px solid var(--accent);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 80;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .rc-quick-weight { display: flex; gap: 6px; margin-top: 8px; }
  .rc-quick-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rc-quick-btn:hover { border-color: var(--gold); color: var(--gold); }
  .rc-quick-btn.active { background: var(--gold); color: #1a1208; border-color: var(--gold); }
  .rc-tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 4px 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-top: 3px solid transparent;
    transition: all 0.15s;
  }
  .rc-tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
  .rc-tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .rc-tab-btn.active {
    color: var(--accent-bright);
    border-top-color: var(--accent);
    background: var(--bg-elev-2);
  }
  /* Pad bottom of Run a Code content so the fixed bar doesn't cover it */
  .rc-tabbed .content.ct-wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }

  /* Drug card 3-row layout */
  .rc-drug-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 4px; padding: 0; overflow: hidden; cursor: pointer; transition: all 0.15s; color: var(--text); font-family: inherit; text-align: left; display: flex; flex-direction: column; }
  .rc-drug-card:hover { border-left-color: var(--accent); transform: translateY(-1px); }
  .rc-drug-card.primary { border-left-color: var(--accent); }
  .rc-drug-card-head { padding: 12px 16px 10px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
  .rc-drug-card-head .name { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .rc-drug-card-head .ind { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .rc-drug-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
  .rc-drug-row:last-child { border-bottom: none; }
  .rc-drug-row .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .rc-drug-row .value { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.15; }
  .rc-drug-row.dose .value { color: var(--accent-bright); }
  .rc-drug-row.package .value { color: var(--text); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
  .rc-drug-row.delivery .value { color: var(--gold); font-size: 15px; }

  /* Rhythm Check Decision Panel — appears at 2:00 */
  .rc-decision {
    background: linear-gradient(135deg, #2a0a0a, #1a0505);
    border: 3px solid var(--accent);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    animation: rc-decision-pulse 1.5s ease-in-out infinite;
    display: none;
  }
  .rc-decision.show { display: block; }
  @keyframes rc-decision-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,65,42,0.5); }
    50% { box-shadow: 0 0 24px 4px rgba(232,65,42,0.4); }
  }
  .rc-decision-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-bright);
    text-align: center;
    margin-bottom: 12px;
  }
  .rc-decision-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .rc-decision-btn {
    border: 2px solid;
    border-radius: 6px;
    padding: 18px 12px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    transition: transform 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .rc-decision-btn:active { transform: scale(0.97); }
  .rc-decision-btn .big {
    font-size: 22px;
    line-height: 1;
  }
  .rc-decision-btn .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0.9;
  }
  .rc-decision-btn.shock {
    background: var(--accent);
    border-color: var(--accent-bright);
    color: white;
  }
  .rc-decision-btn.shock:hover { background: var(--accent-bright); }
  .rc-decision-btn.noshock {
    background: var(--gold);
    border-color: #f0b550;
    color: #1a1208;
  }
  .rc-decision-btn.noshock:hover { background: #f0b550; }

  /* ============================================================
     V2 ENTRY FLOW — Adult/Peds picker, Broselow zones, IBW tiles
  ============================================================ */
  .cr-entry {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 4px 24px;
  }
  .cr-entry-title {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    text-align: center;
  }
  .cr-entry-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 22px;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .cr-entry-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 30px;
  }
  .cr-entry-card {
    background: var(--bg-elev);
    border: 2px solid var(--border-bright);
    border-radius: 8px;
    padding: 28px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-family: inherit;
  }
  .cr-entry-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cr-entry-card.peds { border-color: var(--success); }
  .cr-entry-card.peds:hover { background: rgba(74,157,95,0.08); }
  .cr-entry-card.adult { border-color: var(--gold); }
  .cr-entry-card.adult:hover { background: rgba(212,163,65,0.08); }
  .cr-entry-card .plus {
    position: absolute;
    top: 10px; right: 10px;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 18px; font-weight: 700;
  }
  .cr-entry-card.peds .plus { background: var(--success); }
  .cr-entry-card.adult .plus { background: var(--gold); color: #1a1208; }
  .cr-entry-card .icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .cr-entry-card .label {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .cr-back {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 8px 14px;
    border-radius: 4px;
  }
  .cr-back:hover { color: var(--accent); border-color: var(--accent); }

  /* Broselow zone tiles */
  .cr-broselow-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cr-zone {
    display: grid;
    grid-template-columns: 120px 1fr auto;
    align-items: center;
    background: var(--bg-elev);
    border: 1.5px solid var(--border-bright);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    padding: 0;
    transition: transform 0.1s, border-color 0.15s;
  }
  .cr-zone:hover { transform: translateX(2px); border-color: var(--accent); }
  .cr-zone-color {
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    padding: 16px 8px;
    text-align: center;
  }
  .cr-zone-info { padding: 10px 14px; text-align: left; }
  .cr-zone-weight { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; color: var(--text); }
  .cr-zone-age { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.05em; }
  .cr-zone-arrow { color: var(--text-muted); padding-right: 14px; font-size: 20px; font-family: 'JetBrains Mono', monospace; }

  /* Adult IBW tiles */
  .cr-ibw-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cr-ibw-tile {
    background: var(--bg-elev);
    border: 1.5px solid var(--border-bright);
    border-radius: 30px;
    padding: 14px 22px;
    display: grid;
    grid-template-columns: 90px 1fr 80px;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: all 0.12s;
  }
  .cr-ibw-tile:hover { transform: translateX(2px); border-color: var(--gold); background: rgba(212,163,65,0.06); }
  .cr-ibw-lbs { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; color: var(--gold); text-align: left; }
  .cr-ibw-kg { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); text-align: left; }
  .cr-ibw-ht { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text-dim); text-align: right; }

  /* Manual / custom weight entry */
  .cr-manual {
    background: var(--bg-elev);
    border: 1px dashed var(--border-bright);
    border-radius: 6px;
    padding: 16px;
    margin-top: 8px;
  }
  .cr-manual-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cr-manual-row { display: flex; gap: 8px; align-items: stretch; }
  .cr-manual-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    color: var(--text);
    outline: none;
  }
  .cr-manual-row input:focus { border-color: var(--accent); }
  .cr-manual-btn {
    width: 100%;
    margin-top: 10px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 13px;
    cursor: pointer;
  }
  .cr-manual-btn:hover { background: var(--accent-bright); }

  /* Patient bar (sticky during dose view) */
  .cr-patient-bar-v2 {
    background: var(--bg-elev-2);
    border: 1px solid var(--border-bright);
    border-left: 4px solid var(--gold);
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .cr-patient-bar-v2.peds { border-left-color: var(--success); }
  .cr-pat-summary {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cr-pat-summary .zone-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border: 1px solid rgba(0,0,0,0.3);
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .cr-pat-summary .lt { font-weight: 400; color: var(--text-dim); font-size: 13px; }
  .cr-new-pat-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-new-pat-btn:hover { background: var(--accent); color: white; }

  @media (max-width: 720px) {
    .cr-entry-cards { grid-template-columns: 1fr; }
    .cr-zone { grid-template-columns: 100px 1fr auto; }
    .cr-ibw-tile { grid-template-columns: 70px 1fr 70px; }
  }

  /* ============================================================
     V2 LIGHT CLINICAL THEME — scoped to body.on-coderun only
     Academy / dashboard pages keep the dark theme.
  ============================================================ */
  /* Palette mirrors Greater Naples Fire Rescue (greaternaplesfire.org):
     fire red #B71125 / dark red #AA0E21 / gold #FDCA68 / charcoal #383838 / cream #FDFAF4.
     Var names kept (--clin-blue etc.) to avoid churn; --clin-blue is now the GNFR red primary. */
  :root {
    --clin-bg: #fdfaf4;
    --clin-surface: #ffffff;
    --clin-surface-alt: #f4efe6;
    --clin-border: #e6dfd2;
    --clin-text: #383838;
    --clin-text-dim: #54595f;
    --clin-text-muted: #9a948a;
    --clin-blue: #b71125;
    --clin-blue-light: #f7dde1;
    --clin-pink: #fbe0e6;
    --clin-red: #b71125;
    --clin-yellow: #fdca68;
    --clin-green: #2fa84f;
    --clin-shadow: 0 2px 8px rgba(56,56,56,0.10);
  }

  body.on-coderun .main {
    background: var(--clin-bg);
  }
  body.on-coderun .main .header {
    background: var(--clin-blue);
    color: white;
    border-bottom: none;
  }
  body.on-coderun .main .header .breadcrumb,
  body.on-coderun .main .header .page-meta {
    color: rgba(255,255,255,0.7);
  }
  body.on-coderun .main .header .page-title {
    color: white;
  }
  body.on-coderun .main .header .page-title .accent {
    color: var(--clin-yellow);
  }
  body.on-coderun .main .content {
    background: var(--clin-bg);
    color: var(--clin-text);
  }
  body.on-coderun .main .cc-disclaimer {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text-dim);
    border-left: 3px solid var(--clin-yellow);
  }
  body.on-coderun .main .cc-disclaimer strong {
    color: var(--clin-red);
  }
  body.on-coderun .main .cr-entry-title { color: var(--clin-blue); }
  body.on-coderun .main .cr-entry-sub { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-entry-card {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
    box-shadow: var(--clin-shadow);
  }
  body.on-coderun .main .cr-entry-card.peds { border-color: var(--clin-green); }
  body.on-coderun .main .cr-entry-card.peds .plus { background: var(--clin-green); color: white; }
  body.on-coderun .main .cr-entry-card.peds:hover { background: linear-gradient(180deg, #e8f5ec 0%, var(--clin-surface) 100%); }
  body.on-coderun .main .cr-entry-card.adult { border-color: var(--clin-blue); }
  body.on-coderun .main .cr-entry-card.adult .plus { background: var(--clin-blue); color: white; }
  body.on-coderun .main .cr-entry-card.adult:hover { background: linear-gradient(180deg, var(--clin-blue-light) 0%, var(--clin-surface) 100%); }
  body.on-coderun .main .cr-back {
    color: var(--clin-blue);
    border-color: var(--clin-border);
    background: var(--clin-surface);
  }
  body.on-coderun .main .cr-back:hover { color: var(--clin-blue); border-color: var(--clin-blue); background: var(--clin-blue-light); }
  body.on-coderun .main .cr-zone {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-zone:hover { border-color: var(--clin-blue); box-shadow: var(--clin-shadow); }
  body.on-coderun .main .cr-zone-weight { color: var(--clin-text); }
  body.on-coderun .main .cr-zone-age { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-zone-arrow { color: var(--clin-text-muted); }
  body.on-coderun .main .cr-ibw-tile {
    background: var(--clin-blue-light);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-ibw-tile:hover { border-color: var(--clin-blue); background: #f1ccd1; }
  body.on-coderun .main .cr-ibw-lbs { color: var(--clin-text); }
  body.on-coderun .main .cr-ibw-kg { color: var(--clin-text); }
  body.on-coderun .main .cr-ibw-ht { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-manual {
    background: var(--clin-surface);
    border-color: var(--clin-border);
  }
  body.on-coderun .main .cr-manual-label { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-manual-row input {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-manual-row input:focus { border-color: var(--clin-blue); }
  body.on-coderun .main .cr-manual-btn {
    background: var(--clin-blue);
    color: white;
  }
  body.on-coderun .main .cr-manual-btn:hover { background: #aa0e21; }

  /* Patient bar — V2 clinical look */
  body.on-coderun .main .cr-patient-bar-v2 {
    background: var(--clin-blue-light);
    border: none;
    border-left: 4px solid var(--clin-blue);
    color: var(--clin-text);
    border-radius: 0;
    padding: 14px 18px;
    margin-bottom: 0;
    box-shadow: 0 1px 2px rgba(56,56,56,0.06);
  }
  body.on-coderun .main .cr-patient-bar-v2.peds {
    background: var(--clin-pink);
    border-left-color: #ec4899;
  }
  body.on-coderun .main .cr-pat-summary { color: var(--clin-text); }
  body.on-coderun .main .cr-pat-summary .lt { color: var(--clin-text-dim); }
  /* Start CPR button (right side of patient bar) */
  .cr-cpr-toggle-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-blue);
    color: var(--clin-blue);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-cpr-toggle-btn:hover { background: var(--clin-blue); color: white; }
  .cr-cpr-toggle-btn.active {
    background: var(--clin-red);
    border-color: var(--clin-red);
    color: white;
  }
  .cr-cpr-toggle-btn.active:hover { background: #aa0e21; border-color: #aa0e21; }

  /* New Patient: subtler button in clinical theme */
  body.on-coderun .main .cr-new-pat-btn {
    background: transparent;
    border: 1px solid var(--clin-text-dim);
    color: var(--clin-text-dim);
    padding: 7px 12px;
    font-size: 11px;
  }
  body.on-coderun .main .cr-new-pat-btn:hover { background: var(--clin-text-dim); color: white; }

  /* ============================================================
     COMPACT CPR CONTROL BAR — shows when CPR active
  ============================================================ */
  .cr-cpr-control {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 10px;
    padding: 14px;
    margin: 12px 0;
    box-shadow: var(--clin-shadow);
    display: none;
  }
  .cr-cpr-control.show { display: block; }
  .cpr-row-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .cpr-ratio-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .cpr-ratio-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 8px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .cpr-ratio-btn.active {
    background: var(--clin-green);
    border-color: var(--clin-green);
    color: white;
  }
  .cpr-ratio-btn:hover:not(.active) { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cpr-action-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 10px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cpr-action-btn:hover { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cpr-action-btn.defib { border-color: var(--clin-red); color: var(--clin-red); }
  .cpr-action-btn.defib:hover { background: var(--clin-red); color: white; }
  .cpr-row-mid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    padding: 10px 4px;
    border-top: 1px solid var(--clin-surface-alt);
    border-bottom: 1px solid var(--clin-surface-alt);
  }
  .cpr-bpm-cell {
    text-align: left;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cpr-bpm-cell .ico { font-size: 18px; line-height: 1; }
  .cpr-bpm-cell .val {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--clin-red);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .cpr-bpm-cell .lbl {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--clin-text-muted);
    letter-spacing: 0.04em;
  }
  .cpr-reset-btn {
    background: var(--clin-blue);
    color: white;
    border: none;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(183,17,37,0.35);
    text-transform: uppercase;
  }
  .cpr-reset-btn:hover { background: #aa0e21; transform: scale(1.03); }
  .cpr-time-cell {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .cpr-time-cell .val {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--clin-blue);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cpr-time-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cpr-row-bot {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .cpr-footer {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--clin-text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--clin-surface-alt);
  }
  .cr-pulse-mini {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--clin-red);
    opacity: 0.25;
    transition: all 0.06s;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }
  .cr-pulse-mini.beat { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px rgba(183,17,37,0.6); }

  /* Bottom tab bar — clinical look */
  body.on-coderun .main .rc-tabbar {
    background: var(--clin-blue);
    color: white;
    border-top: none;
    box-shadow: 0 -2px 8px rgba(56,56,56,0.15);
  }
  body.on-coderun .main .rc-tab-btn {
    background: none;
    color: rgba(255,255,255,0.65);
    border-top: 3px solid transparent;
    border-bottom: none;
  }
  body.on-coderun .main .rc-tab-btn.active {
    color: white;
    background: rgba(255,255,255,0.06);
    border-top-color: var(--clin-yellow);
    border-bottom: none;
  }
  body.on-coderun .main .rc-tab-btn svg path { stroke: currentColor; }

  /* Settings collapsible — light theme */
  body.on-coderun .main .ct-settings {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  body.on-coderun .main .ct-settings summary {
    color: var(--clin-text-dim) !important;
  }
  body.on-coderun .main .ct-toggle-row,
  body.on-coderun .main .ct-bpm-row {
    border-top: 1px solid var(--clin-surface-alt);
  }
  body.on-coderun .main .ct-toggle-label .main { color: var(--clin-text); }
  body.on-coderun .main .ct-toggle-label .sub { color: var(--clin-text-dim); }

  /* Decision panel — light theme */
  body.on-coderun .main .rc-decision {
    background: var(--clin-surface);
    border-color: var(--clin-border);
  }
  body.on-coderun .main .rc-decision.show { border-color: var(--clin-red); }
  body.on-coderun .main .rc-decision-title { color: var(--clin-red); }

  @media (max-width: 720px) {
    .cpr-row-top, .cpr-row-bot { grid-template-columns: 1fr; }
    .cpr-ratio-group { grid-template-columns: 1fr 1fr; }
    .cpr-row-mid { gap: 8px; }
    .cpr-reset-btn { width: 64px; height: 64px; font-size: 12px; }
  }

  /* ============================================================
     V2 TABULAR MEDS — Drug | Conc | Vol | Rt rows, arrest = red
  ============================================================ */
  .cr-meds-card {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: var(--clin-shadow);
  }
  .cr-meds-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--clin-blue-light);
    border-bottom: 1px solid var(--clin-border);
  }
  .cr-meds-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--clin-blue);
    color: white;
    border-radius: 6px;
    font-size: 18px;
  }
  .cr-meds-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.04em;
    color: var(--clin-text);
    flex: 1;
  }
  .cr-meds-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .cr-meds-action-btn {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    width: 38px;
    height: 38px;
    border-radius: 6px;
    color: var(--clin-blue);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cr-meds-action-btn:hover { background: var(--clin-blue-light); border-color: var(--clin-blue); }
  .cr-meds-action-btn.primary {
    background: var(--clin-blue);
    color: white;
    border-color: var(--clin-blue);
  }
  .cr-meds-action-btn.primary:hover { background: #aa0e21; }

  .cr-meds-subtabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--clin-surface-alt);
    border-bottom: 1px solid var(--clin-border);
  }
  .cr-meds-subtab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 12px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--clin-text-muted);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .cr-meds-subtab.active {
    background: var(--clin-surface);
    color: var(--clin-text);
    border-bottom-color: var(--clin-blue);
  }

  .cr-meds-banner {
    background: var(--clin-surface);
    padding: 14px;
    border-bottom: 1px solid var(--clin-border);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: var(--clin-text);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cr-meds-banner .ico { color: var(--clin-blue); font-size: 18px; }

  .cr-drug-table { background: var(--clin-surface); }
  .cr-drug-row {
    display: grid;
    grid-template-columns: 2.2fr 1fr 0.8fr 0.7fr;
    align-items: center;
    border-bottom: 1px solid var(--clin-surface-alt);
    padding: 10px 14px;
    background: var(--clin-surface);
    border-left: none;
    border-right: none;
    border-top: none;
    text-align: left;
    color: var(--clin-text);
    cursor: pointer;
    font-family: inherit;
    gap: 8px;
    width: 100%;
  }
  .cr-drug-row.header {
    background: #383838;
    color: white;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 14px;
    cursor: default;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .cr-drug-row.header > div { padding: 0; }
  .cr-drug-row:not(.header):nth-child(odd):not(.arrest) {
    background: var(--clin-surface-alt);
  }
  .cr-drug-row.arrest {
    border: 2px solid var(--clin-red);
    border-radius: 6px;
    margin: 2px 0;
  }
  .cr-drug-row.arrest .name { color: var(--clin-red); }
  .cr-drug-row.arrest:hover { background: var(--clin-blue-light); }
  .cr-drug-row:not(.header):not(.arrest):hover { background: var(--clin-blue-light); }
  .cr-drug-cell .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    line-height: 1.25;
  }
  .cr-drug-cell .ind {
    font-style: italic;
    font-size: 12px;
    color: var(--clin-text-dim);
    margin-top: 2px;
    line-height: 1.25;
  }
  .cr-drug-cell.conc, .cr-drug-cell.vol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }
  .cr-drug-cell.vol {
    background: rgba(247,221,225,0.55);
    padding: 6px 8px;
    border-radius: 4px;
    text-align: center;
  }
  .cr-drug-cell.rt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    gap: 4px;
  }
  .cr-drug-cell.rt .route-label {
    text-align: center;
    line-height: 1.1;
  }
  .cr-drug-cell.rt .arrow {
    font-size: 18px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .cr-drug-empty {
    padding: 36px 20px;
    text-align: center;
    color: var(--clin-text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  /* Future-use (not currently carried) — dimmed & non-clickable */
  .cr-drug-row.future { opacity: 0.45; cursor: default; }
  .cr-drug-row.future .name { text-decoration: line-through; text-decoration-thickness: 1px; }
  .cc-proto-item.future {
    opacity: 0.5; cursor: default;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .future-tag {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    color: var(--clin-text-muted);
    border: 1px solid var(--clin-border); border-radius: 3px; padding: 2px 6px;
  }

  @media (max-width: 720px) {
    .cr-drug-row { grid-template-columns: 1.8fr 0.9fr 0.7fr 0.6fr; padding: 10px 10px; gap: 6px; }
    .cr-drug-cell .name { font-size: 13px; }
    .cr-drug-cell .ind { font-size: 11px; }
    .cr-drug-cell.conc, .cr-drug-cell.vol { font-size: 11px; }
    .cr-drug-cell.rt { font-size: 11px; }
  }

  /* ============================================================
     BY PROTOCOL — selector menu + structured detail
  ============================================================ */
  .cc-proto-menu { padding: 12px; display: flex; flex-direction: column; gap: 16px; }
  .cc-proto-group { display: flex; flex-direction: column; gap: 6px; }
  .cc-proto-cat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--clin-text-muted); padding: 0 2px 2px;
  }
  .cc-proto-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--clin-surface); border: 1px solid var(--clin-border);
    border-left: 3px solid var(--clin-blue); border-radius: 6px;
    padding: 13px 14px; cursor: pointer; text-align: left; width: 100%;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.02em; color: var(--clin-text); transition: all 0.12s;
  }
  .cc-proto-btn:hover { background: var(--clin-blue-light); border-left-color: var(--clin-red); }
  .cc-proto-btn .arrow { color: var(--clin-text-muted); font-size: 18px; }

  .cc-proto-back {
    display: inline-flex; align-items: center; gap: 4px; margin: 12px 12px 0;
    background: none; border: none; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--clin-blue);
  }
  .cc-proto-back:hover { color: var(--clin-red); }
  .cc-proto-detail { padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 14px; }
  .cc-proto-section { display: flex; flex-direction: column; gap: 6px; }
  .cc-proto-section-label {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--clin-blue);
    border-bottom: 1px solid var(--clin-border); padding-bottom: 4px;
  }
  .cc-proto-section.warn .cc-proto-section-label { color: var(--clin-red); }
  .cc-proto-item {
    background: var(--clin-surface-alt); border-radius: 5px; padding: 10px 12px;
    font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--clin-text);
    line-height: 1.35;
  }
  .cc-proto-section.warn .cc-proto-item { background: #fde8e8; }
  button.cc-proto-item.drug {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--clin-border);
    border-left: 3px solid var(--clin-red); font-weight: 600;
  }
  button.cc-proto-item.drug:hover { background: var(--clin-blue-light); }
  button.cc-proto-item.drug .arrow { color: var(--clin-red); font-size: 16px; flex-shrink: 0; }

  button.cc-proto-item.jump {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; cursor: pointer; border: 1px dashed var(--clin-blue);
    background: var(--clin-blue-light); color: var(--clin-blue);
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  button.cc-proto-item.jump:hover { background: var(--clin-blue); color: #fff; }
  button.cc-proto-item.jump .arrow { font-size: 17px; flex-shrink: 0; }

  .cc-proto-peds-note {
    margin: 10px 12px 0; padding: 10px 12px; border-radius: 6px;
    background: rgba(253, 202, 104, 0.18); border-left: 3px solid var(--clin-yellow);
    font-family: 'Inter', sans-serif; font-size: 12.5px; line-height: 1.4; color: var(--clin-text);
  }
  .cc-proto-pearl {
    padding: 9px 12px; border-radius: 5px; background: rgba(183, 17, 37, 0.06);
    border-left: 3px solid var(--clin-red); font-family: 'Inter', sans-serif;
    font-size: 12.5px; font-style: italic; line-height: 1.4; color: var(--clin-text);
  }
  .cc-proto-pearl .lbl {
    font-style: normal; font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.08em; color: var(--clin-red); margin-right: 6px;
  }

  .cc-proto-memory { padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .cc-mem-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 12px; background: var(--clin-surface-alt); border-radius: 5px;
    border-left: 3px solid var(--clin-yellow);
  }
  .cc-mem-drug { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13px; color: var(--clin-text); }
  .cc-mem-dose { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: var(--clin-red); white-space: nowrap; }

  /* ============================================================
     V2 CLINICAL MODALS — Drug detail, Defib energy ladder
  ============================================================ */
  .cr-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(56, 56, 56, 0.55);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 16px;
  }
  .cr-modal-backdrop.show {
    display: flex;
    animation: cr-fade-in 0.18s ease-out;
  }
  @keyframes cr-fade-in { from { opacity: 0; } to { opacity: 1; } }

  .cr-modal {
    background: #b71125;
    color: white;
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    animation: cr-pop-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cr-pop-in {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .cr-modal-head {
    background: var(--clin-blue);
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .cr-modal-title-block { flex: 1; min-width: 0; }
  .cr-modal-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: white;
    line-height: 1.05;
  }
  .cr-modal-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .cr-modal-action {
    background: white;
    color: var(--clin-text);
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-modal-close {
    background: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: var(--clin-blue);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cr-modal-close:hover { background: var(--clin-blue-light); }

  .cr-modal-body {
    padding: 20px 20px 16px;
    overflow-y: auto;
    flex: 1;
  }
  .cr-modal-prompt {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 14px;
  }

  /* Drug modal: label / value rows */
  .cr-modal-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    align-items: start;
  }
  .cr-modal-row:last-child { border-bottom: none; }
  .cr-modal-label {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .cr-modal-value {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.4;
  }
  .cr-modal-value.white { color: white; font-weight: 600; }
  .cr-modal-value .sub {
    display: block;
    color: rgba(255,255,255,0.85);
    font-style: italic;
    font-size: 14px;
    font-weight: 400;
    margin-top: 4px;
  }

  /* Route toggle (IV / IO pill) */
  .cr-route-toggle {
    display: inline-flex;
    background: white;
    border: 2px solid #fdca68;
    border-radius: 8px;
    overflow: hidden;
    align-self: start;
  }
  .cr-route-toggle button {
    background: white;
    border: none;
    padding: 8px 18px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--clin-text);
    cursor: pointer;
    border-right: 1px solid #fdca68;
  }
  .cr-route-toggle button:last-child { border-right: none; }
  .cr-route-toggle button.active {
    background: #fdca68;
    color: var(--clin-text);
  }

  /* Defib energy ladder rows */
  .cr-energy-row {
    background: rgba(255,255,255,0.08);
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding: 16px 18px;
    width: 100%;
    text-align: left;
    color: white;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.12s;
  }
  .cr-energy-row:hover { background: rgba(255,255,255,0.15); }
  .cr-energy-row.active {
    background: white;
    color: var(--clin-text);
  }
  .cr-energy-row.active .check { color: var(--clin-text); font-size: 22px; }
  .cr-energy-row .check { color: transparent; font-size: 20px; }
  .cr-energy-row:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .cr-energy-row:last-child { border-bottom: none; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }

  .cr-modal-note {
    margin-top: 18px;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .cr-modal-note .label {
    color: white;
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }
  .cr-modal-note.warn .label { color: #fdca68; }
  .cr-modal-note ul { margin: 0; padding-left: 22px; }
  .cr-modal-note li { margin-bottom: 6px; }
  .cr-modal-note strong { font-weight: 700; }

  .cr-modal-foot {
    background: rgba(0,0,0,0.18);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cr-modal-btn {
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    transition: filter 0.12s;
  }
  .cr-modal-btn:hover { filter: brightness(1.08); }
  .cr-modal-btn.requested {
    background: #fdca68;
    color: var(--clin-text);
  }
  .cr-modal-btn.given {
    background: var(--clin-green);
    color: white;
  }
  .cr-modal-btn.shock {
    background: var(--clin-green);
    color: white;
  }
  .cr-modal-btn.noshock {
    background: #cbd5e1;
    color: var(--clin-text);
  }

  @media (max-width: 520px) {
    .cr-modal { max-width: 100%; border-radius: 12px; }
    .cr-modal-title { font-size: 19px; }
    .cr-modal-row { grid-template-columns: 90px 1fr; gap: 10px; }
    .cr-modal-label { font-size: 14px; }
    .cr-modal-value { font-size: 15px; }
  }

  /* ============================================================
     V2 VITALS TAB — Expected vitals, ETCO2, Rhythm log, H's & T's
  ============================================================ */
  .cr-vitals-card {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 8px;
    margin-bottom: 12px;
    box-shadow: var(--clin-shadow);
    overflow: hidden;
  }
  .cr-vitals-head {
    background: var(--clin-blue-light);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--clin-border);
  }
  .cr-vitals-head .ico {
    width: 30px;
    height: 30px;
    background: var(--clin-blue);
    color: white;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .cr-vitals-head .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--clin-text);
    text-transform: uppercase;
    flex: 1;
  }
  .cr-vitals-head .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--clin-text-dim);
    letter-spacing: 0.06em;
  }
  .cr-vitals-body { padding: 14px; }

  /* Expected vitals grid */
  .cr-vital-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cr-vital-tile {
    background: var(--clin-surface-alt);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid var(--clin-blue);
  }
  .cr-vital-tile .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cr-vital-tile .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--clin-text);
    line-height: 1.1;
  }
  .cr-vital-tile .value .unit {
    font-size: 12px;
    color: var(--clin-text-dim);
    font-weight: 500;
    margin-left: 4px;
  }
  .cr-vital-tile .sub {
    font-size: 11px;
    color: var(--clin-text-muted);
    margin-top: 2px;
  }

  /* ETCO2 reference */
  .cr-etco2-bands {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .cr-etco2-band {
    display: grid;
    grid-template-columns: 90px 1fr;
    align-items: center;
    padding: 10px 12px;
    border-radius: 5px;
    background: var(--clin-surface-alt);
    border-left: 4px solid var(--clin-text-muted);
  }
  .cr-etco2-band.danger { border-left-color: var(--clin-red); background: #fde8e8; }
  .cr-etco2-band.warning { border-left-color: var(--clin-yellow); background: #fdf5d4; }
  .cr-etco2-band.good { border-left-color: var(--clin-green); background: #e6f5ea; }
  .cr-etco2-band.rosc { border-left-color: var(--clin-blue); background: var(--clin-blue-light); }
  .cr-etco2-range {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--clin-text);
  }
  .cr-etco2-desc {
    font-size: 12px;
    color: var(--clin-text);
    line-height: 1.4;
  }

  /* Rhythm log buttons + timeline */
  .cr-rhythm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cr-rhythm-btn-v2 {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 12px 6px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cr-rhythm-btn-v2:hover { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cr-rhythm-btn-v2.shockable { border-color: var(--clin-red); color: var(--clin-red); }
  .cr-rhythm-btn-v2.shockable:hover { background: var(--clin-red); color: white; }
  .cr-rhythm-btn-v2.nonshockable { border-color: var(--clin-yellow); color: #b8860b; }
  .cr-rhythm-btn-v2.nonshockable:hover { background: var(--clin-yellow); color: var(--clin-text); }
  .cr-rhythm-btn-v2.rosc { border-color: var(--clin-green); color: var(--clin-green); }
  .cr-rhythm-btn-v2.rosc:hover { background: var(--clin-green); color: white; }

  .cr-rhythm-timeline {
    background: var(--clin-surface-alt);
    border-radius: 6px;
    padding: 10px;
    max-height: 220px;
    overflow-y: auto;
  }
  .cr-rhythm-empty {
    text-align: center;
    color: var(--clin-text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 14px;
  }
  .cr-rhythm-entry {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--clin-border);
    font-size: 13px;
    align-items: center;
  }
  .cr-rhythm-entry:last-child { border-bottom: none; }
  .cr-rhythm-entry .time {
    font-family: 'JetBrains Mono', monospace;
    color: var(--clin-blue);
    font-weight: 700;
    font-size: 12px;
  }
  .cr-rhythm-entry .rhythm {
    color: var(--clin-text);
    font-weight: 600;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.02em;
  }
  .cr-rhythm-entry .rhythm.shockable { color: var(--clin-red); }
  .cr-rhythm-entry .rhythm.nonshockable { color: #b8860b; }
  .cr-rhythm-entry .rhythm.rosc { color: var(--clin-green); }

  /* H's & T's checklist */
  .cr-hts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .cr-ht-tile {
    background: var(--clin-surface-alt);
    border: 1.5px solid var(--clin-border);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    color: var(--clin-text);
    font-family: inherit;
    transition: all 0.12s;
  }
  .cr-ht-tile:hover { border-color: var(--clin-blue); }
  .cr-ht-tile.addressed {
    background: #e6f5ea;
    border-color: var(--clin-green);
  }
  .cr-ht-tile.addressed .label::before { content: '✓ '; color: var(--clin-green); font-weight: 700; }
  .cr-ht-tile .label {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--clin-text);
    letter-spacing: 0.02em;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .cr-ht-tile .detail {
    font-size: 11px;
    color: var(--clin-text-dim);
    line-height: 1.35;
  }

  @media (max-width: 520px) {
    .cr-vital-grid { grid-template-columns: 1fr; }
    .cr-hts-grid { grid-template-columns: 1fr; }
    .cr-rhythm-buttons { grid-template-columns: 1fr 1fr; }
    .cr-vital-tile .value { font-size: 18px; }
  }

  /* ============================================================
     V2 CLINICAL FOOTNOTE + EQUIPMENT / ELECTRICAL CARDS
  ============================================================ */
  .cr-meds-footnote {
    padding: 12px 14px;
    background: rgba(253, 202, 104, 0.14);
    border-top: 1px solid var(--clin-border);
    font-size: 11px;
    color: var(--clin-text-dim);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.5;
  }
  .cr-meds-footnote strong { color: #b8860b; }

  .cr-equip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .cr-equip-tile {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-left: 3px solid var(--clin-blue);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .cr-equip-tile .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cr-equip-tile .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--clin-text);
    line-height: 1.2;
  }
  .cr-equip-tile .detail {
    font-size: 11px;
    color: var(--clin-text-muted);
    margin-top: 4px;
    line-height: 1.3;
  }

  .cr-elec-stack {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .cr-elec-card-v2 {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-left: 4px solid var(--clin-text-muted);
    border-radius: 6px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .cr-elec-card-v2.defib { border-left-color: var(--clin-red); }
  .cr-elec-card-v2.cv { border-left-color: var(--clin-yellow); }
  .cr-elec-card-v2.pace { border-left-color: var(--clin-blue); }
  .cr-elec-card-v2.torsades { border-left-color: var(--clin-red); }
  .cr-elec-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--clin-red);
    line-height: 1;
    margin-bottom: 6px;
  }
  .cr-elec-title .sub {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--clin-text-dim);
    margin-top: 4px;
  }
  .cr-elec-info .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cr-elec-info .primary {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--clin-text);
    line-height: 1.1;
  }
  .cr-elec-info .secondary {
    font-size: 12px;
    color: var(--clin-text-dim);
    margin-top: 4px;
  }
  .cr-elec-info .detail {
    font-size: 11px;
    color: var(--clin-text-muted);
    margin-top: 4px;
    line-height: 1.35;
  }
  .cr-elec-action {
    background: var(--clin-surface);
    border: 2px solid var(--clin-blue);
    color: var(--clin-blue);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 11px;
