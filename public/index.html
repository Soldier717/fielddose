// More tab → H's & T's: tap-to-toggle addressed reversible causes
function renderMoreHts() {
  return `
    <div class="cr-log-section-head" style="display:flex;justify-content:space-between;align-items:baseline;">
      <span>⚠ Reversible Causes · H's &amp; T's</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--clin-text-dim);font-weight:500;text-transform:none;letter-spacing:0.04em;">${crHTsAddressed.size}/${CC_HS_TS.length} addressed</span>
    </div>
    <div class="cr-hts-grid">
      ${CC_HS_TS.map(item => `
        <button class="cr-ht-tile ${crHTsAddressed.has(item.label) ? 'addressed' : ''}" data-vital-ht="${escapeAttr(item.label)}">
          <div class="label">${escapeHtml(item.label)}</div>
          <div class="detail">${escapeHtml(item.detail)}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function rcBuildDrugButtons(drugs) {
  return drugs.map((d) => `
    <button class="rc-drug-card ${d.primary ? 'primary' : ''}" data-drug-name="${escapeAttr(d.name)}">
      <div class="rc-drug-card-head">
        <div class="name">${d.name}</div>
        <div class="ind">${d.indication}</div>
      </div>
      <div class="rc-drug-row dose"><span class="label">Drug & Dose</span><span class="value">${d.weightDose}</span></div>
      <div class="rc-drug-row package"><span class="label">Package</span><span class="value">${d.packageSpec || d.readyVol || '—'}</span></div>
      <div class="rc-drug-row delivery"><span class="label">Delivery</span><span class="value">${d.deliveryDose || d.readyVol || '—'}</span></div>
    </button>
  `).join('');
}

function rcRenderTabCode(kg, elec) {
  // Code tab: ARREST drugs only, filtered by rhythm
  const arrestDrugs = ccFilterArrestDrugs(ccGetDrugs());
  const drugButtons = rcBuildDrugButtons(arrestDrugs);
  const rhythmTag = ctState.lastRhythm === 'shockable' ? 'VF / pVT pathway'
    : ctState.lastRhythm === 'nonshockable' ? 'PEA / Asystole pathway'
    : 'All arrest meds · select rhythm to filter';

  return `
    <!-- Timer Display -->
    <div class="ct-display" id="ct-display" style="margin-bottom:16px;">
      <div class="ct-total-time">Total: <span class="v" id="ct-total-val">${ctFormatTime(ctState.elapsedMs)}</span></div>
      <div class="ct-cycle-label">Cycle <span class="ct-cycle-num" id="ct-cycle-num">${ctState.cycleNum}</span> · CPR Time</div>
      <div class="ct-time" id="ct-time">${ctFormatTime(ctState.elapsedMs % 120000)}</div>
      <div class="ct-time-sub">of 2:00 — rhythm check</div>
      <div class="ct-pulse-area">
        <div class="ct-pulse-dot" id="ct-pulse-dot"></div>
        <div class="ct-pulse-label"><span class="v">${ctState.bpm}</span> BPM</div>
      </div>
      <div style="display:flex;justify-content:center;gap:24px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;">
        <span>Shocks: <span style="color:var(--accent-bright);font-weight:700;" id="ct-shock-count">${ctState.shockCount}</span></span>
        <span>Epi: <span style="color:${ctState.cumulativeEpiMg >= 3 ? '#ff6b4a' : 'var(--gold)'};font-weight:700;" id="ct-epi-count">${ctState.cumulativeEpiMg.toFixed(1)}</span> / 3 mg</span>
      </div>
    </div>

    <!-- Start / Reset Controls -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:20px;">
      <button class="ct-btn ${ctState.running ? 'stop' : 'start'}" id="ct-start-btn" style="font-size:18px;padding:18px;">
        ${ctState.running ? '⏸ Pause' : (ctState.elapsedMs > 0 ? '▶ Resume' : '▶ Start Code')}
      </button>
      <button class="ct-btn" id="ct-reset-btn" style="padding:18px;">↻ Reset</button>
    </div>

    <!-- Shock / Rhythm -->
    <div class="cc-section priority" style="margin-bottom:20px;">
      <div class="cc-section-head">
        <span class="cc-section-num">⚡</span>
        <span class="cc-section-title">Shock / Rhythm</span>
        <span class="cc-section-tag">Tap to log</span>
      </div>
      <div class="rc-drug-grid">
        <button class="rc-drug-btn rc-shock-btn" id="rc-shock-defib">
          <div class="name">Defibrillation</div>
          <div class="dose">${elec.defib.primary}</div>
          <div class="vol">${elec.defib.secondary}</div>
          <div class="ind">VF / pVT · A/P pads</div>
        </button>
        <button class="rc-drug-btn rc-shock-btn" id="rc-shock-cv">
          <div class="name">Cardioversion</div>
          <div class="dose">${elec.cardiovert.primary}</div>
          <div class="vol">Synchronized</div>
          <div class="ind">Unstable tachycardia</div>
        </button>
      </div>
      <div class="rc-action-row" style="margin-top:10px;">
        <button class="rc-rhythm-btn" data-rhythm="VF/pVT">VF / pVT</button>
        <button class="rc-rhythm-btn" data-rhythm="PEA">PEA</button>
        <button class="rc-rhythm-btn" data-rhythm="Asystole">Asystole</button>
        <button class="rc-rhythm-btn rosc" data-rhythm="ROSC" id="rc-rosc-btn">✓ ROSC</button>
      </div>
    </div>

    <!-- Arrest Drugs (filtered) -->
    <div class="cc-section priority" style="margin-bottom:20px;">
      <div class="cc-section-head">
        <span class="cc-section-num">💉</span>
        <span class="cc-section-title">Arrest Drugs — ${ccFmt(kg, 1)} kg</span>
        <span class="cc-section-tag">${rhythmTag}</span>
      </div>
      <div class="rc-drug-grid">${drugButtons}</div>
    </div>

    <!-- H's & T's -->
    <details class="cc-section" style="margin-bottom:20px;">
      <summary style="cursor:pointer;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--border);">H's & T's — Reversible Causes</summary>
      <div class="cc-hts-grid" style="margin-top:14px;">
        ${CC_HS_TS.map(item => `<div class="cc-ht-card"><div class="label">${item.label}</div><div class="detail">${item.detail}</div></div>`).join('')}
      </div>
    </details>

    <div class="ct-log">
      <div class="ct-log-title">Code Log<button class="ct-log-clear" id="ct-log-clear">Clear</button></div>
      <div id="ct-log-list"><div class="ct-log-empty">No events logged yet</div></div>
    </div>
  `;
}

function crFindProto(id) {
  for (const c of CC_PROTOCOLS) { const p = c.list.find(x => x.id === id); if (p) return p; }
  return null;
}

// Map a protocol line to a canonical drug name in the current patient's list (or null).
function crProtoDrugMatch(text) {
  const t = text.toLowerCase();
  const KEY = [
    ['norepinephrine', 'Norepinephrine (Levophed)'],
    ['levophed', 'Norepinephrine (Levophed)'],
    ['epinephrine 0.5 mg', 'Epinephrine 1:1,000'],
    ['epinephrine 1 mg', 'Epinephrine 1:10,000'],
    ['epinephrine', 'Epinephrine'],
    ['amiodarone', 'Amiodarone'],
    ['lidocaine', 'Lidocaine'],
    ['magnesium', 'Magnesium Sulfate'],
    ['calcium chloride', 'Calcium Chloride 10%'],
    ['sodium bicarbonate', 'Sodium Bicarbonate'],
    ['albuterol', 'Albuterol'],
    ['dexamethasone', 'Dexamethasone'],
    ['solu-medrol', 'Solu-Medrol'],
    ['diphenhydramine', 'Diphenhydramine'],
    ['atropine', 'Atropine'],
    ['adenosine', 'Adenosine (Adenocard)'],
    ['diltiazem', 'Diltiazem'],
    ['aspirin', 'Aspirin'],
    ['nitroglycerin', 'Nitroglycerine'],
    ['naloxone', 'Naloxone (Narcan)'],
    ['ondansetron', 'Ondansetron'],
    ['midazolam', 'Midazolam (Versed)'],
    ['versed', 'Midazolam (Versed)'],
    ['fentanyl', 'Fentanyl (Sublimaze)'],
    ['ketamine', 'Ketamine (Ketalar)'],
    ['hydromorphone', 'Hydromorphone (Dilaudid)'],
    ['morphine', 'Morphine'],
    ['ketorolac', 'Ketorolac (Toradol)'],
    ['acetaminophen', 'Acetaminophen (Tylenol)'],
    ['lorazepam', 'Lorazepam (Ativan)'],
    ['diazepam', 'Diazepam (Valium)'],
    ['droperidol', 'Droperidol'],
    ['promethazine', 'Promethazine (Phenergan)'],
    ['labetalol', 'Labetalol'],
    ['levetiracetam', 'Levetiracetam (Keppra)'],
    ['keppra', 'Levetiracetam (Keppra)'],
    ['cyanokit', 'Hydroxocobalamin (Cyanokit)'],
    ['hydroxocobalamin', 'Hydroxocobalamin (Cyanokit)'],
    ['whole blood', 'Whole Blood'],
    ['oral glucose', 'Oral Glucose'],
    ['d10w', 'D10W'],
    ['txa', 'Tranexamic Acid (TXA)'],
    ['tranexamic', 'Tranexamic Acid (TXA)'],
  ];
  const drugs = ccGetDrugs();
  for (const [kw, name] of KEY) {
    if (t.includes(kw)) {
      const exact = drugs.find(d => d.name === name);
      if (exact) return exact.name;
      const first = name.split(/[ (]/)[0].toLowerCase();
      const partial = drugs.find(d => d.name.toLowerCase().includes(first));
      return partial ? partial.name : null;
    }
  }
  return null;
}

function rcRenderProtocolView() {
  if (cr.protocolSel) {
    const p = crFindProto(cr.protocolSel);

    cr.protocolSel = null;

  const groups = CC_PROTOCOLS.map(c => `

// Drugs the unit does not currently stock — rendered dimmed, tagged "FUTURE USE",
// and non-clickable (no dose modal) in both the Full List and By Protocol links.
// Add the exact drug-list name(s) here to flag them.
const CC_FUTURE_USE = new Set([
  // e.g. 'Labetalol', 'Whole Blood', 'Levetiracetam (Keppra)',
]);
function crIsFutureUse(name) { return CC_FUTURE_USE.has(name); }

function rcRenderProtocolDetail(p) {
  const sec = (label, items, warn) => `
    <div class="cc-proto-section${warn ? ' warn' : ''}">
      <div class="cc-proto-section-label">${warn ? '⚠ ' : ''}${escapeHtml(label)}</div>
      ${items.map(it => {
        if (it && it.jump) {
          return `<button class="cc-proto-item jump" data-proto-sel="${escapeAttr(it.jump)}"><span>${escapeHtml(it.t)}</span><span class="arrow">→</span></button>`;
        }
        const match = warn ? null : crProtoDrugMatch(it);
        if (match && crIsFutureUse(match))
          return `<div class="cc-proto-item future"><span>${escapeHtml(it)}</span><span class="future-tag">FUTURE USE</span></div>`;
        return match
          ? `<button class="cc-proto-item drug" data-drug-name="${escapeAttr(match)}"><span>${escapeHtml(it)}</span><span class="arrow">›</span></button>`
          : `<div class="cc-proto-item">${escapeHtml(it)}</div>`;
      }).join('')}
    </div>`;
  const pedsNote = (cr.patient && cr.patient.type === 'peds')
    ? `<div class="cc-proto-peds-note">⚠ Pediatric patient — tap a drug for the weight-based pediatric dose. Inline doses are reference values.</div>`
    : '';
  let body;
  if (p.memory) {
    body = `<div class="cc-proto-memory">${p.memory.map(([d, dose]) => `<div class="cc-mem-row"><span class="cc-mem-drug">${escapeHtml(d)}</span><span class="cc-mem-dose">${escapeHtml(dose)}</span></div>`).join('')}</div>`;
  } else {
    const pearls = (p.pearls || []).map(t => `<div class="cc-proto-pearl"><span class="lbl">PEARL</span> ${escapeHtml(t)}</div>`).join('');
    body = `<div class="cc-proto-detail">${(p.sections || []).map(s => sec(s.label, s.items, false)).join('')}${p.warn ? sec(p.warn.label, p.warn.items, true) : ''}${pearls}</div>`;
  }
  return `
    <button class="cc-proto-back" data-proto-back>‹ All Protocols</button>
    <div class="cr-meds-banner"><span class="ico">▣</span><span>${escapeHtml(p.banner || p.name)}</span></div>
    ${pedsNote}
    ${body}
  `;
}

        <summary style="cursor:pointer;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--border);">H's & T's — Reversible Causes</summary>
        <div class="cc-hts-grid" style="margin-top:14px;">
          ${CC_HS_TS.map(item => `<div class="cc-ht-card"><div class="label">${item.label}</div><div class="detail">${item.detail}</div></div>`).join('')}
        </div>
      </details>
      <div class="ct-log">
        <div class="ct-log-title">Code Log<button class="ct-log-clear" id="ct-log-clear">Clear</button></div>
        <div id="ct-log-list"></div>
      </div>
    `;
    const wrapper = document.createElement('div');
    wrapper.innerHTML = html;
    while (wrapper.firstChild) content.appendChild(wrapper.firstChild);
    rcBindDynamicElements();
  } else {
    const empty = document.createElement('div');
    empty.className = 'cc-empty';
    empty.textContent = 'Enter patient weight to load doses';
    content.appendChild(empty);
  }
}

function rcBindDynamicElements() {
  // Refresh pulse dot reference (Code tab re-creates this element)
  ctState.pulseDotEl = document.getElementById('ct-pulse-dot');

  // Start / Pause / Resume button (Code tab)
  const startBtn = document.getElementById('ct-start-btn');
  if (startBtn) startBtn.addEventListener('click', () => {
    if (ctState.running) ctPause(); else ctStart();
    const hint = document.getElementById('ct-audio-hint');
    if (hint) hint.classList.remove('show');
  });

  // Reset button (Code tab)
  const resetBtn = document.getElementById('ct-reset-btn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (ctState.elapsedMs > 0 && !confirm('Reset timer? Code log will be kept.')) return;
    ctReset();
  });

  // Drug buttons — open the V2 detail modal (Requested → Given workflow)
  document.querySelectorAll('[data-drug-name]').forEach(btn => {
    btn.addEventListener('click', () => crShowDrugModal(btn.dataset.drugName));
  });

  // V2 Meds sub-tabs (Full List / By Protocol)
  document.querySelectorAll('[data-meds-view]').forEach(b => {
    b.addEventListener('click', () => {
      cr.medsView = b.dataset.medsView;
      cr.protocolSel = null;
      rcPartialRender();
    });
  });

  // By Protocol — select a protocol / back to menu
  document.querySelectorAll('[data-proto-sel]').forEach(b => {
    b.addEventListener('click', () => {
      cr.protocolSel = b.dataset.protoSel;
      rcPartialRender();
    });
  });
  const protoBack = document.querySelector('[data-proto-back]');
  if (protoBack) protoBack.addEventListener('click', () => {
    cr.protocolSel = null;
    rcPartialRender();
  });

  // V2 More sub-tabs (Pt. Log / Target Vitals / EtCO₂ / H's & T's)
  document.querySelectorAll('[data-more-view]').forEach(b => {
    b.addEventListener('click', () => {
      cr.moreView = b.dataset.moreView;
      rcPartialRender();
    });
  });

  // V2 Drips tab — row clicks open the drug modal with drip data
  document.querySelectorAll('[data-drip-name]').forEach(b => {
    b.addEventListener('click', () => crShowDripModal(b.dataset.dripName));
  });

  // V2 Electrical tab — defib launcher opens energy ladder modal
  const elecDefibBtn = document.getElementById('cr-elec-defib-open');
  if (elecDefibBtn) elecDefibBtn.addEventListener('click', crShowDefibModal);
  const elecCvBtn = document.getElementById('cr-elec-cv-log');
  if (elecCvBtn) elecCvBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctLogEvent('Cardiovert', `${e.cardiovert.primary} sync`);
    ctShowCueBanner('Cardioversion logged', 'normal', 1800);
    rcPartialRender();
  });

  // V2 Vitals tab — rhythm log buttons
  document.querySelectorAll('[data-vital-rhythm]').forEach(b => {
    b.addEventListener('click', () => {
      const r = b.dataset.vitalRhythm;
      if (r === 'ROSC') ctMarkROSC();
      else ctMarkRhythm(r);
      rcPartialRender();
    });
  });

  // V2 Vitals tab — H's & T's checklist toggles
  document.querySelectorAll('[data-vital-ht]').forEach(b => {
    b.addEventListener('click', () => {
      crToggleHT(b.dataset.vitalHt);
      rcPartialRender();
    });
  });

  // Defib button
  const defibBtn = document.getElementById('rc-shock-defib');
  if (defibBtn) defibBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctState.shockCount++;
    ctLogEvent('Shock', `Defib #${ctState.shockCount} — ${e.defib.primary} (${e.defib.secondary})`);
    ctShowCueBanner(`Shock #${ctState.shockCount} Delivered — Resume CPR`, 'normal', 1800);
    ctSpeak('Shock delivered. Resume CPR.');
    ctState.lastRhythm = null;
    rcPartialRender();
  });

  // Cardioversion button
  const cvBtn = document.getElementById('rc-shock-cv');
  if (cvBtn) cvBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctLogEvent('Cardiovert', `${e.cardiovert.primary} sync`);
    ctShowCueBanner('Cardioversion logged', 'normal', 1800);
  });

  // Rhythm buttons (VF/pVT, PEA, Asystole, ROSC)
  document.querySelectorAll('.rc-rhythm-btn').forEach(b => {
    b.addEventListener('click', () => {
      const r = b.dataset.rhythm;
      if (r === 'ROSC') ctMarkROSC();
      else { ctMarkRhythm(r); rcPartialRender(); }
    });
  });

  // Code log clear
  const clearBtn = document.getElementById('ct-log-clear');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (ctState.log.length === 0) return;
    if (confirm('Clear all logged events?')) ctClearLog();
  });

  // Re-render log into new container
  ctRenderLog();

  // If timer is running and Code tab is now active, ensure display updates resume
  if (ctState.running && ctState.activeTab === 'code') {
    ctUpdateDisplay(ctState.elapsedMs % 120000, ctState.elapsedMs);
  }
}

function bindRunCodeEvents() {
  // ENTRY FLOW — Adult/Peds picker
  const goPeds = document.getElementById('cr-go-peds');
  if (goPeds) goPeds.addEventListener('click', () => { cr.view = 'entry-peds'; render(); });
  const goAdult = document.getElementById('cr-go-adult');
  if (goAdult) goAdult.addEventListener('click', () => { cr.view = 'entry-adult'; render(); });
  const back = document.getElementById('cr-entry-back');
  if (back) back.addEventListener('click', () => { cr.view = 'entry'; render(); });

  // ENTRY FLOW — Adult IBW tiles + custom
  document.querySelectorAll('[data-ibw-kg]').forEach(t => {
    t.addEventListener('click', () => {
      const kg = parseInt(t.dataset.ibwKg);
      const ibw = ADULT_IBW.find(x => x.kg === kg);
      if (ibw) crSetAdultIBW(ibw);
    });
  });
  const adultCustomGo = document.getElementById('cr-adult-custom-go');
  if (adultCustomGo) adultCustomGo.addEventListener('click', () => {
    const v = parseFloat(document.getElementById('cr-adult-custom').value);
    crSetAdultCustom(v);
  });
  const adultCustomInput = document.getElementById('cr-adult-custom');
  if (adultCustomInput) adultCustomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') crSetAdultCustom(parseFloat(e.target.value));
  });

  // ENTRY FLOW — Pediatric Broselow zones + custom
  document.querySelectorAll('[data-zone]').forEach(z => {
    z.addEventListener('click', () => {
      const zone = BROSELOW.find(x => x.code === z.dataset.zone);
      if (zone) crSetBroselow(zone);
    });
  });
  const pedsCustomGo = document.getElementById('cr-peds-custom-go');
  if (pedsCustomGo) pedsCustomGo.addEventListener('click', () => {
    const kg = parseFloat(document.getElementById('cr-peds-custom-kg').value);
    const age = parseFloat(document.getElementById('cr-peds-custom-age').value) || null;
    crSetPedsCustom(kg, age);
  });

  // DOSE VIEW — New Patient button (clears everything, returns to entry)
  const newPat = document.getElementById('cr-new-patient');
  if (newPat) newPat.addEventListener('click', crNewPatient);

  // DOSE VIEW — Start/Stop CPR button (patient bar, right side)
  const cprToggle = document.getElementById('cr-cpr-toggle');
  if (cprToggle) cprToggle.addEventListener('click', () => {
    if (ctState.running) ctPause(); else ctStart();
    render();  // re-render to swap button + show/hide CPR control bar
  });

  // CPR CONTROL BAR — compact controls (only present when CPR running)
  document.querySelectorAll('[data-cpr-ratio]').forEach(b => {
    b.addEventListener('click', () => {
      ctState.cprRatio = b.dataset.cprRatio;
      // Continuous = advanced airway (no vent cues); 15:2 / 30:2 = cycled
      ctState.advancedAirway = (ctState.cprRatio === 'continuous');
      ctSaveSettings();
      ctLogEvent('Ratio', `Compression ratio set to ${ctState.cprRatio}`);
      rcPartialRender();
    });
  });
  const cprResetBtn = document.getElementById('cpr-reset-btn');
  if (cprResetBtn) cprResetBtn.addEventListener('click', () => {
    if (ctState.elapsedMs > 0 && !confirm('Reset cycle and time? Code log will be kept.')) return;
    ctReset();
    render();
  });
  const cprDefibBtn = document.getElementById('cpr-defib-btn');
  if (cprDefibBtn) cprDefibBtn.addEventListener('click', crShowDefibModal);

  const cprEpiBtn = document.getElementById('cpr-epi-btn');
  if (cprEpiBtn) cprEpiBtn.addEventListener('click', () => {
    // Open Epi modal directly (find first Epi entry in current band's drug list)
    const epi = ccGetDrugs().find(d => /^Epinephrine( 1:10,000)?$/.test(d.name) && d.rhythm === 'all')
              || ccGetDrugs().find(d => d.name.startsWith('Epinephrine'));
    if (epi) crShowDrugModal(epi.name);
  });

  // Refresh pulse mini-dot ref for metronome flashing
  ctState.pulseDotEl = document.getElementById('cr-pulse-mini') || document.getElementById('ct-pulse-dot');

  // Bottom tab bar — switch the tab content area
  document.querySelectorAll('[data-rc-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      ctState.activeTab = btn.dataset.rcTab;
      rcPartialRender();
    });
  });

  // Rhythm check decision panel (shows at 2:00) — SHOCK / NO SHOCK
  const shockBtn = document.getElementById('rc-decision-shock');
  if (shockBtn) shockBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctState.shockCount++;
    ctState.lastRhythm = null;
    ctLogEvent('Shock', `Defib #${ctState.shockCount} — ${e.defib.primary} (rhythm check decision)`);
    ctShowCueBanner(`Shock #${ctState.shockCount} Delivered — Resume CPR`, 'normal', 2000);
    ctSpeak('Shock delivered. Resume CPR.');
    rcHideDecisionPanel();
    rcPartialRender();
  });
  const noShockBtn = document.getElementById('rc-decision-noshock');
  if (noShockBtn) noShockBtn.addEventListener('click', () => {
    ctState.lastRhythm = null;
    ctLogEvent('No Shock', `No shock — Resume CPR, consider epi`);
    ctShowCueBanner('No Shock — Resume CPR · Check Epi', 'epi', 2000);
    ctSpeak('No shock. Resume CPR, check epi.');
    rcHideDecisionPanel();
    rcPartialRender();
  });

  // Settings toggles (only on full render — settings panel is below tabs)
  document.querySelectorAll('.ct-toggle').forEach(t => {
    t.addEventListener('click', () => {
      const setting = t.dataset.setting;
      ctState[setting] = !ctState[setting];
      t.classList.toggle('on', ctState[setting]);
      ctSaveSettings();
    });
  });
  const bpmSlider = document.getElementById('ct-bpm-slider');
  if (bpmSlider) bpmSlider.addEventListener('input', (e) => {
    ctState.bpm = parseInt(e.target.value);
    const bpmVal = document.getElementById('ct-bpm-val');
    if (bpmVal) bpmVal.textContent = ctState.bpm + ' BPM';
    const pulseLabel = document.querySelector('.ct-pulse-label .v');
    if (pulseLabel) pulseLabel.textContent = ctState.bpm;
    if (ctState.running) {
      const cycleMs = performance.now() - ctState.cycleStartMs;
      ctState.metronomeBeats = Math.floor(cycleMs / (60000 / ctState.bpm));
    }
    ctSaveSettings();
  });

  // Show audio hint if not yet unlocked
  if (!ctState.audioUnlocked) {
    const hint = document.getElementById('ct-audio-hint');
    if (hint) hint.classList.add('show');
  }

  // Bind the tab content elements (Start/Reset/drugs/shock/rhythm/log)
  rcBindDynamicElements();
}
</script>
</body>
</html>
