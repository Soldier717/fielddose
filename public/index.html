function crFindProto(id) {
  for (const c of CC_PROTOCOLS) { const p = c.list.find(x => x.id === id); if (p) return p; }
  return null;
}

// Map a protocol line to a canonical drug name in the current patient's list (or null).
function crProtoDrugMatch(text) {
  const t = text.toLowerCase();
  const KEY = [
    ['norepinephrine', 'Norepinephrine (Levophed)'],
    ['levophed', 'Norepinephrine (Levophed)'],
    ['epinephrine 0.5 mg', 'Epinephrine 1:1,000'],
    ['epinephrine 1 mg', 'Epinephrine 1:10,000'],
    ['epinephrine', 'Epinephrine'],
    ['amiodarone', 'Amiodarone'],
    ['lidocaine', 'Lidocaine'],
    ['magnesium', 'Magnesium Sulfate'],
    ['calcium chloride', 'Calcium Chloride 10%'],
    ['sodium bicarbonate', 'Sodium Bicarbonate'],
    ['albuterol', 'Albuterol'],
    ['dexamethasone', 'Dexamethasone'],
    ['solu-medrol', 'Solu-Medrol'],
    ['diphenhydramine', 'Diphenhydramine'],
    ['atropine', 'Atropine'],
    ['adenosine', 'Adenosine (Adenocard)'],
    ['diltiazem', 'Diltiazem'],
    ['aspirin', 'Aspirin'],
    ['nitroglycerin', 'Nitroglycerine'],
    ['naloxone', 'Naloxone (Narcan)'],
    ['ondansetron', 'Ondansetron'],
    ['midazolam', 'Midazolam (Versed)'],
    ['versed', 'Midazolam (Versed)'],
    ['fentanyl', 'Fentanyl (Sublimaze)'],
    ['ketamine', 'Ketamine (Ketalar)'],
    ['hydromorphone', 'Hydromorphone (Dilaudid)'],
    ['morphine', 'Morphine'],
    ['ketorolac', 'Ketorolac (Toradol)'],
    ['acetaminophen', 'Acetaminophen (Tylenol)'],
    ['lorazepam', 'Lorazepam (Ativan)'],
    ['diazepam', 'Diazepam (Valium)'],
    ['droperidol', 'Droperidol'],
    ['promethazine', 'Promethazine (Phenergan)'],
    ['labetalol', 'Labetalol'],
    ['levetiracetam', 'Levetiracetam (Keppra)'],
    ['keppra', 'Levetiracetam (Keppra)'],
    ['cyanokit', 'Hydroxocobalamin (Cyanokit)'],
    ['hydroxocobalamin', 'Hydroxocobalamin (Cyanokit)'],
    ['whole blood', 'Whole Blood'],
    ['oral glucose', 'Oral Glucose'],
    ['d10w', 'D10W'],
    ['txa', 'Tranexamic Acid (TXA)'],
    ['tranexamic', 'Tranexamic Acid (TXA)'],
  ];
  const drugs = ccGetDrugs();
  for (const [kw, name] of KEY) {
    if (t.includes(kw)) {
      const exact = drugs.find(d => d.name === name);
      if (exact) return exact.name;
      const first = name.split(/[ (]/)[0].toLowerCase();
      const partial = drugs.find(d => d.name.toLowerCase().includes(first));
      return partial ? partial.name : null;
    }
  }
  return null;
}

function rcRenderProtocolView() {
  if (cr.protocolSel) {
    const p = crFindProto(cr.protocolSel);
    if (p) return rcRenderProtocolDetail(p);
    cr.protocolSel = null;
  }
  const groups = CC_PROTOCOLS.map(c => `
    <div class="cc-proto-group">
      <div class="cc-proto-cat-label">${escapeHtml(c.cat)}</div>
      ${c.list.map(p => `<button class="cc-proto-btn" data-proto-sel="${escapeAttr(p.id)}"><span>${escapeHtml(p.name)}</span><span class="arrow">›</span></button>`).join('')}
    </div>
  `).join('');
  return `<div class="cc-proto-menu">${groups}</div>`;
}

// Drugs the unit does not currently stock — rendered dimmed, tagged "FUTURE USE",
// and non-clickable (no dose modal) in both the Full List and By Protocol links.
// Add the exact drug-list name(s) here to flag them.
const CC_FUTURE_USE = new Set([
  // e.g. 'Labetalol', 'Whole Blood', 'Levetiracetam (Keppra)',
]);
function crIsFutureUse(name) { return CC_FUTURE_USE.has(name); }

function rcRenderProtocolDetail(p) {
  const sec = (label, items, warn) => `
    <div class="cc-proto-section${warn ? ' warn' : ''}">
      <div class="cc-proto-section-label">${warn ? '⚠ ' : ''}${escapeHtml(label)}</div>
      ${items.map(it => {
        if (it && it.jump) {
          return `<button class="cc-proto-item jump" data-proto-sel="${escapeAttr(it.jump)}"><span>${escapeHtml(it.t)}</span><span class="arrow">→</span></button>`;
        }
        const match = warn ? null : crProtoDrugMatch(it);
        if (match && crIsFutureUse(match))
          return `<div class="cc-proto-item future"><span>${escapeHtml(it)}</span><span class="future-tag">FUTURE USE</span></div>`;
        return match
          ? `<button class="cc-proto-item drug" data-drug-name="${escapeAttr(match)}"><span>${escapeHtml(it)}</span><span class="arrow">›</span></button>`
          : `<div class="cc-proto-item">${escapeHtml(it)}</div>`;
      }).join('')}
    </div>`;
  const pedsNote = (cr.patient && cr.patient.type === 'peds')
    ? `<div class="cc-proto-peds-note">⚠ Pediatric patient — tap a drug for the weight-based pediatric dose. Inline doses are reference values.</div>`
    : '';
  let body;
  if (p.memory) {
    body = `<div class="cc-proto-memory">${p.memory.map(([d, dose]) => `<div class="cc-mem-row"><span class="cc-mem-drug">${escapeHtml(d)}</span><span class="cc-mem-dose">${escapeHtml(dose)}</span></div>`).join('')}</div>`;
  } else {
    const pearls = (p.pearls || []).map(t => `<div class="cc-proto-pearl"><span class="lbl">PEARL</span> ${escapeHtml(t)}</div>`).join('');
    body = `<div class="cc-proto-detail">${(p.sections || []).map(s => sec(s.label, s.items, false)).join('')}${p.warn ? sec(p.warn.label, p.warn.items, true) : ''}${pearls}</div>`;
  }
  return `
    <button class="cc-proto-back" data-proto-back>‹ All Protocols</button>
    <div class="cr-meds-banner"><span class="ico">▣</span><span>${escapeHtml(p.banner || p.name)}</span></div>
    ${pedsNote}
    ${body}
  `;
}

function rcRenderTabMeds(kg, elec) {
  // V2 tabular layout — Drug | Conc | Vol | Rt rows
  // Sub-views: 'full' (all meds alphabetical) | 'protocol' (treatment algorithms)
  const view = cr.medsView || 'full';

  // By Protocol — structured treatment algorithms (select → drill in)
  if (view === 'protocol') {
    return `
    <div class="cr-meds-card has-subtabs">
      <div class="cr-meds-header">
        <div class="cr-meds-icon">📋</div>
        <div class="cr-meds-title">Protocols · ${ccFmt(kg, 1)} kg</div>
      </div>
      <div class="cr-meds-subtabs">
        <button class="cr-meds-subtab" data-meds-view="full">Full List</button>
        <button class="cr-meds-subtab active" data-meds-view="protocol">By Protocol</button>
      </div>
      ${rcRenderProtocolView()}
    </div>
    `;
  }

  // Full List — all meds, alphabetical
  const drugs = [...ccGetDrugs()].sort((a, b) => a.name.localeCompare(b.name));
  const rows = drugs.length === 0
    ? `<div class="cr-drug-empty">No drugs match this view</div>`
    : drugs.map(d => {
        const arrest = rcIsArrestDrug(d);
        const future = crIsFutureUse(d.name);
        const inner = `
            <div class="cr-drug-cell drug">
              <div class="name">${escapeHtml(d.name)}</div>
              <div class="ind">${escapeHtml(d.indication || '')}</div>
            </div>
            <div class="cr-drug-cell conc">${escapeHtml(rcParseConc(d.packageSpec))}</div>
            <div class="cr-drug-cell vol">${escapeHtml(rcParseVol(d.deliveryDose || d.readyVol || d.weightDose))}</div>
            <div class="cr-drug-cell rt">
              ${future
                ? '<span class="future-tag">FUTURE USE</span>'
                : `<span class="route-label">${escapeHtml(rcParseRoute(d.route))}</span><span class="arrow">›</span>`}
            </div>`;
        return future
          ? `<div class="cr-drug-row future">${inner}</div>`
          : `<button class="cr-drug-row ${arrest ? 'arrest' : ''}" data-drug-name="${escapeAttr(d.name)}">${inner}</button>`;
      }).join('');

  return `
    <div class="cr-meds-card has-subtabs">
      <div class="cr-meds-header">
        <div class="cr-meds-icon">💊</div>
        <div class="cr-meds-title">Medications · ${ccFmt(kg, 1)} kg</div>
      </div>
      <div class="cr-meds-subtabs">
        <button class="cr-meds-subtab active" data-meds-view="full">Full List</button>
        <button class="cr-meds-subtab" data-meds-view="protocol">By Protocol</button>
      </div>
      <div class="cr-drug-table">
        <div class="cr-drug-row header">
          <div>Drug</div>
          <div>Conc.</div>
          <div>Vol.</div>
          <div>Rt.</div>
        </div>
        ${rows}
      </div>
    </div>
  `;
}

function rcPartialRender() {
  // V2: only meaningful in dose view; full re-render handles entry views
  if (cr.view !== 'dose' || !cr.patient) { render(); return; }

  const content = document.querySelector('.content.ct-wrap');
  if (!content) return;

  const kg = parseFloat(ccState.weight) || cr.patient.weight;
  const valid = kg > 0 && kg < 300;
  ccState.ageBand = rcDeriveBand(kg);
  ccState.unit = 'kg';

  const startBtn = document.getElementById('ct-start-btn');
  if (startBtn) startBtn.disabled = !valid;

  // Update the shock/epi counters in the timer display
  const shockEl = document.getElementById('ct-shock-count');
  if (shockEl) shockEl.textContent = ctState.shockCount;
  const epiEl = document.getElementById('ct-epi-count');
  if (epiEl) {
    epiEl.textContent = ctState.cumulativeEpiMg.toFixed(1);
    epiEl.style.color = ctState.cumulativeEpiMg >= 3 ? '#ff6b4a' : 'var(--gold)';
  }

  // Re-render the tab content block in place
  const tabContent = document.getElementById('rc-tab-content');
  if (valid && tabContent) {
    const elec = ccGetElectrical();
    const drugs = ccFilterDrugsByRhythm(ccGetDrugs());
    const a = ccGetAirway();
    const drugButtons = drugs.map((d, i) => `
      <button class="rc-drug-card ${d.primary ? 'primary' : ''}" data-drug-idx="${i}">
        <div class="rc-drug-card-head">
          <div class="name">${d.name}</div>
          <div class="ind">${d.indication}</div>
        </div>
        <div class="rc-drug-row dose">
          <span class="label">Drug & Dose</span>
          <span class="value">${d.weightDose}</span>
        </div>
        <div class="rc-drug-row package">
          <span class="label">Package</span>
          <span class="value">${d.packageSpec || d.readyVol || '—'}</span>
        </div>
        <div class="rc-drug-row delivery">
          <span class="label">Delivery</span>
          <span class="value">${d.deliveryDose || d.readyVol || '—'}</span>
        </div>
      </button>
    `).join('');
    tabContent.innerHTML = rcRenderTabContent(kg, elec, drugs, a, drugButtons);
    rcBindDynamicElements();
  }

  // Update bottom bar active state
  document.querySelectorAll('[data-rc-tab]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.rcTab === ctState.activeTab);
  });
  return;

  // Legacy fallback (unreachable) — kept for reference
  if (false) {
    const html = `
      <div class="cc-section priority" style="margin-bottom:20px;">
        <div class="cc-section-head"><span class="cc-section-num">⚡</span><span class="cc-section-title">Shock / Rhythm</span><span class="cc-section-tag">Tap to log</span></div>
        <div class="rc-drug-grid">
          <button class="rc-drug-btn rc-shock-btn" id="rc-shock-defib"><div class="name">Defibrillation</div><div class="dose">${elec.defib.primary}</div><div class="vol">${elec.defib.secondary}</div><div class="ind">VF / pVT</div></button>
          <button class="rc-drug-btn rc-shock-btn" id="rc-shock-cv"><div class="name">Cardioversion</div><div class="dose">${elec.cardiovert.primary}</div><div class="vol">Synchronized</div><div class="ind">Unstable tachycardia</div></button>
        </div>
        <div class="rc-action-row" style="margin-top:10px;">
          <button class="rc-rhythm-btn" data-rhythm="VF/pVT">VF / pVT</button>
          <button class="rc-rhythm-btn" data-rhythm="PEA">PEA</button>
          <button class="rc-rhythm-btn" data-rhythm="Asystole">Asystole</button>
          <button class="rc-rhythm-btn rosc" data-rhythm="ROSC" id="rc-rosc-btn">✓ ROSC</button>
        </div>
      </div>
      <div class="cc-section priority" style="margin-bottom:20px;">
        <div class="cc-section-head"><span class="cc-section-num">💉</span><span class="cc-section-title">Drugs — ${ccFmt(kg, 1)} kg</span><span class="cc-section-tag">${ctState.lastRhythm === 'shockable' ? 'VF / pVT pathway' : ctState.lastRhythm === 'nonshockable' ? 'PEA / Asystole pathway' : 'All drugs · select rhythm to filter'}</span></div>
        <div class="rc-drug-grid">${drugButtons}</div>
      </div>
      <details class="cc-section" style="margin-bottom:20px;">
        <summary style="cursor:pointer;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--border);">Airway Reference</summary>
        <div class="cc-info-grid" style="margin-top:14px;">
          <div class="cc-info-card"><div class="label">ET Tube</div><div class="value">${a.ettCuffed}</div><div class="detail">Depth: ${a.ettDepth}</div></div>
          <div class="cc-info-card"><div class="label">IO Needle</div><div class="value" style="font-size:16px;">${a.io}</div></div>
          <div class="cc-info-card"><div class="label">Supraglottic</div><div class="value" style="font-size:16px;">${a.lma}</div></div>
          <div class="cc-info-card"><div class="label">BVM</div><div class="value" style="font-size:14px;">${a.bvm}</div></div>
        </div>
      </details>
      <details class="cc-section" style="margin-bottom:20px;">
        <summary style="cursor:pointer;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--border);">H's & T's — Reversible Causes</summary>
        <div class="cc-hts-grid" style="margin-top:14px;">
          ${CC_HS_TS.map(item => `<div class="cc-ht-card"><div class="label">${item.label}</div><div class="detail">${item.detail}</div></div>`).join('')}
        </div>
      </details>
      <div class="ct-log">
        <div class="ct-log-title">Code Log<button class="ct-log-clear" id="ct-log-clear">Clear</button></div>
        <div id="ct-log-list"></div>
      </div>
    `;
    const wrapper = document.createElement('div');
    wrapper.innerHTML = html;
    while (wrapper.firstChild) content.appendChild(wrapper.firstChild);
    rcBindDynamicElements();
  } else {
    const empty = document.createElement('div');
    empty.className = 'cc-empty';
    empty.textContent = 'Enter patient weight to load doses';
    content.appendChild(empty);
  }
}

function rcBindDynamicElements() {
  // Refresh pulse dot reference (Code tab re-creates this element)
  ctState.pulseDotEl = document.getElementById('ct-pulse-dot');

  // Start / Pause / Resume button (Code tab)
  const startBtn = document.getElementById('ct-start-btn');
  if (startBtn) startBtn.addEventListener('click', () => {
    if (ctState.running) ctPause(); else ctStart();
    const hint = document.getElementById('ct-audio-hint');
    if (hint) hint.classList.remove('show');
  });

  // Reset button (Code tab)
  const resetBtn = document.getElementById('ct-reset-btn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (ctState.elapsedMs > 0 && !confirm('Reset timer? Code log will be kept.')) return;
    ctReset();
  });

  // Drug buttons — open the V2 detail modal (Requested → Given workflow)
  document.querySelectorAll('[data-drug-name]').forEach(btn => {
    btn.addEventListener('click', () => crShowDrugModal(btn.dataset.drugName));
  });

  // V2 Meds sub-tabs (Full List / By Protocol)
  document.querySelectorAll('[data-meds-view]').forEach(b => {
    b.addEventListener('click', () => {
      cr.medsView = b.dataset.medsView;
      cr.protocolSel = null;
      rcPartialRender();
    });
  });

  // By Protocol — select a protocol / back to menu
  document.querySelectorAll('[data-proto-sel]').forEach(b => {
    b.addEventListener('click', () => {
      cr.protocolSel = b.dataset.protoSel;
      rcPartialRender();
    });
  });
  const protoBack = document.querySelector('[data-proto-back]');
  if (protoBack) protoBack.addEventListener('click', () => {
    cr.protocolSel = null;
    rcPartialRender();
  });

  // V2 More sub-tabs (Pt. Log / Target Vitals / EtCO₂ / H's & T's)
  document.querySelectorAll('[data-more-view]').forEach(b => {
    b.addEventListener('click', () => {
      cr.moreView = b.dataset.moreView;
      rcPartialRender();
    });
  });

  // V2 Drips tab — row clicks open the drug modal with drip data
  document.querySelectorAll('[data-drip-name]').forEach(b => {
    b.addEventListener('click', () => crShowDripModal(b.dataset.dripName));
  });

  // V2 Electrical tab — defib launcher opens energy ladder modal
  const elecDefibBtn = document.getElementById('cr-elec-defib-open');
  if (elecDefibBtn) elecDefibBtn.addEventListener('click', crShowDefibModal);
  const elecCvBtn = document.getElementById('cr-elec-cv-log');
  if (elecCvBtn) elecCvBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctLogEvent('Cardiovert', `${e.cardiovert.primary} sync`);
    ctShowCueBanner('Cardioversion logged', 'normal', 1800);
    rcPartialRender();
  });

  // V2 Vitals tab — rhythm log buttons
  document.querySelectorAll('[data-vital-rhythm]').forEach(b => {
    b.addEventListener('click', () => {
      const r = b.dataset.vitalRhythm;
      if (r === 'ROSC') ctMarkROSC();
      else ctMarkRhythm(r);
      rcPartialRender();
    });
  });

  // V2 Vitals tab — H's & T's checklist toggles
  document.querySelectorAll('[data-vital-ht]').forEach(b => {
    b.addEventListener('click', () => {
      crToggleHT(b.dataset.vitalHt);
      rcPartialRender();
    });
  });

  // Defib button
  const defibBtn = document.getElementById('rc-shock-defib');
  if (defibBtn) defibBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctState.shockCount++;
    ctLogEvent('Shock', `Defib #${ctState.shockCount} — ${e.defib.primary} (${e.defib.secondary})`);
    ctShowCueBanner(`Shock #${ctState.shockCount} Delivered — Resume CPR`, 'normal', 1800);
    ctSpeak('Shock delivered. Resume CPR.');
    ctState.lastRhythm = null;
    rcPartialRender();
  });

  // Cardioversion button
  const cvBtn = document.getElementById('rc-shock-cv');
  if (cvBtn) cvBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctLogEvent('Cardiovert', `${e.cardiovert.primary} sync`);
    ctShowCueBanner('Cardioversion logged', 'normal', 1800);
  });

  // Rhythm buttons (VF/pVT, PEA, Asystole, ROSC)
  document.querySelectorAll('.rc-rhythm-btn').forEach(b => {
    b.addEventListener('click', () => {
      const r = b.dataset.rhythm;
      if (r === 'ROSC') ctMarkROSC();
      else { ctMarkRhythm(r); rcPartialRender(); }
    });
  });

  // Code log clear
  const clearBtn = document.getElementById('ct-log-clear');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (ctState.log.length === 0) return;
    if (confirm('Clear all logged events?')) ctClearLog();
  });

  // Share the active session's worksheet (snapshot first so it's current)
  const shareBtn = document.getElementById('ct-log-share');
  if (shareBtn) shareBtn.addEventListener('click', () => {
    if (!cr.chartId) { showToast('No active patient chart', true); return; }
    chartSaveActive();
    chartShare(cr.chartId);
  });

  // Re-render log into new container
  ctRenderLog();

  // If timer is running and Code tab is now active, ensure display updates resume
  if (ctState.running && ctState.activeTab === 'code') {
    ctUpdateDisplay(ctState.elapsedMs % 120000, ctState.elapsedMs);
  }
}

function bindRunCodeEvents() {
  // ENTRY FLOW — Adult/Peds picker
  const goPeds = document.getElementById('cr-go-peds');
  if (goPeds) goPeds.addEventListener('click', () => { cr.view = 'entry-peds'; render(); });
  const goAdult = document.getElementById('cr-go-adult');
  if (goAdult) goAdult.addEventListener('click', () => { cr.view = 'entry-adult'; render(); });
  const back = document.getElementById('cr-entry-back');
  if (back) back.addEventListener('click', () => { cr.view = 'entry'; render(); });

  // ENTRY FLOW — Adult IBW tiles + custom
  document.querySelectorAll('[data-ibw-kg]').forEach(t => {
    t.addEventListener('click', () => {
      const kg = parseInt(t.dataset.ibwKg);
      const ibw = ADULT_IBW.find(x => x.kg === kg);
      if (ibw) crSetAdultIBW(ibw);
    });
  });
  const adultCustomGo = document.getElementById('cr-adult-custom-go');
  if (adultCustomGo) adultCustomGo.addEventListener('click', () => {
    const v = parseFloat(document.getElementById('cr-adult-custom').value);
    crSetAdultCustom(v);
  });
  const adultCustomInput = document.getElementById('cr-adult-custom');
  if (adultCustomInput) adultCustomInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') crSetAdultCustom(parseFloat(e.target.value));
  });

  // ENTRY FLOW — saved patient charts (reopen / delete)
  document.querySelectorAll('[data-chart-open]').forEach(row => {
    row.addEventListener('click', () => chartOpen(row.dataset.chartOpen));
  });
  document.querySelectorAll('[data-chart-del]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Delete this patient chart?')) return;
      chartDelete(btn.dataset.chartDel);
      render();
    });
  });
  document.querySelectorAll('[data-chart-share]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      chartShare(btn.dataset.chartShare);
    });
  });

  // ENTRY FLOW — Pediatric Broselow zones + custom
  document.querySelectorAll('[data-zone]').forEach(z => {
    z.addEventListener('click', () => {
      const zone = BROSELOW.find(x => x.code === z.dataset.zone);
      if (zone) crSetBroselow(zone);
    });
  });
  const pedsCustomGo = document.getElementById('cr-peds-custom-go');
  if (pedsCustomGo) pedsCustomGo.addEventListener('click', () => {
    const kg = parseFloat(document.getElementById('cr-peds-custom-kg').value);
    const age = parseFloat(document.getElementById('cr-peds-custom-age').value) || null;
    crSetPedsCustom(kg, age);
  });

  // DOSE VIEW — New Patient button (clears everything, returns to entry)
  const newPat = document.getElementById('cr-new-patient');
  if (newPat) newPat.addEventListener('click', crNewPatient);

  // DOSE VIEW — Start/Stop CPR button (patient bar, right side)
  const cprToggle = document.getElementById('cr-cpr-toggle');
  if (cprToggle) cprToggle.addEventListener('click', () => {
    if (ctState.running) ctPause(); else ctStart();
    render();  // re-render to swap button + show/hide CPR control bar
  });

  // CPR CONTROL BAR — compact controls (only present when CPR running)
  document.querySelectorAll('[data-cpr-ratio]').forEach(b => {
    b.addEventListener('click', () => {
      ctState.cprRatio = b.dataset.cprRatio;
      // Continuous = advanced airway (no vent cues); 15:2 / 30:2 = cycled
      ctState.advancedAirway = (ctState.cprRatio === 'continuous');
      ctSaveSettings();
      ctLogEvent('Ratio', `Compression ratio set to ${ctState.cprRatio}`);
      rcPartialRender();
    });
  });
  const cprResetBtn = document.getElementById('cpr-reset-btn');
  if (cprResetBtn) cprResetBtn.addEventListener('click', () => {
    if (ctState.elapsedMs > 0 && !confirm('Reset cycle and time? Code log will be kept.')) return;
    ctReset();
    render();
  });
  const cprDefibBtn = document.getElementById('cpr-defib-btn');
  if (cprDefibBtn) cprDefibBtn.addEventListener('click', crShowDefibModal);

  const cprEpiBtn = document.getElementById('cpr-epi-btn');
  if (cprEpiBtn) cprEpiBtn.addEventListener('click', () => {
    // Open Epi modal directly (find first Epi entry in current band's drug list)
    const epi = ccGetDrugs().find(d => /^Epinephrine( 1:10,000)?$/.test(d.name) && d.rhythm === 'all')
              || ccGetDrugs().find(d => d.name.startsWith('Epinephrine'));
    if (epi) crShowDrugModal(epi.name);
  });

  // Refresh pulse mini-dot ref for metronome flashing
  ctState.pulseDotEl = document.getElementById('cr-pulse-mini') || document.getElementById('ct-pulse-dot');

  // Bottom tab bar — switch the tab content area
  document.querySelectorAll('[data-rc-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      ctState.activeTab = btn.dataset.rcTab;
      rcPartialRender();
    });
  });

  // Rhythm check decision panel (shows at 2:00) — SHOCK / NO SHOCK
  const shockBtn = document.getElementById('rc-decision-shock');
  if (shockBtn) shockBtn.addEventListener('click', () => {
    const e = ccGetElectrical();
    ctState.shockCount++;
    ctState.lastRhythm = null;
    ctLogEvent('Shock', `Defib #${ctState.shockCount} — ${e.defib.primary} (rhythm check decision)`);
    ctShowCueBanner(`Shock #${ctState.shockCount} Delivered — Resume CPR`, 'normal', 2000);
    ctSpeak('Shock delivered. Resume CPR.');
    rcHideDecisionPanel();
    rcPartialRender();
  });
  const noShockBtn = document.getElementById('rc-decision-noshock');
  if (noShockBtn) noShockBtn.addEventListener('click', () => {
    ctState.lastRhythm = null;
    ctLogEvent('No Shock', `No shock — Resume CPR, consider epi`);
    ctShowCueBanner('No Shock — Resume CPR · Check Epi', 'epi', 2000);
    ctSpeak('No shock. Resume CPR, check epi.');
    rcHideDecisionPanel();
    rcPartialRender();
  });

  // Settings toggles (only on full render — settings panel is below tabs)
  document.querySelectorAll('.ct-toggle').forEach(t => {
    t.addEventListener('click', () => {
      const setting = t.dataset.setting;
      ctState[setting] = !ctState[setting];
      t.classList.toggle('on', ctState[setting]);
      ctSaveSettings();
    });
  });
  const bpmSlider = document.getElementById('ct-bpm-slider');
  if (bpmSlider) bpmSlider.addEventListener('input', (e) => {
    ctState.bpm = parseInt(e.target.value);
    const bpmVal = document.getElementById('ct-bpm-val');
    if (bpmVal) bpmVal.textContent = ctState.bpm + ' BPM';
    const pulseLabel = document.querySelector('.ct-pulse-label .v');
    if (pulseLabel) pulseLabel.textContent = ctState.bpm;
    if (ctState.running) {
      const cycleMs = performance.now() - ctState.cycleStartMs;
      ctState.metronomeBeats = Math.floor(cycleMs / (60000 / ctState.bpm));
    }
    ctSaveSettings();
  });

  // Show audio hint if not yet unlocked
  if (!ctState.audioUnlocked) {
    const hint = document.getElementById('ct-audio-hint');
    if (hint) hint.classList.add('show');
  }

  // Bind the tab content elements (Start/Reset/drugs/shock/rhythm/log)
  rcBindDynamicElements();
}
</script>

<script>
/* ============================================================
   Quick-Reference Left Dashboard (QRef) — additive & isolated.
   No dependency on the calculator (render/ctState/cr/currentPage).
============================================================ */
(function () {
  'use strict';

  // Built-in TOOL cards (fixed order). Add more by appending here.
  const TOOL_CARDS = [
    {
      id: 'map',
      name: 'MAP Calculator',
      meta: 'Mean arterial pressure',
      icon: '<svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>',
      render: renderMapTool,
      bind: bindMapTool,
    },
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return Math.round(b / 1024) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  const PDF_ICON = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  const IMG_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

  // ---- references state + IndexedDB (device-local) ----
  let refCards = [];        // cached, sorted by order
  let editMode = false;
  let searchTerm = '';
  let docUrl = null;        // active object URL in the viewer
  // ---- cloud sync API (shared across all devices via /api/qref) ----
  const API = '/api/qref';
  let qrefPw = sessionStorage.getItem('qref_pw') || '';

  // Get the edit password, prompting once and caching for the session.
  async function ensurePw() {
    if (qrefPw) return qrefPw;
    const pw = await showPrompt('Enter the upload password', '');
    if (pw == null || pw === '') return null;
    qrefPw = pw;
    sessionStorage.setItem('qref_pw', pw);
    return pw;
  }
  // Run an authed mutation; on a wrong-password (401) clear the cache and retry once.
  async function authedFetch(opts) {
    let pw = await ensurePw();
    if (pw == null) return null;
    let res = await opts(pw);
    if (res.status === 401) {
      qrefPw = ''; sessionStorage.removeItem('qref_pw');
      pw = await ensurePw();
      if (pw == null) return null;
      res = await opts(pw);
    }
    return res;
  }
  async function apiError(res, fallback) {
    let msg = fallback;
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
    window.alert(msg);
  }

  async function apiList() {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error('list failed');
    return (await r.json()).cards || [];
  }
  // Mutations return fresh data from the server response (the list blob is
  // eventually consistent, so we trust the response over a re-fetch). Return
  // null on cancel/error so callers leave the current list untouched.
  async function apiUpload(file, name, type) {
    const res = await authedFetch((pw) => fetch(API, {
      method: 'POST',
      headers: {
        'x-qref-password': pw,
        'x-qref-name': encodeURIComponent(name),
        'x-qref-type': type,
        'content-type': file.type || 'application/octet-stream',
      },
      body: file,
    }));
    if (res == null) return null;
    if (!res.ok) { await apiError(res, 'Upload failed.'); return null; }
    return (await res.json()).card || null;
  }
  async function apiPatch(payload) {
    const res = await authedFetch((pw) => fetch(API, {
      method: 'PATCH',
      headers: { 'x-qref-password': pw, 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    }));
    if (res == null) return null;
    if (!res.ok) { await apiError(res, 'Update failed.'); return null; }
    return (await res.json()).cards || null;
  }
  async function apiDelete(id) {
    const res = await authedFetch((pw) => fetch(API + '?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { 'x-qref-password': pw },
    }));
    if (res == null) return null;
    if (!res.ok) { await apiError(res, 'Delete failed.'); return null; }
    return (await res.json()).cards || null;
  }

  function openDrawer() {
    $('qref-backdrop').classList.add('open');
    $('qref-drawer').classList.add('open');
    $('qref-drawer').setAttribute('aria-hidden', 'false');
  }
  function closeDrawer() {
    $('qref-backdrop').classList.remove('open');
    $('qref-drawer').classList.remove('open');
    $('qref-drawer').setAttribute('aria-hidden', 'true');
  }

  function renderDrawer() {
    const tools = TOOL_CARDS.map((c) => `
      <button class="qref-card" data-qref-tool="${c.id}">
        <span class="qref-card-ico">${c.icon}</span>
        <span class="qref-card-text">
          <span class="qref-card-name">${c.name}</span>
          <span class="qref-card-meta">${c.meta || ''}</span>
        </span>
      </button>`).join('');

    $('qref-body').innerHTML = `
      <div class="qref-section-head"><span>Tools</span></div>
      ${tools}
      <div class="qref-section-head">
        <span>References</span>
        <span class="qref-head-actions">
          <button class="qref-btn" id="qref-edit-toggle">Edit</button>
          <button class="qref-btn" id="qref-add">+ Add</button>
        </span>
      </div>
      <input class="qref-search" id="qref-search" type="search" placeholder="Search references…" autocomplete="off">
      <div id="qref-ref-cards"></div>
    `;

    document.querySelectorAll('[data-qref-tool]').forEach((el) => {
      el.addEventListener('click', () => {
        const card = TOOL_CARDS.find((c) => c.id === el.dataset.qrefTool);
        if (card) openViewer(card);
      });
    });

    $('qref-add').addEventListener('click', () => $('qref-file').click());
    $('qref-edit-toggle').addEventListener('click', () => {
      editMode = !editMode;
      $('qref-edit-toggle').classList.toggle('active', editMode);
      renderRefCards();
    });
    $('qref-search').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim().toLowerCase();
      renderRefCards();
    });
    loadReferences();
  }

  // ---- references list + CRUD ----
  async function loadReferences() {
    try { refCards = await apiList(); }
    catch (e) { refCards = []; }
    refCards.sort((a, b) => (a.order || 0) - (b.order || 0));
    renderRefCards();
  }

  function renderRefCards() {
    const wrap = $('qref-ref-cards');
    const search = $('qref-search');
    if (!wrap) return;
    if (!refCards.length) {
      if (search) search.style.display = 'none';
      wrap.innerHTML = '<div class="qref-empty">No references yet.<br>Tap <b>+ Add</b> to upload a PDF or image.</div>';
      return;
    }
    if (search) search.style.display = '';
    const list = searchTerm ? refCards.filter((c) => c.name.toLowerCase().includes(searchTerm)) : refCards;
    if (!list.length) {
      wrap.innerHTML = '<div class="qref-empty">No matches.</div>';
      return;
    }
    wrap.innerHTML = list.map((c) => {
      const ico = c.type === 'pdf' ? PDF_ICON : IMG_ICON;
      const ctrls = editMode
        ? '<span class="qref-card-ctrls">' +
          '<button data-act="up" title="Move up">↑</button>' +
          '<button data-act="down" title="Move down">↓</button>' +
          '<button data-act="rename" title="Rename">✎</button>' +
          '<button class="del" data-act="del" title="Delete">✕</button>' +
          '</span>'
        : '';
      return '<div class="qref-card" data-qref-doc="' + c.id + '">' +
        '<span class="qref-card-ico">' + ico + '</span>' +
        '<span class="qref-card-text">' +
        '<span class="qref-card-name">' + esc(c.name) + '</span>' +
        '<span class="qref-card-meta">' + c.type.toUpperCase() + ' · ' + fmtSize(c.size) + '</span>' +
        '</span>' + ctrls + '</div>';
    }).join('');

    wrap.querySelectorAll('[data-qref-doc]').forEach((el) => {
      el.addEventListener('click', (ev) => {
        const card = refCards.find((c) => c.id === el.dataset.qrefDoc);
        if (!card) return;
        const actBtn = ev.target.closest('[data-act]');
        if (actBtn) { ev.stopPropagation(); handleCardAction(actBtn.dataset.act, card); }
        else openDocViewer(card);
      });
    });
  }

  function applyCards(cards) {
    if (!cards) return;
    refCards = cards;
    refCards.sort((a, b) => (a.order || 0) - (b.order || 0));
    renderRefCards();
  }

  async function handleCardAction(act, card) {
    if (act === 'del') {
      if (!window.confirm('Delete “' + card.name + '”?')) return;
      applyCards(await apiDelete(card.id));
    } else if (act === 'rename') {
      const name = await showPrompt('Rename reference', card.name);
      if (name == null) return;
      applyCards(await apiPatch({ action: 'rename', id: card.id, name: name }));
    } else if (act === 'up' || act === 'down') {
      const i = refCards.indexOf(card);
      const j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= refCards.length) return;
      const ids = refCards.map((c) => c.id);
      ids.splice(j, 0, ids.splice(i, 1)[0]);   // move card to its new slot
      applyCards(await apiPatch({ action: 'reorder', ids: ids }));
    }
  }

  const UPLOAD_CAP = 4.4 * 1048576;   // serverless payload ceiling
  const IMG_EXT = /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/i;

  // Decide image vs pdf. Mobile often leaves file.type blank, so fall back to
  // the filename extension, and treat an unknown type as an image to try.
  function detectType(file) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) return 'pdf';
    if ((file.type && file.type.indexOf('image/') === 0) || IMG_EXT.test(file.name || '')) return 'image';
    if (!file.type) return 'image';
    return null;
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  // Re-encode any decodable image (incl. iPhone HEIC) to a JPEG that displays on
  // every device and fits under the upload cap. Returns null if it can't decode.
  async function compressImage(file) {
    let img;
    try { img = await loadImage(file); } catch (e) { return null; }
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    if (!w || !h) return null;
    const MAX_DIM = 2200;
    const scale = Math.min(1, MAX_DIM / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const toBlob = (q) => new Promise((r) => canvas.toBlob(r, 'image/jpeg', q));
    let q = 0.85, blob = await toBlob(q);
    while (blob && blob.size > 3.8 * 1048576 && q > 0.4) { q -= 0.15; blob = await toBlob(q); }
    return blob;
  }

  async function addFile(file) {
    if (!file) return;
    const type = detectType(file);
    if (!type) { window.alert('Please choose a PDF or image file.'); return; }
    const base = (file.name || 'reference').replace(/\.[^.]+$/, '');

    let upload = file;
    if (type === 'image') {
      const jpeg = await compressImage(file);   // normalize HEIC/large photos → JPEG
      if (jpeg) {
        upload = jpeg;
      } else if (file.size > UPLOAD_CAP) {
        window.alert("Couldn't process this image, and it's " + fmtSize(file.size) +
          ' (over the ~4.4 MB limit). Try a screenshot of it instead.');
        return;
      }
    } else if (file.size > UPLOAD_CAP) {   // pdf
      window.alert('This PDF is ' + fmtSize(file.size) +
        '. The limit is about 4.4 MB — please compress it and try again.');
      return;
    }

    const name = await showPrompt('Name this reference', base);
    if (name == null) return;
    const card = await apiUpload(upload, name, type);
    if (card) {
      refCards.push(card);          // show immediately; the shared list is eventually consistent
      refCards.sort((a, b) => (a.order || 0) - (b.order || 0));
      renderRefCards();
    }
  }

  // ---- name / rename prompt ----
  let promptResolve = null;
  function showPrompt(title, initial) {
    return new Promise((resolve) => {
      promptResolve = resolve;
      $('qref-prompt-title').textContent = title;
      const input = $('qref-prompt-input');
      input.value = initial || '';
      $('qref-prompt').classList.add('open');
      setTimeout(() => { input.focus(); input.select(); }, 30);
    });
  }
  function closePrompt(val) {
    $('qref-prompt').classList.remove('open');
    const r = promptResolve; promptResolve = null;
    if (r) r(val);
  }

  function openViewer(card) {
    $('qref-doc-open').style.display = 'none';
    $('qref-viewer-body').classList.remove('is-pdf');
    $('qref-viewer-title').textContent = card.name;
    $('qref-viewer-body').innerHTML = '<div class="qref-tool">' + card.render() + '</div>';
    if (card.bind) card.bind();
    $('qref-viewer').classList.add('open');
  }
  function openDocViewer(card) {
    docUrl = card.url;   // public cloud URL; no object URL to revoke
    $('qref-viewer-title').textContent = card.name;
    const body = $('qref-viewer-body');
    const openBtn = $('qref-doc-open');
    if (card.type === 'image') {
      body.classList.remove('is-pdf');
      body.innerHTML = '<img class="qref-doc-img" src="' + docUrl + '" alt="">';
      openBtn.style.display = 'none';
    } else {
      body.classList.add('is-pdf');
      body.innerHTML = '<iframe class="qref-doc-frame" src="' + docUrl + '"></iframe>';
      openBtn.href = docUrl;
      openBtn.style.display = '';
    }
    $('qref-viewer').classList.add('open');
  }
  function closeViewer() {
    $('qref-viewer').classList.remove('open');
    $('qref-viewer-body').innerHTML = '';
    $('qref-viewer-body').classList.remove('is-pdf');
    docUrl = null;
  }

  // ---- MAP calculator tool ----
  function renderMapTool() {
    return `
      <div class="qref-tool-inputs">
        <div class="qref-field">
          <label for="qref-map-sbp">Systolic</label>
          <input id="qref-map-sbp" type="number" inputmode="numeric" min="0" max="400" placeholder="—">
          <div class="qref-unit">SBP · mmHg</div>
        </div>
        <div class="qref-field">
          <label for="qref-map-dbp">Diastolic</label>
          <input id="qref-map-dbp" type="number" inputmode="numeric" min="0" max="400" placeholder="—">
          <div class="qref-unit">DBP · mmHg</div>
        </div>
      </div>
      <div class="qref-result">
        <div class="qref-result-label">Mean Arterial Pressure</div>
        <div class="qref-result-value dim" id="qref-map-out">—</div>
        <div id="qref-map-chip"></div>
      </div>
      <div class="qref-formula">MAP = <code>(SBP + 2 × DBP) ÷ 3</code></div>
      <div class="qref-disclaimer">
        A MAP ≥ 65 mmHg is a common adult perfusion goal &mdash; always confirm
        against current local protocols and medical control. Training &amp;
        reference only.
      </div>
    `;
  }

  function bindMapTool() {
    const sbpEl = $('qref-map-sbp');
    const dbpEl = $('qref-map-dbp');
    const out = $('qref-map-out');
    const chip = $('qref-map-chip');

    function recompute() {
      const sbp = parseFloat(sbpEl.value);
      const dbp = parseFloat(dbpEl.value);
      if (!isFinite(sbp) || !isFinite(dbp) || sbp <= 0 || dbp <= 0) {
        out.textContent = '—';
        out.classList.add('dim');
        chip.innerHTML = '';
        return;
      }
      const map = Math.round((sbp + 2 * dbp) / 3);
      out.classList.remove('dim');
      out.innerHTML = map + ' <small>mmHg</small>';
      chip.innerHTML = map >= 65
        ? '<span class="qref-chip ok">≥ 65 · at / above target</span>'
        : '<span class="qref-chip low">&lt; 65 · below target</span>';
    }
    sbpEl.addEventListener('input', recompute);
    dbpEl.addEventListener('input', recompute);
    sbpEl.focus();
  }

  // Park the button on the same row as the "Regional Common Treatment
  // Guidelines" tag, pinned hard left. Measured so it tracks the logo's
  // scaling and re-renders; clamped to stay inside the red band.
  function positionFab() {
    const fab = $('qref-fab');
    const header = document.querySelector('.fd-header');
    if (!fab || !header) return;
    const h = header.getBoundingClientRect();
    const logo = document.querySelector('.fd-logo');
    if (logo && !logo.complete) logo.addEventListener('load', scheduleReposition, { once: true });
    const sub = document.querySelector('.fd-sub');
    const centerY = sub ? (sub.getBoundingClientRect().top + sub.offsetHeight / 2)
                        : (h.bottom - 24);
    let top = centerY - fab.offsetHeight / 2;             // align with the tag line
    top = Math.min(top, h.bottom - fab.offsetHeight - 6); // stay inside the red band
    top = Math.max(top, h.top + 6);
    fab.style.top = Math.round(top) + 'px';
    fab.style.left = Math.round(h.left + 10) + 'px';
  }

  let repositionPending = false;
  function scheduleReposition() {
    if (repositionPending) return;
    repositionPending = true;
    requestAnimationFrame(() => { repositionPending = false; positionFab(); });
  }

  function init() {
    renderDrawer();
    $('qref-fab').addEventListener('click', openDrawer);
    $('qref-close').addEventListener('click', closeDrawer);
    $('qref-backdrop').addEventListener('click', closeDrawer);
    $('qref-viewer-back').addEventListener('click', closeViewer);

    $('qref-file').addEventListener('change', (e) => {
      addFile(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    $('qref-prompt-save').addEventListener('click', () => closePrompt($('qref-prompt-input').value.trim() || null));
    $('qref-prompt-cancel').addEventListener('click', () => closePrompt(null));
    $('qref-prompt-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); closePrompt($('qref-prompt-input').value.trim() || null); }
      else if (e.key === 'Escape') { e.stopPropagation(); closePrompt(null); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if ($('qref-prompt').classList.contains('open')) closePrompt(null);
      else if ($('qref-viewer').classList.contains('open')) closeViewer();
      else if ($('qref-drawer').classList.contains('open')) closeDrawer();
    });

    // keep the button under the logo through layout/resize/re-render
    positionFab();
    window.addEventListener('load', scheduleReposition);
    window.addEventListener('resize', scheduleReposition);
    const main = document.getElementById('main');
    if (main) new MutationObserver(scheduleReposition).observe(main, { childList: true });
    setTimeout(scheduleReposition, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script>
// Offline support — see sw.js for the caching strategy.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
