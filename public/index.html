  body.on-coderun .main .ct-toggle-label .sub { color: var(--clin-text-dim); }

  /* Decision panel — light theme */
  body.on-coderun .main .rc-decision {
    background: var(--clin-surface);
    border-color: var(--clin-border);
  }
  body.on-coderun .main .rc-decision.show { border-color: var(--clin-red); }
  body.on-coderun .main .rc-decision-title { color: var(--clin-red); }

  @media (max-width: 720px) {
    .cpr-row-top, .cpr-row-bot { grid-template-columns: 1fr; }
    .cpr-ratio-group { grid-template-columns: 1fr 1fr; }
    .cpr-row-mid { gap: 8px; }
    .cpr-reset-btn { width: 64px; height: 64px; font-size: 12px; }
  }

  /* ============================================================
     V2 TABULAR MEDS — Drug | Conc | Vol | Rt rows, arrest = red
  ============================================================ */
  .cr-meds-card {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 8px;
    /* overflow must stay visible: hidden would break the sticky card
       header / subtabs / column row inside (sticky pins to the nearest
       clipping ancestor). Corners are rounded on the children instead. */
    overflow: visible;
    margin-bottom: 12px;
    box-shadow: var(--clin-shadow);
  }
  .cr-meds-card > :first-child { border-radius: 8px 8px 0 0; }
  .cr-meds-card > :last-child { border-radius: 0 0 8px 8px; }
  .cr-meds-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--clin-blue-light);
    border-bottom: 1px solid var(--clin-border);
    position: sticky;
    top: calc(var(--fd-hdr-h) + var(--fd-patbar-h));
    z-index: 58;
    height: var(--fd-cardhd-h);
    box-sizing: border-box;
  }
  .cr-meds-card .cr-meds-subtabs {
    position: sticky;
    top: calc(var(--fd-hdr-h) + var(--fd-patbar-h) + var(--fd-cardhd-h));
    z-index: 57;
    height: var(--fd-subtab-h);
  }
  .cr-meds-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--clin-blue);
    color: white;
    border-radius: 6px;
    font-size: 18px;
  }
  .cr-meds-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.04em;
    color: var(--clin-text);
    flex: 1;
  }
  .cr-meds-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .cr-meds-subtabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--clin-surface-alt);
    border-bottom: 1px solid var(--clin-border);
  }
  .cr-meds-subtab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 12px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--clin-text-muted);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .cr-meds-subtab.active {
    background: var(--clin-surface);
    color: var(--clin-text);
    border-bottom-color: var(--clin-blue);
  }

  .cr-meds-banner {
    background: var(--clin-surface);
    padding: 14px;
    border-bottom: 1px solid var(--clin-border);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: var(--clin-text);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cr-meds-banner .ico { color: var(--clin-blue); font-size: 18px; }

  .cr-drug-table { background: var(--clin-surface); }
  .cr-drug-row {
    display: grid;
    grid-template-columns: 2.2fr 1fr 0.8fr 0.7fr;
    align-items: center;
    border-bottom: 1px solid var(--clin-surface-alt);
    padding: 10px 14px;
    background: var(--clin-surface);
    border-left: none;
    border-right: none;
    border-top: none;
    text-align: left;
    color: var(--clin-text);
    cursor: pointer;
    font-family: inherit;
    gap: 8px;
    width: 100%;
  }
  .cr-drug-row.header {
    background: #383838;
    color: white;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 14px;
    cursor: default;
    /* Pins under the sticky card header; cards with subtabs (Meds) add
       the subtab height to the offset. */
    position: sticky;
    top: calc(var(--fd-hdr-h) + var(--fd-patbar-h) + var(--fd-cardhd-h));
    z-index: 56;
  }
  .cr-meds-card.has-subtabs .cr-drug-row.header {
    top: calc(var(--fd-hdr-h) + var(--fd-patbar-h) + var(--fd-cardhd-h) + var(--fd-subtab-h));
  }
  .cr-drug-row.header > div { padding: 0; }
  .cr-drug-row:not(.header):nth-child(odd):not(.arrest) {
    background: var(--clin-surface-alt);
  }
  .cr-drug-row.arrest {
    border: 2px solid var(--clin-red);
    border-radius: 6px;
    margin: 2px 0;
  }
  .cr-drug-row.arrest .name { color: var(--clin-red); }
  .cr-drug-row.arrest:hover { background: var(--clin-blue-light); }
  .cr-drug-row:not(.header):not(.arrest):hover { background: var(--clin-blue-light); }
  .cr-drug-cell .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    line-height: 1.25;
  }
  .cr-drug-cell .ind {
    font-style: italic;
    font-size: 12px;
    color: var(--clin-text-dim);
    margin-top: 2px;
    line-height: 1.25;
  }
  .cr-drug-cell.conc, .cr-drug-cell.vol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
  }
  .cr-drug-cell.vol {
    background: rgba(247,221,225,0.55);
    padding: 6px 8px;
    border-radius: 4px;
    text-align: center;
  }
  .cr-drug-cell.rt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    gap: 4px;
  }
  .cr-drug-cell.rt .route-label {
    text-align: center;
    line-height: 1.1;
  }
  .cr-drug-cell.rt .arrow {
    font-size: 18px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .cr-drug-empty {
    padding: 36px 20px;
    text-align: center;
    color: var(--clin-text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  /* Future-use (not currently carried) — dimmed & non-clickable */
  .cr-drug-row.future { opacity: 0.45; cursor: default; }
  .cr-drug-row.future .name { text-decoration: line-through; text-decoration-thickness: 1px; }
  .cc-proto-item.future {
    opacity: 0.5; cursor: default;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .future-tag {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
    color: var(--clin-text-muted);
    border: 1px solid var(--clin-border); border-radius: 3px; padding: 2px 6px;
  }

  @media (max-width: 720px) {
    .cr-drug-row { grid-template-columns: 1.8fr 0.9fr 0.7fr 0.6fr; padding: 10px 10px; gap: 6px; }
    .cr-drug-cell .name { font-size: 13px; }
    .cr-drug-cell .ind { font-size: 11px; }
    .cr-drug-cell.conc, .cr-drug-cell.vol { font-size: 11px; }
    .cr-drug-cell.rt { font-size: 11px; }
  }

  /* ============================================================
     BY PROTOCOL — selector menu + structured detail
  ============================================================ */
  .cc-proto-menu { padding: 12px; display: flex; flex-direction: column; gap: 16px; }
  .cc-proto-group { display: flex; flex-direction: column; gap: 6px; }
  .cc-proto-cat-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--clin-text-muted); padding: 0 2px 2px;
  }
  .cc-proto-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--clin-surface); border: 1px solid var(--clin-border);
    border-left: 3px solid var(--clin-blue); border-radius: 6px;
    padding: 13px 14px; cursor: pointer; text-align: left; width: 100%;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.02em; color: var(--clin-text); transition: all 0.12s;
  }
  .cc-proto-btn:hover { background: var(--clin-blue-light); border-left-color: var(--clin-red); }
  .cc-proto-btn .arrow { color: var(--clin-text-muted); font-size: 18px; }

  .cc-proto-back {
    display: inline-flex; align-items: center; gap: 4px; margin: 12px 12px 0;
    background: none; border: none; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--clin-blue);
  }
  .cc-proto-back:hover { color: var(--clin-red); }
  .cc-proto-detail { padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 14px; }
  .cc-proto-section { display: flex; flex-direction: column; gap: 6px; }
  .cc-proto-section-label {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--clin-blue);
    border-bottom: 1px solid var(--clin-border); padding-bottom: 4px;
  }
  .cc-proto-section.warn .cc-proto-section-label { color: var(--clin-red); }
  .cc-proto-item {
    background: var(--clin-surface-alt); border-radius: 5px; padding: 10px 12px;
    font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--clin-text);
    line-height: 1.35;
  }
  .cc-proto-section.warn .cc-proto-item { background: #fde8e8; }
  button.cc-proto-item.drug {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--clin-border);
    border-left: 3px solid var(--clin-red); font-weight: 600;
  }
  button.cc-proto-item.drug:hover { background: var(--clin-blue-light); }
  button.cc-proto-item.drug .arrow { color: var(--clin-red); font-size: 16px; flex-shrink: 0; }

  button.cc-proto-item.jump {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; cursor: pointer; border: 1px dashed var(--clin-blue);
    background: var(--clin-blue-light); color: var(--clin-blue);
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  button.cc-proto-item.jump:hover { background: var(--clin-blue); color: #fff; }
  button.cc-proto-item.jump .arrow { font-size: 17px; flex-shrink: 0; }

  .cc-proto-peds-note {
    margin: 10px 12px 0; padding: 10px 12px; border-radius: 6px;
    background: rgba(253, 202, 104, 0.18); border-left: 3px solid var(--clin-yellow);
    font-family: 'Inter', sans-serif; font-size: 12.5px; line-height: 1.4; color: var(--clin-text);
  }
  .cc-proto-pearl {
    padding: 9px 12px; border-radius: 5px; background: rgba(183, 17, 37, 0.06);
    border-left: 3px solid var(--clin-red); font-family: 'Inter', sans-serif;
    font-size: 12.5px; font-style: italic; line-height: 1.4; color: var(--clin-text);
  }
  .cc-proto-pearl .lbl {
    font-style: normal; font-family: 'Oswald', sans-serif; font-weight: 700;
    font-size: 11px; letter-spacing: 0.08em; color: var(--clin-red); margin-right: 6px;
  }

  .cc-proto-memory { padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .cc-mem-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 12px; background: var(--clin-surface-alt); border-radius: 5px;
    border-left: 3px solid var(--clin-yellow);
  }
  .cc-mem-drug { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13px; color: var(--clin-text); }
  .cc-mem-dose { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: var(--clin-red); white-space: nowrap; }

  /* ============================================================
     V2 CLINICAL MODALS — Drug detail, Defib energy ladder
  ============================================================ */
  .cr-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(56, 56, 56, 0.55);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 16px;
  }
  .cr-modal-backdrop.show {
    display: flex;
    animation: cr-fade-in 0.18s ease-out;
  }
  @keyframes cr-fade-in { from { opacity: 0; } to { opacity: 1; } }

  .cr-modal {
    background: #b71125;
    color: white;
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    animation: cr-pop-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cr-pop-in {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .cr-modal-head {
    background: var(--clin-blue);
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .cr-modal-title-block { flex: 1; min-width: 0; }
  .cr-modal-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: white;
    line-height: 1.05;
  }
  .cr-modal-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .cr-modal-action {
    background: white;
    color: var(--clin-text);
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-modal-close {
    background: white;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: var(--clin-blue);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cr-modal-close:hover { background: var(--clin-blue-light); }

  .cr-modal-body {
    padding: 20px 20px 16px;
    overflow-y: auto;
    flex: 1;
  }
  .cr-modal-prompt {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 14px;
  }

  /* Drug modal: label / value rows */
  .cr-modal-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    align-items: start;
  }
  .cr-modal-row:last-child { border-bottom: none; }
  .cr-modal-label {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .cr-modal-value {
    color: #fdca68;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.4;
  }
  .cr-modal-value.white { color: white; font-weight: 600; }
  .cr-modal-value .sub {
    display: block;
    color: rgba(255,255,255,0.85);
    font-style: italic;
    font-size: 14px;
    font-weight: 400;
    margin-top: 4px;
  }

  /* Route toggle (IV / IO pill) */
  .cr-route-toggle {
    display: inline-flex;
    background: white;
    border: 2px solid #fdca68;
    border-radius: 8px;
    overflow: hidden;
    align-self: start;
  }
  .cr-route-toggle button {
    background: white;
    border: none;
    padding: 8px 18px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--clin-text);
    cursor: pointer;
    border-right: 1px solid #fdca68;
  }
  .cr-route-toggle button:last-child { border-right: none; }
  .cr-route-toggle button.active {
    background: #fdca68;
    color: var(--clin-text);
  }

  /* Defib energy ladder rows */
  .cr-energy-row {
    background: rgba(255,255,255,0.08);
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding: 16px 18px;
    width: 100%;
    text-align: left;
    color: white;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.12s;
  }
  .cr-energy-row:hover { background: rgba(255,255,255,0.15); }
  .cr-energy-row.active {
    background: white;
    color: var(--clin-text);
  }
  .cr-energy-row.active .check { color: var(--clin-text); font-size: 22px; }
  .cr-energy-row .check { color: transparent; font-size: 20px; }
  .cr-energy-row:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .cr-energy-row:last-child { border-bottom: none; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }

  .cr-modal-note {
    margin-top: 18px;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .cr-modal-note .label {
    color: white;
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }
  .cr-modal-note.warn .label { color: #fdca68; }
  .cr-modal-note ul { margin: 0; padding-left: 22px; }
  .cr-modal-note li { margin-bottom: 6px; }
  .cr-modal-note strong { font-weight: 700; }

  .cr-modal-foot {
    background: rgba(0,0,0,0.18);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cr-modal-btn {
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    transition: filter 0.12s;
  }
  .cr-modal-btn:hover { filter: brightness(1.08); }
  .cr-modal-btn.requested {
    background: #fdca68;
    color: var(--clin-text);
  }
  .cr-modal-btn.given {
    background: var(--clin-green);
    color: white;
  }
  .cr-modal-btn.shock {
    background: var(--clin-green);
    color: white;
  }
  .cr-modal-btn.noshock {
    background: #cbd5e1;
    color: var(--clin-text);
  }

  @media (max-width: 520px) {
    .cr-modal { max-width: 100%; border-radius: 12px; }
    .cr-modal-title { font-size: 19px; }
    .cr-modal-row { grid-template-columns: 90px 1fr; gap: 10px; }
    .cr-modal-label { font-size: 14px; }
    .cr-modal-value { font-size: 15px; }
  }

  /* ============================================================
     V2 VITALS TAB — Expected vitals, ETCO2, Rhythm log, H's & T's
  ============================================================ */
  .cr-vitals-card {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 8px;
    margin-bottom: 12px;
    box-shadow: var(--clin-shadow);
    overflow: hidden;
  }
  .cr-vitals-head {
    background: var(--clin-blue-light);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--clin-border);
  }
  .cr-vitals-head .ico {
    width: 30px;
    height: 30px;
    background: var(--clin-blue);
    color: white;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .cr-vitals-head .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--clin-text);
    text-transform: uppercase;
    flex: 1;
  }
  .cr-vitals-head .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--clin-text-dim);
    letter-spacing: 0.06em;
  }
  .cr-vitals-body { padding: 14px; }

  /* Expected vitals grid */
  .cr-vital-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cr-vital-tile {
    background: var(--clin-surface-alt);
    padding: 12px;
    border-radius: 6px;
    border-left: 3px solid var(--clin-blue);
  }
  .cr-vital-tile .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cr-vital-tile .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--clin-text);
    line-height: 1.1;
  }
  .cr-vital-tile .value .unit {
    font-size: 12px;
    color: var(--clin-text-dim);
    font-weight: 500;
    margin-left: 4px;
  }
  .cr-vital-tile .sub {
    font-size: 11px;
    color: var(--clin-text-muted);
    margin-top: 2px;
  }

  /* ETCO2 reference */
  .cr-etco2-bands {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .cr-etco2-band {
    display: grid;
    grid-template-columns: 90px 1fr;
    align-items: center;
    padding: 10px 12px;
    border-radius: 5px;
    background: var(--clin-surface-alt);
    border-left: 4px solid var(--clin-text-muted);
  }
  .cr-etco2-band.danger { border-left-color: var(--clin-red); background: #fde8e8; }
  .cr-etco2-band.warning { border-left-color: var(--clin-yellow); background: #fdf5d4; }
  .cr-etco2-band.good { border-left-color: var(--clin-green); background: #e6f5ea; }
  .cr-etco2-band.rosc { border-left-color: var(--clin-blue); background: var(--clin-blue-light); }
  .cr-etco2-range {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--clin-text);
  }
  .cr-etco2-desc {
    font-size: 12px;
    color: var(--clin-text);
    line-height: 1.4;
  }

  /* Rhythm log buttons + timeline */
  .cr-rhythm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cr-rhythm-btn-v2 {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 12px 6px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cr-rhythm-btn-v2:hover { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cr-rhythm-btn-v2.shockable { border-color: var(--clin-red); color: var(--clin-red); }
  .cr-rhythm-btn-v2.shockable:hover { background: var(--clin-red); color: white; }
  .cr-rhythm-btn-v2.nonshockable { border-color: var(--clin-yellow); color: #b8860b; }
  .cr-rhythm-btn-v2.nonshockable:hover { background: var(--clin-yellow); color: var(--clin-text); }

<script>
/* ============================================================
   FIELDDOSE CORE — shared utilities + boot
   (The 2602 Misfits class-dashboard code this app was extracted
   from has been removed; FieldDose is standalone.)
   ============================================================ */

let currentPage = 'coderun';

// ---------- TOAST ----------
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ---------- HTML ESCAPING ----------
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ---------- RENDER ----------
function render() {
  const main = document.getElementById('main');
  document.body.classList.add('on-coderun');
  main.innerHTML = renderRunCode();
  bindRunCodeEvents();
  main.scrollTop = 0;
  window.scrollTo(0, 0);
}

// ---------- GLOBAL EVENT HANDLERS ----------
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cr && cr.modal) crCloseModal();
});

// ---------- BOOT ----------
(async function init() {
  // Yield once so all top-level const/let (ccState, ctState, drug data…)
  // finish initializing before the first render (avoids TDZ).
  await Promise.resolve();
  render();
  const ls = document.getElementById('loadingScreen');
  if (ls) ls.classList.add('hide');
})();

/* ============================================================
   CODE TIMER — CPR Metronome + Cycle Cues
============================================================ */
const ctState = {
  running: false,
  startedAt: 0,
  elapsedMs: 0,
  cycleStartMs: 0,
  cycleNum: 1,
  lastEpiMs: 0,
  epiIntervalMs: 3 * 60 * 1000,
  log: [],
  bpm: 110,
  metronomeOn: true,
  ventCueOn: true,
  voiceOn: true,
  toneOn: true,
  epiReminderOn: true,
  advancedAirway: true,
  audioCtx: null,
  audioUnlocked: false,
  rafId: null,
  metronomeBeats: 0,
  ventCount: 0,
  cuesFired: {},
  pulseDotEl: null,
  lastRhythm: null, // 'shockable' | 'nonshockable' | null — drives auto-shock cue at 2:00
  cumulativeEpiMg: 0, // Track total Epi dose toward 3 mg max (SWFL 2025)
  shockCount: 0, // Number of defibrillations delivered this code
  antiDysrhythmicGiven: false, // Has any anti-dysrhythmic (Amio/Lido) been logged?
  dsdCued: false, // Has DSD cue been fired this code?
  activeTab: 'meds', // 'meds' | 'drip' | 'electricity' | 'equipment' | 'more'
  cprRatio: '30:2', // '15:2' | '30:2' | 'continuous'
};

const CT_STORAGE_KEY = 'gnfr-codetimer-settings-v1';

function ctLoadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(CT_STORAGE_KEY));
    if (s) {
      ctState.bpm = s.bpm ?? 110;
      ctState.metronomeOn = s.metronomeOn ?? true;
      ctState.ventCueOn = s.ventCueOn ?? true;
      ctState.voiceOn = s.voiceOn ?? true;
      ctState.toneOn = s.toneOn ?? true;
      ctState.epiReminderOn = s.epiReminderOn ?? true;
      ctState.advancedAirway = s.advancedAirway ?? true;
      ctState.epiIntervalMs = s.epiIntervalMs ?? 3 * 60 * 1000;
    }
  } catch (e) {}
}
function ctSaveSettings() {
  try {
    localStorage.setItem(CT_STORAGE_KEY, JSON.stringify({
      bpm: ctState.bpm,
      metronomeOn: ctState.metronomeOn,
      ventCueOn: ctState.ventCueOn,
      voiceOn: ctState.voiceOn,
      toneOn: ctState.toneOn,
      epiReminderOn: ctState.epiReminderOn,
      advancedAirway: ctState.advancedAirway,
      epiIntervalMs: ctState.epiIntervalMs,
    }));
  } catch (e) {}
}

function ctEnsureAudio() {
  if (!ctState.audioCtx) {
    try { ctState.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (ctState.audioCtx.state === 'suspended') ctState.audioCtx.resume();
  return ctState.audioCtx;
}

function ctUnlockIOSAudio() {
  // iOS Safari needs:
  //  1. AudioContext resumed during a user gesture
  //  2. A silent audio element played to flip the audio session to "playback"
  //     (otherwise the hardware silent switch mutes Web Audio)
  const ctx = ctEnsureAudio();
  if (ctx) {
    // Play a silent buffer to fully unlock
    try {
      const buffer = ctx.createBuffer(1, 1, 22050);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);
    } catch (e) {}
  }
  // Prime speech synthesis with a silent utterance
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  // Play a silent HTML5 audio to set session category to "playback" on iOS
  // (this is what lets sound play with the mute switch on)
  if (!ctState._silentAudio) {
    try {
      const audio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
      audio.loop = true;
      audio.play().catch(() => {});
      ctState._silentAudio = audio;
    } catch (e) {}
  }
  ctState.audioUnlocked = true;
}

function ctPlayTone(freq, durationMs, volume = 0.3, type = 'sine') {
  if (!ctState.toneOn) return;
  const ctx = ctEnsureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationMs / 1000);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + durationMs / 1000 + 0.02);
}

function ctClickTick() { ctPlayTone(1200, 30, 0.12, 'square'); }
function ctVentTone() { ctPlayTone(660, 100, 0.2, 'sine'); }
function ctCueTone() { ctPlayTone(880, 120, 0.35, 'triangle'); setTimeout(() => ctPlayTone(1100, 180, 0.35, 'triangle'), 150); }
function ctEpiTone() { ctPlayTone(523, 200, 0.3, 'sine'); }

function ctSpeak(text, options = {}) {
  if (!ctState.voiceOn) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = options.rate || 1.05;
    u.pitch = options.pitch || 1.0;
    u.volume = options.volume || 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function ctFireCue(type) {
  if (ctState.cuesFired[type]) return;
  ctState.cuesFired[type] = true;
  if (type === 'prepare-charge') {
    ctShowCueBanner('Precharge Monitor', 'normal', 3500);
    ctCueTone();
    ctSpeak('Precharge monitor');
    ctLogEvent('Cue', 'Precharge monitor (1:45)');
  } else if (type === 'rhythm-check') {
    ctShowCueBanner('Rhythm Check — Shock or No Shock?', 'normal', 3500);
    ctCueTone();
    ctSpeak('Rhythm check. Shock or no shock?');
    ctLogEvent('Cycle End', `End cycle ${ctState.cycleNum} — rhythm check`);
    // Show the Shock / No Shock decision panel
    rcShowDecisionPanel();
    // If a shockable rhythm was logged this cycle, prompt to deliver the shock
    if (ctState.lastRhythm === 'shockable') {
      setTimeout(() => {
        ctShowCueBanner('Shock Now — If Confirmed', 'normal', 4000);
        ctCueTone();
        ctSpeak('Shock now if confirmed');
        ctLogEvent('Cue', 'Shock prompt (shockable rhythm)');
      }, 1800);
    } else if (ctState.lastRhythm === 'nonshockable') {
      setTimeout(() => {
        ctShowCueBanner('Resume CPR — Check Epi', 'epi', 4000);
        ctSpeak('Resume CPR, check epi');
        ctLogEvent('Cue', 'Resume CPR (non-shockable)');
      }, 1800);
    }
  }
}

function ctShowCueBanner(text, style, durationMs) {
  const banner = document.getElementById('ct-cue-banner');
  if (!banner) return;
  banner.textContent = text;
  banner.classList.remove('epi');
  if (style === 'epi') banner.classList.add('epi');
  banner.classList.add('show');
  clearTimeout(banner._t);
  banner._t = setTimeout(() => banner.classList.remove('show'), durationMs);
}

function ctTick() {
  if (!ctState.running) return;
  const now = performance.now();
  ctState.elapsedMs = now - ctState.startedAt;
  const cycleElapsedMs = now - ctState.cycleStartMs;
  const cycleSec = Math.floor(cycleElapsedMs / 1000);
  ctUpdateDisplay(cycleElapsedMs, ctState.elapsedMs);

  if (ctState.metronomeOn) {
    const beatIntervalMs = 60000 / ctState.bpm;
    const expectedBeats = Math.floor(cycleElapsedMs / beatIntervalMs);

    // Calculate breath frequency in BEATS (locked to metronome, not wall clock).
    // Adult: every 6s, Peds: every 4s, Neo: every 3s.
    // At 110 BPM: adult = every 11 beats, peds = every 7, neo = every 6.
    let breathBeatN = 0;
    if (ctState.ventCueOn && ctState.advancedAirway) {
      const kg = parseFloat(ccState.weight) || 70;
      const band = kg < 5 ? 'neonatal' : kg < 40 ? 'pediatric' : 'adult';
      const ventSec = band === 'adult' ? 6 : band === 'pediatric' ? 4 : 3;
      breathBeatN = Math.max(1, Math.round((ventSec / 60) * ctState.bpm));
    }

    while (ctState.metronomeBeats < expectedBeats) {
      ctState.metronomeBeats++;
      ctFlashPulse();
      // Every Nth beat → breath cue (replaces the click)
      if (breathBeatN > 0 && ctState.metronomeBeats % breathBeatN === 0) {
        ctVentTone();
        ctSpeak('breathe', { rate: 1.15, volume: 0.85 });
      } else {
        ctClickTick();
      }
    }
  }

  if (cycleElapsedMs >= 105000 && cycleElapsedMs < 106000) ctFireCue('prepare-charge');
  if (cycleElapsedMs >= 120000) { ctFireCue('rhythm-check'); ctStartNewCycle(); }

  // SWFL 2025: Stop epi reminder once cumulative dose reaches 3 mg
  if (ctState.epiReminderOn && ctState.elapsedMs - ctState.lastEpiMs >= ctState.epiIntervalMs) {
    ctState.lastEpiMs = ctState.elapsedMs;
    if (ctState.cumulativeEpiMg >= 3) {
      ctShowCueBanner('Epi MAX reached (3 mg)', 'normal', 4000);
      ctSpeak('Epi max dose reached');
      ctLogEvent('Epi Cap', `3 mg cumulative max reached @ ${ctFormatTime(ctState.elapsedMs)}`);
    } else {
      ctShowCueBanner(`Consider epinephrine (${ctState.cumulativeEpiMg.toFixed(1)}/3 mg given)`, 'epi', 4000);
      ctEpiTone();
      ctSpeak('Consider epinephrine');
      ctLogEvent('Epi Cue', `Consider epi @ ${ctFormatTime(ctState.elapsedMs)}`);
    }
  }

  // SWFL 2025: After 3rd shock + anti-dysrhythmic, prompt DSD for refractory VF/pVT
  if (!ctState.dsdCued && ctState.shockCount >= 3 && ctState.antiDysrhythmicGiven && ctState.lastRhythm === 'shockable') {
    ctState.dsdCued = true;
    ctShowCueBanner('Refractory VF — Consider DSD (set up 2nd AED)', 'normal', 5000);
    ctCueTone();
    ctSpeak('Refractory VF. Consider dual sequential defibrillation. Set up second AED.');
    ctLogEvent('DSD Cue', `Refractory VF @ ${ctFormatTime(ctState.elapsedMs)} — ${ctState.shockCount} shocks delivered`);
  }

  const display = document.getElementById('ct-display');
  if (display) {
    display.classList.remove('warning', 'critical');
    if (cycleSec >= 105) display.classList.add('critical');
    else if (cycleSec >= 90) display.classList.add('warning');
  }
  ctState.rafId = requestAnimationFrame(ctTick);
}

function ctStartNewCycle() {
  ctState.cycleNum++;
  ctState.cycleStartMs = performance.now();
  ctState.metronomeBeats = 0;
  ctState.ventCount = 0;
  ctState.cuesFired = {};
  const display = document.getElementById('ct-display');
  if (display) { display.classList.add('flash'); setTimeout(() => display.classList.remove('flash'), 300); }
}

function ctFlashPulse() {
  if (!ctState.pulseDotEl) return;
  ctState.pulseDotEl.classList.add('beat');
  setTimeout(() => { if (ctState.pulseDotEl) ctState.pulseDotEl.classList.remove('beat'); }, 80);
}

function ctUpdateDisplay(cycleMs, totalMs) {
  // Legacy big display (kept for Code tab fallback)
  const timeEl = document.getElementById('ct-time');
  const cycleEl = document.getElementById('ct-cycle-num');
  const totalEl = document.getElementById('ct-total-val');
  if (timeEl) timeEl.textContent = ctFormatTime(cycleMs);
  if (cycleEl) cycleEl.textContent = ctState.cycleNum;
  if (totalEl) totalEl.textContent = ctFormatTime(totalMs);
  // New compact CPR control bar
  const cprCycleTimeEl = document.getElementById('cpr-cycle-time');
  const cprCycleNumEl = document.getElementById('cpr-cycle-num');
  const cprTotalMinEl = document.getElementById('cpr-total-min');
  const cprBpmValEl = document.getElementById('cpr-bpm-val');
  if (cprCycleTimeEl) cprCycleTimeEl.textContent = ctFormatTime(cycleMs);
  if (cprCycleNumEl) cprCycleNumEl.textContent = ctState.cycleNum;
  if (cprTotalMinEl) cprTotalMinEl.textContent = Math.floor(totalMs / 60000);
  if (cprBpmValEl) cprBpmValEl.textContent = ctState.bpm;
}

function ctFormatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const min = Math.floor(totalSec / 60);
  const sec = totalSec % 60;
  return `${min}:${sec.toString().padStart(2, '0')}`;
}

function ctLogEvent(type, note) {
  const entry = { time: ctFormatTime(ctState.elapsedMs), type, note, ts: Date.now() };
  ctState.log.unshift(entry);
  chartSaveActive();
  ctRenderLog();
  // If user is on the More tab, refresh inline log there too
  if (currentPage === 'coderun' && ctState.activeTab === 'more') {
    rcPartialRender();
  }
}

function ctRenderLog() {
  const logEl = document.getElementById('ct-log-list');
  if (!logEl) return;
  if (ctState.log.length === 0) { logEl.innerHTML = '<div class="ct-log-empty">No events logged yet</div>'; return; }
  logEl.innerHTML = ctState.log.map(e => `
    <div class="ct-log-entry">
      <div class="time">${e.time}</div>
      <div class="type">${e.type}</div>
      <div class="note">${e.note}</div>
    </div>
  `).join('');
}

function ctStart() {
  ctUnlockIOSAudio();
  if (ctState.running) return;
  ctState.running = true;
  const now = performance.now();
  if (ctState.elapsedMs > 0) {
    ctState.startedAt = now - ctState.elapsedMs;
    const cyclePos = ctState.elapsedMs % 120000;
    ctState.cycleStartMs = now - cyclePos;
  } else {
    ctState.startedAt = now;
    ctState.cycleStartMs = now;
    ctState.cycleNum = 1;
    ctState.metronomeBeats = 0;
    ctState.ventCount = 0;
    ctState.cuesFired = {};
    ctState.lastEpiMs = 0;
    ctLogEvent('Start', 'Code timer started');
  }
  ctUpdateControlButtons();
  ctTick();
}

function ctPause() {
  if (!ctState.running) return;
  ctState.running = false;
  cancelAnimationFrame(ctState.rafId);
  ctLogEvent('Pause', `Paused @ ${ctFormatTime(ctState.elapsedMs)}`);
  ctUpdateControlButtons();
}

function ctReset() {
  ctState.running = false;
  cancelAnimationFrame(ctState.rafId);
  ctState.elapsedMs = 0;
  ctState.cycleNum = 1;
  ctState.metronomeBeats = 0;
  ctState.ventCount = 0;
  ctState.cuesFired = {};
  ctState.lastEpiMs = 0;
  ctState.cumulativeEpiMg = 0;
  ctState.shockCount = 0;
  ctState.antiDysrhythmicGiven = false;
  ctState.dsdCued = false;
  ctState.lastRhythm = null;
  ctUpdateDisplay(0, 0);
  const display = document.getElementById('ct-display');
  if (display) display.classList.remove('warning', 'critical');
  if (typeof rcHideDecisionPanel === 'function') rcHideDecisionPanel();
  ctUpdateControlButtons();
}

function ctClearLog() {
  ctState.log = [];
  chartSaveActive();
  ctRenderLog();
  if (currentPage === 'coderun' && ctState.activeTab === 'more') {
    rcPartialRender();
  }
}
function ctMarkEpiGiven() { ctLogEvent('Drug', `Epinephrine given @ ${ctFormatTime(ctState.elapsedMs)}`); ctState.lastEpiMs = ctState.elapsedMs; ctShowCueBanner('Epi logged', 'epi', 1800); }
function ctMarkShock() { ctLogEvent('Shock', `Shock delivered @ ${ctFormatTime(ctState.elapsedMs)}`); ctShowCueBanner('Shock logged', 'normal', 1800); }
function ctMarkROSC() { ctLogEvent('ROSC', `ROSC @ ${ctFormatTime(ctState.elapsedMs)}`); ctShowCueBanner('ROSC logged', 'normal', 2500); ctPause(); }
function ctMarkRhythm(rhythm) {
  ctLogEvent('Rhythm', `${rhythm} @ ${ctFormatTime(ctState.elapsedMs)}`);
  const r = rhythm.toLowerCase();
  if (r.includes('vf') || r.includes('vt') || r.includes('pvt')) {
    ctState.lastRhythm = 'shockable';
    // Get weight-based defib joules
    const elec = ccGetElectrical();
    const joules = elec ? elec.defib.primary : 'Defibrillate';
    ctShowCueBanner(`${rhythm} — Defibrillate ${joules}`, 'normal', 4000);
    ctCueTone();
    ctSpeak(`Defibrillate at ${joules.replace('J', 'joules').replace('→', 'then')}`);
    ctLogEvent('Cue', `Shockable rhythm — defib ${joules}`);
  } else if (r.includes('pea') || r.includes('asys')) {
    ctState.lastRhythm = 'nonshockable';
    ctShowCueBanner(`${rhythm} — No Shock Advised`, 'epi', 4000);
    ctEpiTone();
    ctSpeak('No shock advised. Resume CPR, consider epi');
    ctLogEvent('Cue', `Non-shockable rhythm — no shock`);
  }
}

function ctUpdateControlButtons() {
  const start = document.getElementById('ct-start-btn');
  if (!start) return;
  if (ctState.running) { start.textContent = '⏸ Pause'; start.classList.remove('start'); start.classList.add('stop'); }
  else if (ctState.elapsedMs > 0) { start.textContent = '▶ Resume'; start.classList.add('start'); start.classList.remove('stop'); }
  else { start.textContent = '▶ Start CPR'; start.classList.add('start'); start.classList.remove('stop'); }
}

/* ============================================================
   CODE CALC — Cardiac Arrest Reference (Handtevy-style)
============================================================ */
const ccState = {
  weight: 70,
  unit: 'kg',
  ageBand: 'adult',
  ageYears: '',
  codeMode: false
};

function ccGetWeightKg() {
  const w = parseFloat(ccState.weight) || 0;
  return ccState.unit === 'lbs' ? w / 2.2046 : w;
}

function ccFmt(num, decimals = 2) {
  if (num == null || isNaN(num)) return '—';
  if (num >= 100) return num.toFixed(0);
  if (num >= 10) return num.toFixed(decimals === 0 ? 0 : 1);
  return num.toFixed(decimals);
}

function ccGetAirway() {
  const kg = ccGetWeightKg();
  const age = parseFloat(ccState.ageYears) || 0;
  const band = ccState.ageBand;
  const info = {};
  if (band === 'adult') {
    info.ettCuffed = '7.0–8.0 mm ID';
    info.ettUncuffed = null;
    info.ettDetail = 'Female 7.0–7.5 | Male 7.5–8.5';
    info.ettDepth = '21 cm (F) / 23 cm (M) at teeth';
    info.bladeSize = 'Mac 3–4 | Miller 3';
    info.lma = kg < 70 ? 'Size 4 (50–70 kg)' : kg < 100 ? 'Size 5 (70–100 kg)' : 'Size 6 (>100 kg)';
    info.opa = '80–100 mm';
    info.npa = '7.0–8.0 mm';
    info.bvm = 'Adult mask + 1500 mL bag';
    info.suction = '14 Fr';
    info.io = '25 mm BLUE (proximal humerus or tibia)';
    info.ioDetail = 'EZ-IO. Adult proximal humerus = fastest flow.';
  } else if (band === 'pediatric') {
    // Weight-based ETT size (Broselow-style ranges)
    let cuffed, uncuffed, depth;
    if (kg < 6) { cuffed = '3.0'; uncuffed = '3.5'; depth = '9–10'; }
    else if (kg < 10) { cuffed = '3.5'; uncuffed = '4.0'; depth = '10–11'; }
    else if (kg < 12) { cuffed = '4.0'; uncuffed = '4.5'; depth = '11–12'; }
    else if (kg < 15) { cuffed = '4.5'; uncuffed = '5.0'; depth = '13'; }
    else if (kg < 19) { cuffed = '5.0'; uncuffed = '5.5'; depth = '14'; }
    else if (kg < 24) { cuffed = '5.5'; uncuffed = '6.0'; depth = '15'; }
    else if (kg < 30) { cuffed = '6.0'; uncuffed = '6.5'; depth = '16'; }
    else { cuffed = '6.5'; uncuffed = '7.0'; depth = '17'; }
    info.ettCuffed = cuffed + ' mm ID';
    info.ettUncuffed = uncuffed + ' mm ID';
    info.ettDepth = depth + ' cm at lip';
    info.ettDetail = 'Weight-based ranges (Broselow-style)';
    // Blade by weight
    if (kg < 6) info.bladeSize = 'Miller 0–1';
    else if (kg < 12) info.bladeSize = 'Miller 1 / Mac 2';
    else if (kg < 24) info.bladeSize = 'Mac 2';
    else info.bladeSize = 'Mac 3';
    if (kg < 5) info.lma = 'Size 1 (<5 kg)';
    else if (kg < 10) info.lma = 'Size 1.5 (5–10 kg)';
    else if (kg < 20) info.lma = 'Size 2 (10–20 kg)';
    else if (kg < 30) info.lma = 'Size 2.5 (20–30 kg)';
    else if (kg < 50) info.lma = 'Size 3 (30–50 kg)';
    else info.lma = 'Size 4 (50–70 kg)';
    info.opa = 'Corner of mouth to angle of jaw';
    info.npa = 'Nostril to tragus of ear';
    if (kg < 10) info.bvm = 'Infant mask + 250 mL bag';
    else if (kg < 30) info.bvm = 'Pediatric mask + 500 mL bag';
    else info.bvm = 'Adult mask + 1500 mL bag';
    if (kg < 10) info.suction = '6–8 Fr';
    else if (kg < 30) info.suction = '8–10 Fr';
    else info.suction = '10–14 Fr';
    if (kg < 40) info.io = '15 mm PINK (3–39 kg)';
    else info.io = '25 mm BLUE (≥40 kg)';
    info.ioDetail = 'Proximal tibia preferred in peds. Pink: 3–39 kg | Blue: ≥40 kg.';
  } else {
    info.ettCuffed = '3.0–3.5 mm ID';
    info.ettUncuffed = kg < 1 ? '2.5 mm (<1 kg)' : kg < 2 ? '3.0 mm (1–2 kg)' : '3.5 mm (>2 kg)';
    info.ettDepth = ccFmt(6 + kg, 1) + ' cm at lip (weight + 6)';
    info.ettDetail = '<1 kg: 2.5 | 1–2 kg: 3.0 | 2–3 kg: 3.5 | >3 kg: 3.5–4.0';
    info.bladeSize = 'Miller 0 (preterm) | Miller 1 (term)';
    info.lma = 'Size 1 (rarely used <2 kg)';
    info.opa = '40–50 mm';
    info.npa = 'Not routinely used';
    info.bvm = 'Neonatal mask + 250 mL bag';
    info.suction = '5–8 Fr';
    info.io = '15 mm PINK';
    info.ioDetail = 'Proximal tibia, 1–2 cm below tibial tuberosity, medial flat surface.';
  }
  return info;
}

function ccGetElectrical() {
  const kg = ccGetWeightKg();
  const band = ccState.ageBand;
  if (band === 'adult') {
    // GNFR escalating protocol: 120 → 150 → 200 J
    const shockSeq = [120, 150, 200];
    const nextShockJ = shockSeq[Math.min(ctState.shockCount, shockSeq.length - 1)];
    const shockLabel = ctState.shockCount === 0 ? '1st shock' : ctState.shockCount === 1 ? '2nd shock' : ctState.shockCount === 2 ? '3rd shock' : `${ctState.shockCount + 1}th shock`;
    return {
      defib: { primary: `${nextShockJ} J`, secondary: `${shockLabel} · biphasic`, detail: 'Pad placement: Anterior/Posterior. GNFR escalating: 120 J (1st) → 150 J (2nd) → 200 J (3rd+). Monophasic: 360 J. After 3rd shock + anti-dysrhythmic → consider DSD for refractory VF.' },
      cardiovert: { primary: '70 J → 120 J → 150 J', secondary: 'escalating · sync', detail: 'Synchronized cardioversion — escalating energy ladder: 70 J (1st) → 120 J (2nd) → 150 J (3rd+). Sedate if conscious and time permits. Polymorphic VT: treat as VF with unsynchronized defib doses.' },
      pace: { primary: '80 BPM', secondary: 'increase mA until capture', detail: 'Start 80 BPM. Increase mA by 10 until electrical + mechanical capture. Typical 50–100 mA.' }
    };
  } else if (band === 'pediatric') {
    const first_j = Math.min(2 * kg, 200);
    const subseq_j = Math.min(4 * kg, 360);
    const cv_first = Math.min(0.5 * kg, 50);
    const cv_subseq = Math.min(2 * kg, 100);
    return {

// Filter drugs by selected rhythm. 'all' drugs always show.
function ccFilterDrugsByRhythm(drugs) {
  const r = ctState.lastRhythm; // 'shockable' | 'nonshockable' | null
  if (!r) return drugs; // no rhythm picked → show everything
  return drugs.filter(d => d.rhythm === 'all' || d.rhythm === r);
}

// Code tab: arrest meds only (excludes non-arrest drug box meds)
function ccFilterArrestDrugs(drugs) {
  const arrestOnly = drugs.filter(d => d.rhythm !== 'non-arrest');
  const r = ctState.lastRhythm;
  if (!r) return arrestOnly;
  return arrestOnly.filter(d => d.rhythm === 'all' || d.rhythm === r);
}

/* ============================================================
   PATIENT CHARTS — on-device treatment tracking worksheets.
   Every patient session auto-saves to localStorage so the PCR
   can be written from the log, not memory. Device-local only;
   nothing leaves the phone. Charts expire after 7 days.
============================================================ */
const CHARTS_KEY = 'fielddose-charts-v1';
const CHART_TTL_MS = 7 * 24 * 60 * 60 * 1000;
const CHART_MAX = 50;

function chartsLoadAll() {
  let list;
  try { list = JSON.parse(localStorage.getItem(CHARTS_KEY)) || []; }
  catch (_) { return []; }
  const cutoff = Date.now() - CHART_TTL_MS;
  const kept = list.filter((c) => c && c.createdAt > cutoff);
  if (kept.length !== list.length) chartsSaveAll(kept);
  return kept;
}

function chartsSaveAll(list) {
  try { localStorage.setItem(CHARTS_KEY, JSON.stringify(list.slice(0, CHART_MAX))); }
  catch (_) { /* storage full or unavailable — charts become session-only */ }
}

// Snapshot the current session into its chart. Called on patient
// selection and after every log event / pause, so a dead battery
// costs nothing.
function chartSaveActive() {
  if (!cr.chartId || !cr.patient) return;
  const list = chartsLoadAll();
  const idx = list.findIndex((c) => c.id === cr.chartId);
  const rec = {
    id: cr.chartId,
    createdAt: idx >= 0 ? list[idx].createdAt : Date.now(),
    updatedAt: Date.now(),
    patient: cr.patient,
    log: ctState.log,
    elapsedMs: ctState.elapsedMs,
    cycleNum: ctState.cycleNum,
    shockCount: ctState.shockCount,
    cumulativeEpiMg: ctState.cumulativeEpiMg,
    lastRhythm: ctState.lastRhythm,
    antiDysrhythmicGiven: ctState.antiDysrhythmicGiven,
    hts: [...crHTsAddressed]
  };
  if (idx >= 0) list[idx] = rec; else list.unshift(rec);
  chartsSaveAll(list);
}

// New patient locked in → open a fresh chart for the session.
function crChartStart() {
  cr.chartId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  chartSaveActive();
}

function chartDelete(id) {
  chartsSaveAll(chartsLoadAll().filter((c) => c.id !== id));
  if (cr.chartId === id) cr.chartId = null;
}

// Reopen a saved chart: restore the whole session (paused) and land
// on the Pt. Log so it reads back for report writing.
function chartOpen(id) {
  const chart = chartsLoadAll().find((c) => c.id === id);
  if (!chart) { showToast('Chart no longer available', true); render(); return; }
  cr.patient = chart.patient;
  cr.chartId = chart.id;
  cr.view = 'dose';
  cr.medsView = 'full';
  cr.protocolSel = null;
  cr.moreView = 'log';
  ccState.weight = String(chart.patient.weight);
  ccState.unit = 'kg';
  ccState.ageBand = rcDeriveBand(chart.patient.weight);
  ctState.running = false;
  ctState.log = chart.log || [];
  ctState.elapsedMs = chart.elapsedMs || 0;
  ctState.cycleNum = chart.cycleNum || 1;
  ctState.shockCount = chart.shockCount || 0;
  ctState.cumulativeEpiMg = chart.cumulativeEpiMg || 0;
  ctState.lastRhythm = chart.lastRhythm || null;
  ctState.antiDysrhythmicGiven = !!chart.antiDysrhythmicGiven;
  ctState.activeTab = 'more';
  crHTsAddressed.clear();
  (chart.hts || []).forEach((h) => crHTsAddressed.add(h));
  render();
}

function chartFmtWhen(ts) {
  return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// Plain-text worksheet for hand-off (share sheet / email). Chronological
// log with both elapsed and wall-clock times — the times the PCR needs.
function chartWorksheetText(chart) {
  const lines = [];
  lines.push('FIELDDOSE TREATMENT WORKSHEET');
  lines.push('Treatment tracking worksheet — NOT a patient care record.');
  lines.push('');
  lines.push(`Patient:   ${chart.patient.summary || ''}`);
  lines.push(`Created:   ${new Date(chart.createdAt).toLocaleString()}`);
  lines.push(`Code time: ${ctFormatTime(chart.elapsedMs || 0)} · Cycle ${chart.cycleNum || 1}`);
  lines.push(`Shocks:    ${chart.shockCount || 0}`);
  lines.push(`Epi total: ${(chart.cumulativeEpiMg || 0).toFixed(1)} mg`);
  if (chart.hts && chart.hts.length) lines.push(`H's & T's addressed: ${chart.hts.join(', ')}`);
  lines.push('');
  lines.push('EVENT LOG  (elapsed · clock · event)');
  const chrono = [...(chart.log || [])].reverse();
  if (chrono.length === 0) lines.push('  (no events logged)');
  chrono.forEach((e) => {
    const clock = e.ts ? new Date(e.ts).toLocaleTimeString([], { hour12: false }) : '--:--:--';
    lines.push(`${String(e.time || '--:--').padEnd(6)} ${clock}  ${String(e.type || '').padEnd(7)} ${e.note || ''}`);
  });
  lines.push('');
  lines.push('Generated by FieldDose (fielddose.com). Confirm all entries');
  lines.push('against the official patient care report.');
  return lines.join('\n');
}

// Hand the worksheet to the OS share sheet (Mail, Messages, AirDrop…).
// The app itself never transmits anything — the medic picks the channel.
// Desktop fallback: open the default mail client with the text as body.
async function chartShare(id) {
  const chart = chartsLoadAll().find((c) => c.id === id);
  if (!chart) { showToast('Chart no longer available', true); return; }
  const text = chartWorksheetText(chart);
  const title = `FieldDose Worksheet — ${chart.patient.summary || 'Patient'}`;
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; }
    catch (err) { if (err && err.name === 'AbortError') return; /* else fall through */ }
  }
  location.href = `mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(text)}`;
}

// --- DRUG ROW PARSERS (V2 tabular layout) ---
// Pull the concentration string out of a packageSpec like
//   "0.1 mg/mL · 10 mL prefilled syringe"         → "0.1 mg/mL"
//   "50% (500 mg/mL) · 10 mL vial"                → "500 mg/mL"
//   "50 mg/mL · 3 mL vial (150 mg)"               → "50 mg/mL"
//   "1 mg/mL (1:1,000) · 1 mL ampule"             → "1 mg/mL"
function rcParseConc(spec) {
  if (!spec) return '—';
  // Parenthesized mg/mL — e.g. "(500 mg/mL)" or "(20 mg/mL)"
  const paren = spec.match(/\(([\d.]+\s*(?:mcg|mg|g)\s*\/\s*mL)\)/i);
  if (paren) return paren[1].replace(/\s+/g, ' ');
  // Standard "X mg/mL" — slash directly into mL, no intermediate number
  const m = spec.match(/[\d.]+\s*(?:mcg|mg|g|mEq)\s*\/\s*mL/i);
  if (m) return m[0].replace(/\s+/g, ' ');
  // "X mg / Y mL vial" form — show as "X mg/Y mL"
  const vial = spec.match(/([\d.]+\s*(?:mcg|mg|g))\s*\/\s*([\d.]+\s*mL)/i);
  if (vial) return `${vial[1].replace(/\s+/g, ' ')}/${vial[2].replace(/\s+/g, ' ')}`;
  // Tabs / sprays — "81 mg/tab" or "0.4 mg/spray"
  const unit = spec.match(/[\d.]+\s*(?:mcg|mg|g)\s*\/\s*(?:tab|spray|neb|puff)/i);
  if (unit) return unit[0].replace(/\s+/g, ' ');
  // Fallback: first segment before " · "
  const first = spec.split(/·/)[0].trim();
  return first.length > 18 ? first.substring(0, 16) + '…' : first;
}

// Pull the volume to push from a deliveryDose string.
//   "Push 10 mL IV/IO"                            → "10 mL"
//   "1st: Push 6 mL IVP · 2nd: Push 3 mL IVP"     → "6 / 3 mL"
//   "0.4–2 mL IV/IM"                              → "0.4-2 mL"
//   "0.5 mL IM lateral thigh"                     → "0.5 mL"
function rcParseVol(dose) {
  if (!dose) return '—';
  // Multi-dose "1st / 2nd" pattern in mL
  if (/1st|first/i.test(dose)) {
    const mm = dose.match(/(\d[\d.]*)\s*mL[^·]*[·][^·]*?(\d[\d.]*)\s*mL/i);
    if (mm) return `${mm[1]} / ${mm[2]} mL`;
  }
  // Single mL volume (possibly range)
  const m = dose.match(/([\d.]+(?:\s*[–-]\s*[\d.]+)?)\s*mL/i);
  if (m) return `${m[1].replace(/\s+/g, '')} mL`;
  // No mL → tab / spray / neb / puff
  const tab = dose.match(/(\d+)\s*(tab|spray|neb|puff)/i);
  if (tab) return `${tab[1]} ${tab[2]}`;
  // Grams (e.g. glucose tube)
  const g = dose.match(/([\d.]+)\s*g\b/i);
  if (g) return `${g[1]} g`;
  return dose.length > 14 ? dose.substring(0, 12) + '…' : dose;
}

// Normalize the route string for the Rt column.
//   "IV / IO"          → "IV/IO"
//   "IV / IO / IM"     → "IV/IO"  (display first two for space)
//   "IM"               → "IM"
//   "Nebulized"        → "NEB"
function rcParseRoute(route) {
  if (!route) return '—';
  if (/neb/i.test(route)) return 'NEB';
  if (/oral|po/i.test(route)) return 'PO';
  // Split on / and pick up to 2
  const parts = route.split(/[\/,]/).map(p => p.trim()).filter(Boolean);
  if (parts.length === 0) return '—';
  if (parts.length === 1) return parts[0].toUpperCase();
  return parts.slice(0, 2).join('/').toUpperCase().replace(/\s+/g, '');
}

// Whether to render a drug row in red (arrest pathway)
function rcIsArrestDrug(d) {
  return d.primary === true || d.rhythm === 'all' || d.rhythm === 'shockable';
}

// V2 weight-based continuous infusion data — used by tabular Drips tab
function rcGetDrips(kg) {
  const isPed = kg < 40;

    ? `${ccFmt(0.1 * Math.min(kg, 20), 1)} mL IVP (${ccFmt(Math.min(kg, 20), 0)} mcg) q2 min`
    : '10 mL IVP (~100 mcg) titrate to BP';
  const crystalloid = isPed ? `${ccFmt(20 * kg, 0)} mL (20 mL/kg)` : '500–1000 mL';
  const diltMg = Math.min(0.25 * kg, 20);
  const diltMl = diltMg; // 1 mg/mL
  const epiPerfLow = Math.round(0.1 * kg);   // gtts/min at 0.1 mcg/kg/min, 10 gtts/set
  const epiPerfHigh = Math.round(0.5 * kg);
  return [
    { name: 'Crystalloid Bolus', indication: 'Pseudo-PEA · Shock · Hypovolemia',
      conc: 'NS or LR', rate: crystalloid + ' · rapid', isArrest: true,
      detail: 'Rapid IV/IO push. Repeat as needed. Watch for fluid overload in CHF or elderly.', max: '40 mL/kg peds' },
    { name: 'Push-Dose Epi', indication: 'Bridge to drip · Hypotension',
      conc: '10 mcg/mL (1:1,000 in 100 mL D5W)', rate: pushDose, isArrest: true,
      detail: 'Mix: 1 mL Epi 1:1,000 + 100 mL D5W bag = 10 mcg/mL. Draw 10 mL off bag · Push 10 mL IVP · titrate q2 min PRN.', max: '100 mcg/dose' },
    { name: 'Epi Pressor Drip', indication: 'Pseudo-PEA · Post-ROSC pressor',
      conc: '10 mcg/mL · 10 gtts/set', rate: `${epiPerfLow}–${epiPerfHigh} gtts/min`, isArrest: true,
      detail: `Mix: 1 mg of 1:1,000 in 100 mL D5W = 10 mcg/mL · 10 gtts/set (macrodrip). Range 0.1–0.5 mcg/kg/min. At ${ccFmt(kg, 1)} kg: low ${epiPerfLow} gtts/min → high ${epiPerfHigh} gtts/min. Titrate to MAP > 65.`, max: '0.5 mcg/kg/min' },
    { name: 'Epi Bradycardia Drip', indication: 'Symptomatic bradycardia',
      conc: '10 mcg/mL · 60 gtts/set', rate: '12–60 gtts/min', isArrest: false,
      detail: 'Mix: 1 mg of 1:1,000 in 100 mL D5W = 10 mcg/mL · 60 gtts/set (microdrip). Range 2–10 mcg/min · gtts/min = mcg/min × 6. NOT weight-based. Titrate to HR > 60 and perfusion.', max: '10 mcg/min' },
    { name: 'Amiodarone Maintenance', indication: 'Post-ROSC after VF/pVT',
      conc: '1.5 mg/mL · 10 gtts/set', rate: '100 gtts/min over 10 min', isArrest: true,
      detail: '150 mg (3 mL) + 100 mL D5W = 1.5 mg/mL · 10 gtts/set. Run at 100 gtts/min for the first 10 min, then continue 1 mg/min for 6 hr, then 0.5 mg/min for 18 hr.', max: '2.2 g / 24 hr' },
    { name: 'Mag Sulfate — Torsades', indication: 'Torsades de pointes · refractory VT',
      conc: '20 mg/mL · 10 gtts/set', rate: 'Wide open 100 mL', isArrest: true,
      detail: 'Mix: 4 mL of 50% (2 g) + 100 mL D5W = 20 mg/mL · 10 gtts/set. Wide open over 1–2 min in TdP arrest. 5–15 min in pulsed TdP.', max: '4 g' },
    { name: 'Mag Sulfate — Asthma', indication: 'Severe asthma exacerbation',
      conc: '20 mg/mL · 10 gtts/set', rate: '50 gtts/min over 20 min', isArrest: false,
      detail: 'Mix: 4 mL of 50% (2 g) + 100 mL D5W = 20 mg/mL · 10 gtts/set. Slow infusion 50 gtts/min over 20 min.', max: '2 g' },
    { name: 'Mag Sulfate — Eclampsia', indication: 'Eclamptic seizures',
      conc: '40 mg/mL · 10 gtts/set', rate: '50 gtts/min over 20 min', isArrest: false,
      detail: 'Mix: 8 mL of 50% (4 g) + 100 mL D5W = 40 mg/mL · 10 gtts/set. 4 g over 20 min initial loading dose. Maintenance 1–2 g/hr.', max: '6 g loading' },
    { name: 'Diltiazem', indication: 'Stable AFib/AFlutter RVR · NOT WPW',
      conc: '1 mg/mL', rate: `${ccFmt(diltMl, 1)} mL slow push over 2 min`, isArrest: false,
      detail: `0.25 mg/kg slow IVP over 2 min, max 20 mg. At ${ccFmt(kg, 1)} kg: ${ccFmt(diltMg, 1)} mg = ${ccFmt(diltMl, 1)} mL of 1 mg/mL. If inadequate after 15 min, repeat 0.35 mg/kg.`, max: '20 mg' },
  ];
}

// Open the drug modal for a drip (adapter — drip data shape → drug shape)
function crShowDripModal(dripName) {
  const kg = parseFloat(ccState.weight) || (cr.patient ? cr.patient.weight : 0);
  const drip = rcGetDrips(kg).find(d => d.name === dripName);
  if (!drip) return;
  const adapted = {
    name: drip.name,
    class: 'Continuous infusion',
    indication: drip.indication,
    weightDose: drip.rate,
    packageSpec: drip.conc,
    deliveryDose: drip.rate,
    route: 'IV / IO',
    max: drip.max,
    detail: drip.detail,
    primary: drip.isArrest,
    rhythm: drip.isArrest ? 'all' : 'non-arrest',
  };
  cr.drugRoute = 'IV';
  cr.modal = { type: 'drug', drug: adapted, availableRoutes: ['IV', 'IO'] };
  crRenderModal();
}

};

// Pick the right pediatric tier from a Broselow zone or kg
function rcPickPedsTier(zone, kg) {
  if (zone === '3kg' || zone === '4kg' || zone === '5kg' || (kg && kg < 5)) return 'neonate';
  if (zone === 'pink' || zone === 'red' || (kg && kg < 10)) return 'infant';
  if (zone === 'purple' || zone === 'yellow' || (kg && kg < 14)) return 'toddler';
  if (zone === 'white' || (kg && kg < 19)) return 'preschool';
  if (zone === 'blue' || zone === 'orange' || (kg && kg < 30)) return 'school';
  return 'adolescent';
}

function rcGetExpectedVitals() {
  if (!cr.patient) return EXPECTED_VITALS.adult;
  if (cr.patient.type === 'adult') return EXPECTED_VITALS.adult;
  const tier = rcPickPedsTier(cr.patient.zone, cr.patient.weight);
  return EXPECTED_VITALS[tier] || EXPECTED_VITALS.infant;
}

// H's & T's checklist state — tracks which causes have been addressed
const crHTsAddressed = new Set();

function crToggleHT(label) {
  if (crHTsAddressed.has(label)) {
    crHTsAddressed.delete(label);
    ctLogEvent('H/T', `${label} — cleared`);
  } else {
    crHTsAddressed.add(label);
    ctLogEvent('H/T', `${label} — addressed`);
  }
}

function crShowDrugModal(drugName) {

function crCloseModal() {
  cr.modal = null;
  const mount = document.getElementById('cr-modal-mount');
  if (mount) { mount.classList.remove('show'); mount.innerHTML = ''; }
}

function crRenderModal() {
  const mount = document.getElementById('cr-modal-mount');

  bindModalEvents();
}

// Pharmacology reference (SWFL 2025 drug ref) — keyed by simple slug.
// crDrugRef() maps any drug-list name (incl. concentration variants) to one entry.
const CC_DRUG_REF = {
  epinephrine: { action: 'Alpha & beta agonist — ↑ heart rate, contractility, SVR & BP; bronchodilation.', contra: ['None in emergency settings'], precautions: ['Cardiovascular disease, hypertension, tachyarrhythmia','Protect from light; deactivated by alkaline solutions (bicarb)'] },
  adenosine: { action: 'Slows AV-node conduction; interrupts reentrant AV-nodal pathways.', contra: ['None in emergent settings'], precautions: ['Not for hemodynamically unstable patients','Bronchoconstrictive disease — auscultate lungs after','Must be pushed rapidly and followed by flush'] },
  albuterol: { action: 'Selective β2 agonist — smooth-muscle relaxation & bronchodilation.', contra: ['None in emergent settings'], precautions: ['Symptomatic tachycardia — may precipitate angina/dysrhythmia'] },
  amiodarone: { action: 'Class III antidysrhythmic — blocks Na/K/Ca channels; prolongs action potential.', contra: ['QTc > 500 ms'], precautions: ['Heart failure','Torsades de Pointes'] },
  aspirin: { action: 'Inhibits platelet aggregation.', contra: ['Known anaphylaxis','Active, uncontrolled bleeding'], precautions: ['GI bleeding','Give full dose even if patient took a morning 81 mg'] },
  atropine: { action: 'Parasympatholytic — blocks acetylcholine receptors; ↑ heart rate; ↓ secretions.', contra: ['None when used emergently'], precautions: ['If administered too slowly, reflex bradycardia may occur'] },
  calcium: { action: '↑ cardiac contractility (positive inotrope); may enhance ventricular automaticity.', contra: ['None when used emergently'], precautions: ['VF (relative); digitalis toxicity','Local infiltration → necrosis; 3× potency of calcium gluconate'] },
  dextrose: { action: 'Rapidly raises serum glucose.', contra: ['None in emergent setting'], precautions: ['Extravasation → tissue necrosis at higher concentrations'] },
  diltiazem: { action: 'Class IV calcium-channel blocker — slows AV node, dilates arteries.', contra: ['Wide-complex tachycardia','Wolff-Parkinson-White'], precautions: ['Hypotension / cardiogenic shock','Renal or hepatic dysfunction'] },
  diphenhydramine: { action: 'Antihistamine (H1 blocker); sedating.', contra: ['None in emergency setting'], precautions: ['Asthma, hypotension, nursing mothers','NOT the primary treatment for anaphylaxis'] },
  lidocaine: { action: 'Antidysrhythmic / local anesthetic — blocks Na channels.', contra: ['None in emergent situation'], precautions: ['Monitor for CNS toxicity','Preferred antidysrhythmic if dysrhythmia is toxin-induced'] },
  magnesium: { action: 'Electrolyte / smooth-muscle relaxant; blocks neuromuscular transmission.', contra: ['Hypotension / hypoperfused','Heart block'], precautions: ['Caution with digitalis and in renal failure'] },
  steroid: { action: 'Corticosteroid — anti-inflammatory; upregulates β receptors.', contra: ['None in emergency setting'], precautions: ['Onset of action may be 2–6 h; Solu-Medrol must be reconstituted'] },
  naloxone: { action: 'Opioid antagonist — reverses opioid respiratory depression.', contra: ['Cardiac arrest'], precautions: ['Goal is restoring respiration, not full mentation','Shorter half-life than many opioids — may need repeat','May precipitate withdrawal'] },
  nitroglycerin: { action: 'Smooth-muscle relaxant; dilates coronary & systemic arteries; ↓ cardiac work.', contra: ['ED medications within 72 h','Hypotension / hypoperfusion'], precautions: ['Constantly monitor BP','RV infarct; syncope'] },
  ondansetron: { action: 'Serotonin (5-HT3) receptor antagonist — antiemetic.', contra: ['None in emergent situations'], precautions: ['QT prolongation; caution with SSRIs'] },
  bicarb: { action: 'Alkalizing buffer — neutralizes metabolic acidosis.', contra: ['None in emergent situations'], precautions: ['Repeat in TCA OD until QRS narrows','Deactivates other meds; hypernatremia'] },
  txa: { action: 'Anti-fibrinolytic — inhibits plasminogen binding, ↓ fibrinolysis.', contra: ['None in emergent situations'], precautions: ['Give within 3 h of injury','Hypotension observed with rapid IV push'] },
  crystalloid: { action: 'Volume expansion.', contra: ['None'], precautions: ['Auscultate lungs — consider pulmonary edema'] },
  norepinephrine: { action: 'Potent alpha-agonist — intense peripheral vasoconstriction; mild-moderate beta (chronotropic).', contra: ['None'], precautions: ['Hemorrhagic shock','Extravasation → tissue necrosis'] },
};
function crDrugRef(name) {
  const n = (name || '').toLowerCase();
  const R = CC_DRUG_REF;
  if (n.includes('norepinephrine') || n.includes('levophed')) return R.norepinephrine;
  if (n.includes('epi') || n.includes('epinephrine')) return R.epinephrine;
  if (n.includes('adenosine')) return R.adenosine;
  if (n.includes('albuterol')) return R.albuterol;
  if (n.includes('amiodarone')) return R.amiodarone;
  if (n.includes('aspirin')) return R.aspirin;
  if (n.includes('atropine')) return R.atropine;
  if (n.includes('calcium')) return R.calcium;
  if (n.includes('dextrose') || n.includes('d10') || n.includes('glucose')) return R.dextrose;
  if (n.includes('diltiazem')) return R.diltiazem;
  if (n.includes('diphenhydramine')) return R.diphenhydramine;
  if (n.includes('lidocaine')) return R.lidocaine;
  if (n.includes('mag')) return R.magnesium;
  if (n.includes('solu-medrol') || n.includes('methylpred') || n.includes('dexamethasone')) return R.steroid;
  if (n.includes('naloxone') || n.includes('narcan')) return R.naloxone;
  if (n.includes('nitro')) return R.nitroglycerin;
  if (n.includes('ondansetron')) return R.ondansetron;
  if (n.includes('bicarb')) return R.bicarb;
  if (n.includes('tranexamic') || n.includes('txa')) return R.txa;
  if (n.includes('saline') || n.includes('crystalloid') || n.includes('volume')) return R.crystalloid;
  return null;
}

function renderDrugModal(m) {
  const d = m.drug;
  const ref = crDrugRef(d.name);
  const conc = rcParseConc(d.packageSpec);
  const mixDetail = (d.packageSpec || '').split(/·/).slice(1).join(' · ').trim();
  const routes = m.availableRoutes && m.availableRoutes.length ? m.availableRoutes : ['IV'];
  const routeToggle = routes.length > 1
    ? `<div class="cr-route-toggle">

function renderDefibModal(m) {
  const e = m.electrical;
  // Build energy ladder from current production's escalating sequence.
  // ccGetElectrical returns current shock — we build the full ladder here.
  const kg = parseFloat(ccState.weight) || (cr.patient ? cr.patient.weight : 0);
  const band = ccState.ageBand;
  let ladder;
  if (band === 'adult') {
    // GNFR escalating: 120 → 150 → 200 → 200 (cap)
    ladder = [
      { label: '1st', joules: '120 J' },
      { label: '2nd', joules: '150 J' },
      { label: '3rd', joules: '200 J' },
      { label: '4th+', joules: '200 J' },
    ];
  } else {
    // Pediatric / neonatal: 2 J/kg → 4 J/kg → 4 J/kg → 4–10 J/kg
    const j1 = (2 * kg).toFixed(0);
    const j2 = (4 * kg).toFixed(0);
    ladder = [
      { label: '1st', joules: `${j1} J · 2 J/kg` },
      { label: '2nd', joules: `${j2} J · 4 J/kg` },
      { label: '3rd', joules: `${j2} J · 4 J/kg` },
      { label: '4th+', joules: `${j2}-${(10*kg).toFixed(0)} J · 4-10 J/kg` },
    ];
  }
  const selectedIdx = Math.min(ctState.shockCount, ladder.length - 1);
  return `
    <div class="cr-modal" role="dialog" aria-modal="true">
      <div class="cr-modal-head">
        <div class="cr-modal-title-block">
          <div class="cr-modal-title">ZOLL</div>
          <div class="cr-modal-subtitle">Defibrillation</div>
        </div>
        <button class="cr-modal-close" id="cr-modal-close-btn" aria-label="Close">✕</button>
      </div>
      <div class="cr-modal-body">
        <div class="cr-modal-prompt">Select an energy dose below</div>
        ${ladder.map((row, i) => `
          <button class="cr-energy-row ${i === selectedIdx ? 'active' : ''}" data-energy-idx="${i}">
            <span>${row.label.toUpperCase()}: ${escapeHtml(row.joules)}</span>
            <span class="check">${i === selectedIdx ? '✓' : ''}</span>
          </button>
        `).join('')}
        <div class="cr-modal-note">
          <span class="label">Note:</span>
          <ul>
            <li><strong>Cardiac Arrest: VF &amp; pVT</strong> — For VF/VT Storm, after 3rd shock consider vector change to anterior-posterior (AP) pad placement. After 5th shock consider dual sequential external defibrillation (DSED).</li>
            <li>Pad placement default: Anterior / Apex. Minimize peri-shock pauses.</li>
          </ul>
        </div>
      </div>
      <div class="cr-modal-foot">
        <button class="cr-modal-btn shock" data-cr-action="shock-delivered">SHOCK DELIVERED</button>
        <button class="cr-modal-btn noshock" data-cr-action="no-shock">NO SHOCK ADVISED</button>
      </div>
    </div>
  `;
}

function bindModalEvents() {
  const mount = document.getElementById('cr-modal-mount');
  if (!mount) return;

  // Close on backdrop click (but not inside modal)
  mount.onclick = (e) => { if (e.target === mount) crCloseModal(); };

  // Close button
  const closeBtn = document.getElementById('cr-modal-close-btn');
  if (closeBtn) closeBtn.addEventListener('click', crCloseModal);

  // Route toggle in drug modal
  mount.querySelectorAll('[data-cr-route]').forEach(b => {
    b.addEventListener('click', () => {
      cr.drugRoute = b.dataset.crRoute;
      crRenderModal();
    });
  });

  // Energy row selection in defib modal
  mount.querySelectorAll('[data-energy-idx]').forEach(b => {
    b.addEventListener('click', () => {
      if (cr.modal && cr.modal.type === 'defib') {
        cr.modal.selectedIdx = parseInt(b.dataset.energyIdx);
        crRenderModal();
      }
    });
  });

  // Action buttons (Requested / Given / Shock Delivered / No Shock Advised)
  mount.querySelectorAll('[data-cr-action]').forEach(b => {
    b.addEventListener('click', () => {
      const action = b.dataset.crAction;
      if (!cr.modal) return;
      if (cr.modal.type === 'drug') handleDrugModalAction(action);
      else if (cr.modal.type === 'defib') handleDefibModalAction(action);
    });
  });
}

function handleDrugModalAction(action) {
  const d = cr.modal && cr.modal.drug;
  if (!d) { crCloseModal(); return; }
  const route = cr.drugRoute || 'IV';
  if (action === 'requested') {
    ctLogEvent('Request', `${d.name} ${d.weightDose || ''} ${route} — requested`);
    ctShowCueBanner(`${d.name} requested`, 'normal', 1500);
  } else if (action === 'given') {
    ctLogEvent('Drug', `${d.name} ${d.weightDose || ''} ${route} (${d.deliveryDose || d.readyVol || ''})`);
    ctShowCueBanner(`${d.name} given`, d.primary ? 'epi' : 'normal', 1800);
    // Cumulative Epi tracking (arrest Epi only)
    const isArrestEpi = (d.name === 'Epinephrine' || d.name === 'Epinephrine 1:10,000') && d.rhythm === 'all';
    if (isArrestEpi) {
      ctState.lastEpiMs = ctState.elapsedMs;
      const m = (d.weightDose || '').match(/([\d.]+)\s*mg/);
      if (m) ctState.cumulativeEpiMg += parseFloat(m[1]);
    }
    if (d.name === 'Amiodarone' || d.name === 'Lidocaine') ctState.antiDysrhythmicGiven = true;
  }
  crCloseModal();
  rcPartialRender();
}

function handleDefibModalAction(action) {
  const e = cr.modal && cr.modal.electrical;
  const idx = cr.modal ? cr.modal.selectedIdx : 0;
  if (action === 'shock-delivered') {
    ctState.shockCount++;
    const energyStr = e && e.defib ? e.defib.primary : '';
    ctLogEvent('Shock', `Defib #${ctState.shockCount} — ${energyStr}`);
    ctShowCueBanner(`Shock #${ctState.shockCount} Delivered — Resume CPR`, 'normal', 2000);
    ctSpeak('Shock delivered. Resume CPR.');
    ctState.lastRhythm = null;
  } else if (action === 'no-shock') {
    ctLogEvent('No Shock', `No shock advised — Resume CPR, consider epi`);
    ctShowCueBanner('No Shock — Resume CPR · Check Epi', 'epi', 2000);
    ctSpeak('No shock advised. Resume CPR.');
    ctState.lastRhythm = null;
  }
  crCloseModal();
  rcPartialRender();
}

    weight: zone.weight,

    zoneLabel: zone.label,
    zoneColor: zone.color,
    zoneTextColor: zone.textColor,

  };

function crSetPedsCustom(kg, ageYears) {
  if (!kg || kg < 0.5 || kg > 60) { showToast('Enter weight 0.5-60 kg', true); return; }
  // Find nearest Broselow zone for reference color
  let nearest = BROSELOW[0];
  let minDiff = Math.abs(BROSELOW[0].weight - kg);
  BROSELOW.forEach(z => {
    const d = Math.abs(z.weight - kg);
    if (d < minDiff) { minDiff = d; nearest = z; }
  });
  cr.patient = {
    type: 'peds',
    weight: kg,
    zone: nearest.code,
    zoneLabel: `Custom (≈ ${nearest.label})`,
    zoneColor: nearest.color,
    zoneTextColor: nearest.textColor,
    ageYears: ageYears || null,
    summary: `${kg} kg${ageYears ? ' · ' + ageYears + ' yr' : ''} · Custom`
  };
  cr.view = 'dose';
  ccState.weight = String(kg);
  ccState.unit = 'kg';
  crChartStart();
  render();
}

function crNewPatient() {
  if (ctState.running) {
    if (!confirm('Stop active CPR and start a new patient?')) return;
    ctPause();
  }
  // Detach the saved chart BEFORE resetting, so the reset below can't
  // overwrite it with an empty session. The chart itself stays saved.
  cr.chartId = null;
  // Full reset: timer, log, cumulative counters, rhythm state
  ctReset();
  ctClearLog();
  ctState.lastRhythm = null;
  ctState.cumulativeEpiMg = 0;
  ctState.shockCount = 0;
  ctState.antiDysrhythmicGiven = false;
  ctState.dsdCued = false;
  ctState.activeTab = 'meds';
  crHTsAddressed.clear();
  cr.patient = null;
  cr.view = 'entry';
  cr.medsView = 'full';
  cr.protocolSel = null;
  cr.moreView = 'log';
  ccState.weight = '';
  render();
}

function renderRunCode() {
  ctLoadSettings();
  ccState.unit = 'kg';

  // Entry views — render picker UI, no dose tabs, no patient bar
  if (cr.view === 'entry' || cr.view === 'entry-adult' || cr.view === 'entry-peds') {
    return renderRunCodeHeader() + `

        ${cr.view === 'entry' ? renderCREntry()
          : cr.view === 'entry-adult' ? renderCREntryAdult()

  const kg = parseFloat(ccState.weight) || cr.patient.weight;

  ccState.ageBand = rcDeriveBand(kg);
  ccState.ageYears = '';
  const elec = ccGetElectrical();
  const drugs = ccFilterDrugsByRhythm(ccGetDrugs());
  const a = ccGetAirway();

  // Patient bar sits OUTSIDE .content so it can stick full-width directly

  return renderRunCodeHeader() + renderCRPatientBar() + `
    <div class="content ct-wrap rc-tabbed rc-has-bar">

}

function rcRenderTabContent(kg, elec, drugs, a, drugButtons) {
  let t = ctState.activeTab;
  // Stale tab states migrate:
  //   'code'   → removed in Phase 2A (CPR controls are now global)
  //   'vitals' → merged into More tab as a sub-view in Phase 5
  if (t === 'code' || t === 'vitals') {
    if (t === 'vitals') cr.moreView = 'vitals';
    t = 'more';
    ctState.activeTab = 'more';
  }
  if (t === 'meds') return rcRenderTabMeds(kg, elec);
  if (t === 'drip') return rcRenderTabDrip(kg);
  if (t === 'electricity') return rcRenderTabElectricity(kg, elec);
  if (t === 'equipment') return rcRenderTabEquipment(a);
  if (t === 'more') return rcRenderTabMore(kg);
  return '';
}

function rcRenderTabMore(kg) {
  const view = cr.moreView || 'log';
  const body = view === 'vitals' ? renderMoreVitals(kg)
            : view === 'etco2'  ? renderMoreEtco2()
            : view === 'hts'    ? renderMoreHts()
            :                     renderMoreLog();
  return `
    <div class="cr-meds-card">
      <div class="cr-meds-header">

        <div class="cr-meds-title">More · ${ccFmt(kg, 1)} kg</div>
