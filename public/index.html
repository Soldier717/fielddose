<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldDose — Field ACLS Dosing & Protocols</title>
<meta name="description" content="FieldDose — weight-based ACLS dosing, treatment protocols & electrical reference for EMS field use (SWFL 2025 guidelines).">
<meta property="og:title" content="FieldDose">
<meta property="og:description" content="Weight-based ACLS dosing, treatment protocols & electrical reference.">
<meta property="og:url" content="https://fielddose.com">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://fielddose.com/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e10;
    --bg-elev: #14161a;
    --bg-elev-2: #1c1f24;
    --border: #2a2e35;
    --border-bright: #3a3f48;
    --text: #e8e9eb;
    --text-dim: #8b9098;
    --text-muted: #5a6068;
    --accent: #c8341a;
    --accent-bright: #e8412a;
    --accent-dim: #6b1c0e;
    --gold: #d4a341;
    --success: #4a9d5f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(200,52,26,0.08), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(212,163,65,0.04), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* Standalone FieldDose: no sidebar — single full-width column */
  .app.fielddose-standalone {
    display: block;
    grid-template-columns: none;
  }
  .app.fielddose-standalone > .main {
    height: 100vh;
    width: 100%;
  }

  /* ====== MOBILE HAMBURGER ====== */
  .mobile-header {
    display: none;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 55;
  }
  .hamburger {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--text);
    transition: all 0.2s;
  }
  .mobile-brand {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .mobile-admin-toggle {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 2px;
  }
  .mobile-admin-toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0; right: 0; bottom: 0;
    left: 280px;
    background: transparent;
    z-index: 60;
  }
  .sidebar-overlay.show { display: block; }

  /* ====== SIDEBAR ====== */
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .brand {
    padding: 24px 22px 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .brand::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 22px;
    width: 60px; height: 2px;
    background: var(--accent);
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-shield {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .brand-shield svg { width: 100%; height: 100%; }
  .brand-name {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .brand-motto {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.4;
  }

  .nav-section { padding: 20px 14px 8px; }
  .nav-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0 8px 10px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    margin-bottom: 2px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: all 0.15s ease;
    border-left: 2px solid transparent;
    position: relative;
  }
  .nav-item:hover { background: var(--bg-elev-2); color: var(--text); }
  .nav-item.active { background: var(--bg-elev-2); color: var(--text); border-left-color: var(--accent); }
  .nav-item.active .nav-num { color: var(--accent); }
  .nav-item.current-week::after {
    content: 'CURRENT';
    position: absolute;
    right: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--gold);
    letter-spacing: 0.15em;
    background: rgba(212,163,65,0.12);
    padding: 2px 6px;
    border-radius: 2px;
  }
  .nav-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-width: 28px;
  }
  .nav-text { flex: 1; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .admin-toggle {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .admin-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .admin-toggle.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* ====== MAIN ====== */
  .main { overflow-y: auto; padding: 0; }

  .header {
    padding: 36px 48px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(28,31,36,0.4), transparent);
    position: relative;
    z-index: 1;
  }
  .breadcrumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .breadcrumb .sep { color: var(--accent); margin: 0 8px; }

  .page-title {
    font-family: 'Oswald', sans-serif;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 6px;
  }
  .page-title .accent { color: var(--accent); }

  .page-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* ====== FIELDDOSE LOGO HEADER ====== */
  /* white rounded badge so the stacked navy/red logo reads on the navy bar.
     height includes 18px vertical padding (border-box) → ~150px visible logo */
  .fd-logo {
    width: min(560px, 100%);
    height: auto;
    display: block;
    filter: drop-shadow(0 3px 14px rgba(0,0,0,0.30));
  }
  .fd-sub { margin-top: 16px; }
  @media (max-width: 640px) {
    .fd-logo { width: min(440px, 100%); }
  }

  .content { padding: 32px 48px 60px; }

  /* ====== SECTIONS ====== */
  .section { margin-bottom: 40px; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    width: 4px; height: 18px;
    background: var(--accent);
  }

  .add-btn {
    background: var(--bg-elev-2);
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    display: none;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  body.admin-mode .add-btn { display: inline-block; }

  /* ====== SCHEDULE ====== */
  .schedule { display: grid; gap: 8px; }
  .day-row {
    display: grid;
    grid-template-columns: 100px 90px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 14px 18px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-dim);
    border-radius: 2px;
    transition: border-color 0.15s;
  }
  .day-row:hover { border-left-color: var(--accent); }
  .day-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 14px;
  }
  .day-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
  }
  .day-topic { font-size: 14px; color: var(--text); }
  .day-topic .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 8px;
  }
  .day-actions { display: none; }
  body.admin-mode .day-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--text-muted);
    width: 26px; height: 26px;
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.15s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn.danger:hover { color: #ff6b4a; border-color: #ff6b4a; }

  /* ====== DRAG HANDLE (admin) ====== */
  .drag-handle {
    display: none;
    cursor: grab;
    color: var(--text-muted);
    margin-right: 4px;
    font-size: 14px;
  }
  body.admin-mode .drag-handle { display: inline-block; }
  .day-row.dragging { opacity: 0.4; border-color: var(--accent); }

  /* ====== VIDEOS ====== */
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .video-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: all 0.2s;
    position: relative;
  }
  .video-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
  .video-thumb {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
  }
  .video-thumb iframe { width: 100%; height: 100%; border: 0; }
  .video-info { padding: 14px 16px; }
  .video-cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .video-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .video-actions { display: none; position: absolute; top: 8px; right: 8px; gap: 4px; z-index: 5; }
  body.admin-mode .video-actions { display: flex; }

  /* ====== IMAGES / RESOURCES ====== */
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .image-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: all 0.2s;
    position: relative;
    cursor: pointer;
  }
  .image-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
  .image-card img {
    width: 100%;
    display: block;
    object-fit: cover;
    max-height: 300px;
  }
  .image-info { padding: 12px 16px; }
  .image-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .image-actions { display: none; position: absolute; top: 8px; right: 8px; gap: 4px; z-index: 5; }
  body.admin-mode .image-actions { display: flex; }

  .upload-area {
    border: 2px dashed var(--border-bright);
    border-radius: 4px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
    margin-bottom: 16px;
    display: none;
  }
  body.admin-mode .upload-area { display: block; }
  .upload-area:hover { border-color: var(--accent); }
  .upload-area.dragging { border-color: var(--gold); background: rgba(212,163,65,0.05); }
  .upload-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .upload-progress {
    margin-top: 8px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .upload-progress.show { display: block; }
  .upload-progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }

  /* ====== DOCS ====== */
  .doc-list { display: grid; gap: 8px; }
  .doc-item {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 16px;
    align-items: center;
    padding: 14px 18px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.15s;
  }
  .doc-item:hover { border-color: var(--accent); background: var(--bg-elev-2); }
  .doc-icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-elev-2);
    color: var(--accent);
    border-radius: 2px;
  }
  .doc-icon svg { width: 18px; height: 18px; }
  .doc-meta { display: flex; flex-direction: column; gap: 2px; }
  .doc-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .doc-desc { font-size: 12px; color: var(--text-dim); }
  .doc-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--border-bright);
    border-radius: 2px;
  }
  .doc-actions { display: none; }
  body.admin-mode .doc-actions { display: flex; gap: 6px; }

  .embed-wrapper {
    margin-top: 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    height: 600px;
    display: none;
  }
  .embed-wrapper.show { display: block; }
  .embed-wrapper iframe { width: 100%; height: 100%; border: 0; }

  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px dashed var(--border);
    border-radius: 2px;
  }

  /* ====== MODALS ====== */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .modal-close {
    background: none; border: none;
    color: var(--text-dim);
    font-size: 22px; cursor: pointer;
    line-height: 1;
  }
  .modal-body { padding: 24px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .modal-foot {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn {
    background: var(--bg-elev-2);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 18px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--text-dim); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ====== TOAST ====== */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--bg-elev-2);
    border: 1px solid var(--success);
    border-left: 3px solid var(--success);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-color: var(--accent); border-left-color: var(--accent); }

  /* ====== HOME PAGE ====== */
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a1c20 0%, #22252a 100%);
    border: 1px solid #3a3f48;
    border-top: 3px solid #e8c840;
    padding: 22px 20px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    background: radial-gradient(circle at top right, rgba(232,200,64,0.08), transparent 70%);
    pointer-events: none;
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #e8c840;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .stat-value {
    font-family: 'Oswald', sans-serif;
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: 0 0 20px rgba(232,200,64,0.15);
  }

  .week-jump {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }
  .week-tile {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    color: var(--text);
    font-family: inherit;
  }
  .week-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .week-tile.is-current { border-color: var(--gold); }
  .week-tile.is-current .week-tile-num { color: var(--gold); }
  .week-tile-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
  }
  .week-tile-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    color: var(--gold);
    letter-spacing: 0.15em;
    background: rgba(212,163,65,0.12);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 6px;
  }
  .week-tile-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ====== LOADING ====== */
  .loading-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .loading-screen.hide { display: none; }
  .loading-spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .saving-indicator {
    display: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-right: 8px;
  }
  .saving-indicator.show { display: inline-flex; align-items: center; gap: 6px; }
  .saving-indicator::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 880px) {
    /* html is the one scroll container on mobile; body must stay
       overflow: visible or position: sticky pins to the wrong box. */
    html { overflow-y: auto; height: auto; }
    body { overflow: visible; height: auto; }
    .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    .main { overflow: visible; }
    /* Body is the scroll container on mobile — .main must grow with its
       content (not clamp to 100vh) or sticky children stop sticking one
       viewport down. */
    .app.fielddose-standalone > .main { height: auto; min-height: 100vh; }
    .sidebar {
      position: fixed;
      top: 56px; left: -300px;
      width: 280px;
      height: calc(100% - 56px);
      max-height: calc(100vh - 56px);
      max-height: calc(100dvh - 56px);
      z-index: 70;
      transition: left 0.25s ease;
      border-right: 1px solid var(--border);
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
      padding-bottom: 60px;
      visibility: hidden;
    }
    .sidebar.open { left: 0; visibility: visible; }
    .sidebar-footer { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .sidebar.open { left: 0; }
    .mobile-header { display: flex; }
    .header { padding: 24px 20px 18px; }
    .content { padding: 20px; }
    .page-title { font-size: 32px; }
    .day-row { grid-template-columns: 1fr; gap: 6px; }
    .video-grid { grid-template-columns: 1fr; }
    .doc-item { grid-template-columns: 36px 1fr auto; }
    .doc-type { display: none; }
  }

  /* ============================================================
     CODE TIMER
  ============================================================ */
  .ct-wrap { max-width: 980px; margin-left: auto; margin-right: auto; }

  .ct-disclaimer {
    background: linear-gradient(90deg, rgba(200,52,26,0.15), rgba(200,52,26,0.05));
    border: 1px solid var(--accent);
    border-left: 4px solid var(--accent);
    padding: 14px 18px;
    border-radius: 2px;
    margin-bottom: 24px;
    font-size: 12px;
    line-height: 1.5;
  }
  .ct-disclaimer strong {
    display: block;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent-bright);
    margin-bottom: 6px;
  }

  .ct-display {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 24px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }
  .ct-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(200,52,26,0.1), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .ct-display.warning::before { opacity: 0.6; }
  .ct-display.critical::before { opacity: 1; background: radial-gradient(circle at center, rgba(200,52,26,0.25), transparent 60%); }
  .ct-display.flash { animation: ct-flash 0.3s ease-out; }
  @keyframes ct-flash { 0% { background: var(--accent); } 100% { background: var(--bg-elev); } }

  .ct-cycle-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 8px; position: relative; }
  .ct-cycle-num { color: var(--gold); font-weight: 700; }
  .ct-time { font-family: 'Oswald', sans-serif; font-size: 140px; font-weight: 700; line-height: 0.9; letter-spacing: -0.02em; color: var(--text); margin: 4px 0; position: relative; font-variant-numeric: tabular-nums; transition: color 0.3s; }
  .ct-display.warning .ct-time { color: var(--gold); }
  .ct-display.critical .ct-time { color: var(--accent-bright); }
  .ct-time-sub { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; position: relative; }
  .ct-total-time { position: absolute; top: 16px; right: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); letter-spacing: 0.15em; }
  .ct-total-time .v { color: var(--text); font-weight: 700; }

  .ct-pulse-area { display: flex; justify-content: center; align-items: center; margin-top: 24px; height: 60px; position: relative; }
  .ct-pulse-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); opacity: 0.2; transition: opacity 0.05s, transform 0.05s; }
  .ct-pulse-dot.beat { opacity: 1; transform: scale(1.6); box-shadow: 0 0 30px rgba(200,52,26,0.7); }
  .ct-pulse-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-left: 14px; }
  .ct-pulse-label .v { color: var(--accent-bright); font-weight: 700; }

  .ct-cue-banner { background: var(--accent); color: white; text-align: center; padding: 0 20px; border-radius: 2px; margin-bottom: 20px; font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; transform: translateY(-10px); transition: all 0.3s; pointer-events: none; height: 0; overflow: hidden; }
  .ct-cue-banner.show { opacity: 1; transform: translateY(0); height: auto; padding: 14px 20px; }
  .ct-cue-banner.epi { background: var(--gold); color: #000; }

  .ct-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .ct-btn { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; padding: 16px 20px; border-radius: 2px; cursor: pointer; border: 1px solid var(--border-bright); background: var(--bg-elev-2); color: var(--text); transition: all 0.15s; }
  .ct-btn:hover { border-color: var(--text-dim); }
  .ct-btn.start { background: var(--success); border-color: var(--success); color: white; }
  .ct-btn.start:hover { background: #5ab06f; border-color: #5ab06f; }
  .ct-btn.stop { background: var(--accent); border-color: var(--accent); color: white; }
  .ct-btn.stop:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
  .ct-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ct-settings { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 24px; }
  .ct-settings-title { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .ct-toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ct-toggle-row:last-child { border-bottom: none; }
  .ct-toggle-label { display: flex; flex-direction: column; gap: 2px; }
  .ct-toggle-label .main { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.04em; }
  .ct-toggle-label .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }
  .ct-toggle { position: relative; width: 44px; height: 24px; background: var(--bg-elev-2); border: 1px solid var(--border-bright); border-radius: 12px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  .ct-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--text-dim); border-radius: 50%; transition: all 0.2s; }
  .ct-toggle.on { background: var(--accent); border-color: var(--accent); }
  .ct-toggle.on::after { left: 22px; background: white; }
  .ct-bpm-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ct-bpm-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .ct-bpm-row .ct-bpm-val { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; color: var(--accent-bright); min-width: 70px; text-align: right; }

  .ct-log { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 2px; padding: 16px 20px; max-height: 240px; overflow-y: auto; }
  .ct-log-title { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .ct-log-clear { background: none; border: 1px solid var(--border-bright); color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; cursor: pointer; }
  .ct-log-clear:hover { border-color: var(--accent); color: var(--accent); }
  .ct-log-entry { display: grid; grid-template-columns: 70px 80px 1fr; gap: 12px; padding: 6px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.03); }
  .ct-log-entry:last-child { border-bottom: none; }
  .ct-log-entry .time { color: var(--gold); font-weight: 700; }
  .ct-log-entry .type { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .ct-log-entry .note { color: var(--text); }
  .ct-log-empty { text-align: center; padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; }

  .ct-events { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 24px; }
  .ct-event-btn { background: var(--bg-elev-2); border: 1px solid var(--border-bright); color: var(--text); font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 12px; border-radius: 2px; cursor: pointer; transition: all 0.15s; }
  .ct-event-btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  .ct-audio-hint { background: rgba(212,163,65,0.1); border: 1px solid var(--gold); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 2px; margin-bottom: 16px; font-size: 12px; color: var(--text-dim); display: none; }
  .ct-audio-hint.show { display: block; }

  @media (max-width: 720px) {
    .ct-time { font-size: 96px; }
    .ct-controls { grid-template-columns: 1fr; }
    .ct-display { padding: 28px 16px; }
    .ct-total-time { position: static; margin-bottom: 12px; }
    .ct-cue-banner.show { font-size: 16px; }
  }

  /* ====== CODE CALC ====== */
  .cc-wrap { max-width: 980px; }
  .cc-disclaimer { background: linear-gradient(90deg, rgba(200,52,26,0.15), rgba(200,52,26,0.05)); border: 1px solid var(--accent); border-left: 4px solid var(--accent); padding: 14px 18px; border-radius: 2px; margin-bottom: 20px; font-size: 12px; line-height: 1.5; }
  .cc-disclaimer strong { display: block; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 6px; }

  .cc-input-bar { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 2px; padding: 18px 20px; margin-bottom: 8px; position: sticky; top: 0; z-index: 20; }
  .cc-input-grid { display: grid; grid-template-columns: 1.4fr 1.6fr auto; gap: 16px; align-items: end; }
  .cc-input-grid.with-age { grid-template-columns: 1.4fr 1.6fr 1fr auto; }
  .cc-field { display: flex; flex-direction: column; gap: 6px; }
  .cc-field-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-weight-row { display: flex; gap: 6px; }
  .cc-weight-row input { flex: 1; background: var(--bg); border: 1px solid var(--border-bright); color: var(--text); font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; padding: 8px 12px; border-radius: 2px; outline: none; text-align: center; min-width: 0; }
  .cc-weight-row input:focus { border-color: var(--accent); }
  .cc-unit-toggle { display: flex; border: 1px solid var(--border-bright); border-radius: 2px; overflow: hidden; }
  .cc-unit-toggle button { background: var(--bg); border: none; color: var(--text-dim); padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.15s; }
  .cc-unit-toggle button.active { background: var(--accent); color: white; }

  .cc-age-band { display: flex; gap: 6px; }
  .cc-age-btn { flex: 1; background: var(--bg); border: 1px solid var(--border-bright); color: var(--text-dim); padding: 8px 6px; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  .cc-age-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .cc-age-btn:hover:not(.active) { border-color: var(--text-dim); color: var(--text); }
  .cc-age-input { background: var(--bg); border: 1px solid var(--border-bright); color: var(--text); font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; padding: 8px 12px; border-radius: 2px; outline: none; text-align: center; width: 100%; min-width: 0; }
  .cc-age-input:focus { border-color: var(--accent); }
  .cc-code-btn { background: var(--accent); border: 1px solid var(--accent); color: white; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 16px; border-radius: 2px; cursor: pointer; white-space: nowrap; transition: all 0.15s; height: fit-content; }
  .cc-code-btn:hover { background: var(--accent-bright); }

  .cc-summary { background: var(--bg-elev-2); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 12px 16px; border-radius: 2px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 24px; }
  .cc-summary-item { display: flex; flex-direction: column; gap: 2px; }
  .cc-summary-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-summary-value { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; }
  .cc-summary-value .gold { color: var(--gold); }

  .cc-section { margin-bottom: 28px; scroll-margin-top: 130px; }
  .cc-section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .cc-section-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.15em; background: rgba(200,52,26,0.1); border: 1px solid var(--accent-dim); padding: 4px 8px; border-radius: 2px; }
  .cc-section-title { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; flex: 1; }
  .cc-section-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-section.priority .cc-section-head { border-bottom-color: var(--accent); }
  .cc-section.priority .cc-section-title { color: var(--accent-bright); }

  .cc-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .cc-info-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px; }
  .cc-info-card .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
  .cc-info-card .value { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent-bright); line-height: 1.2; }
  .cc-info-card .detail { font-size: 11px; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }

  .cc-electrical-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .cc-elec-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 2px; padding: 16px 18px; }
  .cc-elec-card .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
  .cc-elec-card .primary { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--accent-bright); line-height: 1; }
  .cc-elec-card .secondary { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); margin-top: 6px; }
  .cc-elec-card .detail { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }

  .cc-drug-list { display: grid; gap: 10px; }
  .cc-drug-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 2px; padding: 14px 18px; transition: border-color 0.15s; }
  .cc-drug-card:hover { border-left-color: var(--accent); }
  .cc-drug-card.primary { border-left-color: var(--accent); }
  .cc-drug-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 12px; flex-wrap: wrap; }
  .cc-drug-name { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .cc-drug-class { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-drug-indication { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .cc-dose-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; margin-bottom: 8px; }
  .cc-dose-cell .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 3px; }
  .cc-dose-cell .value { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--accent-bright); line-height: 1.1; }
  .cc-dose-cell .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 4px; }
  .cc-drug-detail { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 6px; }
  .cc-drug-meta { display: flex; gap: 18px; font-size: 11px; color: var(--text-dim); padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .cc-drug-meta span strong { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-right: 6px; font-weight: 400; }
  .cc-verified-badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; margin-left: 6px; vertical-align: middle; }
  .cc-verified-badge.unverified { background: rgba(200,52,26,0.15); color: var(--accent-bright); border: 1px solid var(--accent); }

  .cc-hts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .cc-ht-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: 2px; padding: 12px 16px; }
  .cc-ht-card .label { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .cc-ht-card .detail { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

  .cc-empty { text-align: center; padding: 50px 24px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px dashed var(--border); border-radius: 2px; }

  body.cc-code-mode { overflow: hidden; }
  .cc-code-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; overflow-y: auto; display: none; }
  body.cc-code-mode .cc-code-overlay { display: block; }
  .cc-code-banner { position: sticky; top: 0; background: var(--accent); color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 3px solid #000; box-shadow: 0 4px 20px rgba(200,52,26,0.4); }
  .cc-code-banner-left { display: flex; align-items: center; gap: 16px; }
  .cc-code-pulse { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: cc-pulse 1s infinite; }
  @keyframes cc-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 50% { opacity: 0.7; box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
  .cc-code-banner-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
  .cc-code-banner-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
  .cc-exit-btn { background: rgba(0,0,0,0.3); border: 2px solid white; color: white; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; padding: 8px 18px; border-radius: 2px; cursor: pointer; }
  .cc-exit-btn:hover { background: rgba(0,0,0,0.6); }
  .cc-code-content { padding: 24px 32px 80px; max-width: 1200px; margin: 0 auto; }
  .cc-code-patient { background: #1a1a1a; border: 2px solid var(--accent); padding: 20px 24px; margin-bottom: 28px; display: flex; justify-content: space-around; gap: 24px; flex-wrap: wrap; }
  .cc-code-patient-item { text-align: center; }
  .cc-code-patient-item .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 6px; }
  .cc-code-patient-item .value { font-family: 'Oswald', sans-serif; font-size: 42px; font-weight: 700; color: white; line-height: 1; }
  .cc-code-patient-item .value .unit { font-size: 22px; color: #888; }
  .cc-code-section { margin-bottom: 32px; }
  .cc-code-section-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }
  .cc-code-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .cc-code-card { background: #1a1a1a; border: 1px solid #333; border-left: 4px solid var(--accent); padding: 18px 20px; }
  .cc-code-card .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .cc-code-card .name { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: white; margin-bottom: 10px; }
  .cc-code-card .big { font-family: 'Oswald', sans-serif; font-size: 36px; font-weight: 700; color: var(--accent-bright); line-height: 1; margin-bottom: 4px; }
  .cc-code-card .vol { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--gold); margin-top: 4px; }
  .cc-code-card .note { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.5; }

  @media (max-width: 720px) {
    .cc-input-grid, .cc-input-grid.with-age { grid-template-columns: 1fr; }
    .cc-input-bar { position: static; }
    .cc-section { scroll-margin-top: 20px; }
    .cc-dose-row { grid-template-columns: 1fr; }
    .cc-code-banner-title { font-size: 16px; }
    .cc-code-patient-item .value { font-size: 32px; }
    .cc-code-card .big { font-size: 28px; }
    .cc-code-content { padding: 16px 16px 60px; }
  }

  /* ====== RUN A CODE (merged tool) ====== */
  .rc-patient-bar { display: grid; grid-template-columns: 1.2fr 1.5fr auto auto; gap: 12px; align-items: end; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 4px; padding: 16px 20px; margin-bottom: 20px; }
  .rc-patient-bar.with-age { grid-template-columns: 1.2fr 1.5fr 0.8fr auto auto; }
  .rc-patient-bar.active { border-color: var(--gold); border-left: 3px solid var(--gold); }
  .rc-drug-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .rc-drug-btn { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 4px; padding: 14px 16px; cursor: pointer; text-align: left; transition: all 0.15s; color: var(--text); font-family: inherit; }
  .rc-drug-btn:hover { border-left-color: var(--accent); transform: translateY(-1px); }
  .rc-drug-btn.primary { border-left-color: var(--accent); }
  .rc-drug-btn .name { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .rc-drug-btn .dose { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--accent-bright); line-height: 1; }
  .rc-drug-btn .vol { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 4px; }
  .rc-drug-btn .ind { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .rc-drug-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rc-shock-btn { background: var(--accent); border: 1px solid var(--accent); border-left: 3px solid #fff; color: white; }
  .rc-shock-btn:hover { background: var(--accent-bright); }
  .rc-shock-btn .dose { color: white; font-size: 28px; }
  .rc-shock-btn .vol { color: rgba(255,255,255,0.85); }
  .rc-action-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .rc-rhythm-btn { background: var(--bg-elev-2); border: 1px solid var(--border-bright); color: var(--text); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 10px; border-radius: 2px; cursor: pointer; }
  .rc-rhythm-btn:hover { border-color: var(--accent); color: var(--accent-bright); }
  .rc-rhythm-btn.rosc { border-color: var(--success); color: var(--success); }
  .rc-rhythm-btn.rosc:hover { background: var(--success); color: white; }

  @media (max-width: 720px) {
    .rc-patient-bar, .rc-patient-bar.with-age { grid-template-columns: 1fr 1fr; }
  }

  /* ====== RUN A CODE — Bottom Tab Bar ====== */
  .rc-tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-top: 2px solid var(--accent);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 80;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .rc-quick-weight { display: flex; gap: 6px; margin-top: 8px; }
  .rc-quick-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rc-quick-btn:hover { border-color: var(--gold); color: var(--gold); }
  .rc-quick-btn.active { background: var(--gold); color: #1a1208; border-color: var(--gold); }
  .rc-tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 4px 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-top: 3px solid transparent;
    transition: all 0.15s;
  }
  .rc-tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
  .rc-tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.02); }
  .rc-tab-btn.active {
    color: var(--accent-bright);
    border-top-color: var(--accent);
    background: var(--bg-elev-2);
  }
  /* Pad bottom of Run a Code content so the fixed tab bar doesn't cover
     it — bar is ~64px + iOS home-indicator inset; extra headroom so the
     last row is fully readable without holding the scroll. Only the dose
     view carries rc-has-bar (the entry screen has no tab bar). */
  .content.ct-wrap.rc-has-bar { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }

  /* Drug card 3-row layout */
  .rc-drug-card { background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent-dim); border-radius: 4px; padding: 0; overflow: hidden; cursor: pointer; transition: all 0.15s; color: var(--text); font-family: inherit; text-align: left; display: flex; flex-direction: column; }
  .rc-drug-card:hover { border-left-color: var(--accent); transform: translateY(-1px); }
  .rc-drug-card.primary { border-left-color: var(--accent); }
  .rc-drug-card-head { padding: 12px 16px 10px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
  .rc-drug-card-head .name { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .rc-drug-card-head .ind { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .rc-drug-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
  .rc-drug-row:last-child { border-bottom: none; }
  .rc-drug-row .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .rc-drug-row .value { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.15; }
  .rc-drug-row.dose .value { color: var(--accent-bright); }
  .rc-drug-row.package .value { color: var(--text); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
  .rc-drug-row.delivery .value { color: var(--gold); font-size: 15px; }

  /* Rhythm Check Decision Panel — appears at 2:00 */
  .rc-decision {
    background: linear-gradient(135deg, #2a0a0a, #1a0505);
    border: 3px solid var(--accent);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
    animation: rc-decision-pulse 1.5s ease-in-out infinite;
    display: none;
  }
  .rc-decision.show { display: block; }
  @keyframes rc-decision-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,65,42,0.5); }
    50% { box-shadow: 0 0 24px 4px rgba(232,65,42,0.4); }
  }
  .rc-decision-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-bright);
    text-align: center;
    margin-bottom: 12px;
  }
  .rc-decision-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .rc-decision-btn {
    border: 2px solid;
    border-radius: 6px;
    padding: 18px 12px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    transition: transform 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .rc-decision-btn:active { transform: scale(0.97); }
  .rc-decision-btn .big {
    font-size: 22px;
    line-height: 1;
  }
  .rc-decision-btn .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0.9;
  }
  .rc-decision-btn.shock {
    background: var(--accent);
    border-color: var(--accent-bright);
    color: white;
  }
  .rc-decision-btn.shock:hover { background: var(--accent-bright); }
  .rc-decision-btn.noshock {
    background: var(--gold);
    border-color: #f0b550;
    color: #1a1208;
  }
  .rc-decision-btn.noshock:hover { background: #f0b550; }

  /* ============================================================
     V2 ENTRY FLOW — Adult/Peds picker, Broselow zones, IBW tiles
  ============================================================ */
  .cr-entry {
    max-width: 720px;
    margin: 0 auto;
    padding: 8px 4px 24px;
  }
  .cr-entry-title {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    text-align: center;
  }
  .cr-entry-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 22px;
    text-align: center;
    letter-spacing: 0.05em;
  }
  .cr-entry-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 30px;
  }
  .cr-entry-card {
    background: var(--bg-elev);
    border: 2px solid var(--border-bright);
    border-radius: 8px;
    padding: 28px 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-family: inherit;
  }
  .cr-entry-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .cr-entry-card.peds { border-color: var(--success); }
  .cr-entry-card.peds:hover { background: rgba(74,157,95,0.08); }
  .cr-entry-card.adult { border-color: var(--gold); }
  .cr-entry-card.adult:hover { background: rgba(212,163,65,0.08); }
  .cr-entry-card .plus {
    position: absolute;
    top: 10px; right: 10px;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 18px; font-weight: 700;
  }
  .cr-entry-card.peds .plus { background: var(--success); }
  .cr-entry-card.adult .plus { background: var(--gold); color: #1a1208; }
  .cr-entry-card .icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .cr-entry-card .label {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Saved patient charts — entry-screen list */
  .cr-charts { margin-bottom: 26px; }
  .cr-charts-title {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 4px;
  }
  .cr-charts-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }
  .cr-charts-empty {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-elev);
    border: 1px dashed var(--border-bright);
    border-radius: 6px;
    padding: 14px;
    text-align: center;
  }
  .cr-chart-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    background: var(--bg-elev);
    border: 1.5px solid var(--border-bright);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .cr-chart-row:hover { border-color: var(--accent); }
  .cr-chart-chip {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 6px 8px;
    min-width: 58px;
    text-align: center;
  }
  .cr-chart-info .sum {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .cr-chart-info .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .cr-chart-del {
    background: none;
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text-dim);
    font-size: 15px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cr-chart-del:hover { color: var(--accent-bright); border-color: var(--accent-bright); }
  .cr-chart-share {
    background: none;
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text-dim);
    font-size: 15px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cr-chart-share:hover { color: var(--gold); border-color: var(--gold); }

  .cr-back {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 8px 14px;
    border-radius: 4px;
  }
  .cr-back:hover { color: var(--accent); border-color: var(--accent); }

  /* Broselow zone tiles */
  .cr-broselow-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cr-zone {
    display: grid;
    grid-template-columns: 120px 1fr auto;
    align-items: center;
    background: var(--bg-elev);
    border: 1.5px solid var(--border-bright);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    padding: 0;
    transition: transform 0.1s, border-color 0.15s;
  }
  .cr-zone:hover { transform: translateX(2px); border-color: var(--accent); }
  .cr-zone-color {
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    padding: 16px 8px;
    text-align: center;
  }
  .cr-zone-info { padding: 10px 14px; text-align: left; }
  .cr-zone-weight { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; color: var(--text); }
  .cr-zone-age { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.05em; }
  .cr-zone-arrow { color: var(--text-muted); padding-right: 14px; font-size: 20px; font-family: 'JetBrains Mono', monospace; }

  /* Adult IBW tiles */
  .cr-ibw-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cr-ibw-tile {
    background: var(--bg-elev);
    border: 1.5px solid var(--border-bright);
    border-radius: 30px;
    padding: 14px 22px;
    display: grid;
    grid-template-columns: 90px 1fr 80px;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: all 0.12s;
  }
  .cr-ibw-tile:hover { transform: translateX(2px); border-color: var(--gold); background: rgba(212,163,65,0.06); }
  .cr-ibw-lbs { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; color: var(--gold); text-align: left; }
  .cr-ibw-kg { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); text-align: left; }
  .cr-ibw-ht { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text-dim); text-align: right; }

  /* Manual / custom weight entry */
  .cr-manual {
    background: var(--bg-elev);
    border: 1px dashed var(--border-bright);
    border-radius: 6px;
    padding: 16px;
    margin-top: 8px;
  }
  .cr-manual-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cr-manual-row { display: flex; gap: 8px; align-items: stretch; }
  .cr-manual-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    color: var(--text);
    outline: none;
  }
  .cr-manual-row input:focus { border-color: var(--accent); }
  .cr-manual-btn {
    width: 100%;
    margin-top: 10px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 13px;
    cursor: pointer;
  }
  .cr-manual-btn:hover { background: var(--accent-bright); }

  /* Patient bar (sticky during dose view) */
  .cr-patient-bar-v2 {
    background: var(--bg-elev-2);
    border: 1px solid var(--border-bright);
    border-left: 4px solid var(--gold);
    border-radius: 6px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .cr-patient-bar-v2.peds { border-left-color: var(--success); }
  .cr-pat-summary {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cr-pat-summary .zone-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border: 1px solid rgba(0,0,0,0.3);
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .cr-pat-summary .lt { font-weight: 400; color: var(--text-dim); font-size: 13px; }
  .cr-new-pat-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-new-pat-btn:hover { background: var(--accent); color: white; }

  @media (max-width: 720px) {
    .cr-entry-cards { grid-template-columns: 1fr; }
    .cr-zone { grid-template-columns: 100px 1fr auto; }
    .cr-ibw-tile { grid-template-columns: 70px 1fr 70px; }
  }

  /* ============================================================
     V2 LIGHT CLINICAL THEME — scoped to body.on-coderun only
     Academy / dashboard pages keep the dark theme.
  ============================================================ */
  /* Palette mirrors Greater Naples Fire Rescue (greaternaplesfire.org):
     fire red #B71125 / dark red #AA0E21 / gold #FDCA68 / charcoal #383838 / cream #FDFAF4.
     Var names kept (--clin-blue etc.) to avoid churn; --clin-blue is now the GNFR red primary. */
  :root {
    --clin-bg: #fdfaf4;
    --clin-surface: #ffffff;
    --clin-surface-alt: #f4efe6;
    --clin-border: #e6dfd2;
    --clin-text: #383838;
    --clin-text-dim: #54595f;
    --clin-text-muted: #9a948a;
    --clin-blue: #b71125;
    --clin-blue-light: #f7dde1;
    --clin-pink: #fbe0e6;
    --clin-red: #b71125;
    --clin-yellow: #fdca68;
    --clin-green: #2fa84f;
    --clin-shadow: 0 2px 8px rgba(56,56,56,0.10);
  }

  body.on-coderun .main {
    background: var(--clin-bg);
  }
  body.on-coderun .main .header {
    background: var(--clin-blue);
    color: white;
    border-bottom: none;
  }
  /* Compact sticky logo header — fixed height so the sticky patient bar
     below can pin exactly beneath it (top: var(--fd-hdr-h)). The whole
     sticky stack (header → patient bar → card header → subtabs → column
     row) relies on these fixed heights for its cumulative offsets. */
  body.on-coderun {
    --fd-hdr-h: 60px;
    --fd-patbar-h: 52px;
    --fd-cardhd-h: 56px;
    --fd-subtab-h: 45px;
  }
  body.on-coderun .main .header.fd-header {
    background: var(--clin-blue);
    border-bottom: 3px solid var(--clin-red);
    position: sticky;
    top: 0;
    z-index: 90;
    height: var(--fd-hdr-h);
    box-sizing: border-box;
    padding: 7px 14px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  body.on-coderun .main .header.fd-header .fd-logo {
    height: 100%;
    width: auto;
    max-width: 62vw;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  body.on-coderun .main .header.fd-header .fd-sub {
    color: rgba(255,255,255,0.78);
    margin-top: 0;
    font-size: 10px;
  }
  @media (max-width: 640px) {
    body.on-coderun { --fd-hdr-h: 52px; }
    body.on-coderun .main .header.fd-header { padding: 6px 10px 6px 60px; }
    body.on-coderun .main .header.fd-header .fd-sub { display: none; }
  }
  body.on-coderun .main .header .breadcrumb,
  body.on-coderun .main .header .page-meta {
    color: rgba(255,255,255,0.7);
  }
  body.on-coderun .main .header .page-title {
    color: white;
  }
  body.on-coderun .main .header .page-title .accent {
    color: var(--clin-yellow);
  }
  body.on-coderun .main .content {
    background: var(--clin-bg);
    color: var(--clin-text);
  }
  body.on-coderun .main .cc-disclaimer {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text-dim);
    border-left: 3px solid var(--clin-yellow);
  }
  body.on-coderun .main .cc-disclaimer strong {
    color: var(--clin-red);
  }
  body.on-coderun .main .cr-entry-title { color: var(--clin-blue); }
  body.on-coderun .main .cr-entry-sub { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-entry-card {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
    box-shadow: var(--clin-shadow);
  }
  body.on-coderun .main .cr-entry-card.peds { border-color: var(--clin-green); }
  body.on-coderun .main .cr-entry-card.peds .plus { background: var(--clin-green); color: white; }
  body.on-coderun .main .cr-entry-card.peds:hover { background: linear-gradient(180deg, #e8f5ec 0%, var(--clin-surface) 100%); }
  body.on-coderun .main .cr-entry-card.adult { border-color: var(--clin-blue); }
  body.on-coderun .main .cr-entry-card.adult .plus { background: var(--clin-blue); color: white; }
  body.on-coderun .main .cr-entry-card.adult:hover { background: linear-gradient(180deg, var(--clin-blue-light) 0%, var(--clin-surface) 100%); }
  /* Saved charts list — clinical light theme */
  body.on-coderun .main .cr-charts-title { color: var(--clin-blue); }
  body.on-coderun .main .cr-charts-sub { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-charts-empty {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text-dim);
  }
  body.on-coderun .main .cr-chart-row {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    box-shadow: var(--clin-shadow);
  }
  body.on-coderun .main .cr-chart-row:hover { border-color: var(--clin-blue); }
  body.on-coderun .main .cr-chart-info .sum { color: var(--clin-text); }
  body.on-coderun .main .cr-chart-info .meta { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-chart-share,
  body.on-coderun .main .cr-chart-del {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text-dim);
  }
  body.on-coderun .main .cr-chart-share:hover { color: var(--clin-blue); border-color: var(--clin-blue); }
  body.on-coderun .main .cr-chart-del:hover { color: var(--clin-red); border-color: var(--clin-red); }

  body.on-coderun .main .cr-back {
    color: var(--clin-blue);
    border-color: var(--clin-border);
    background: var(--clin-surface);
  }
  body.on-coderun .main .cr-back:hover { color: var(--clin-blue); border-color: var(--clin-blue); background: var(--clin-blue-light); }
  body.on-coderun .main .cr-zone {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-zone:hover { border-color: var(--clin-blue); box-shadow: var(--clin-shadow); }
  body.on-coderun .main .cr-zone-weight { color: var(--clin-text); }
  body.on-coderun .main .cr-zone-age { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-zone-arrow { color: var(--clin-text-muted); }
  body.on-coderun .main .cr-ibw-tile {
    background: var(--clin-blue-light);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-ibw-tile:hover { border-color: var(--clin-blue); background: #f1ccd1; }
  body.on-coderun .main .cr-ibw-lbs { color: var(--clin-text); }
  body.on-coderun .main .cr-ibw-kg { color: var(--clin-text); }
  body.on-coderun .main .cr-ibw-ht { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-manual {
    background: var(--clin-surface);
    border-color: var(--clin-border);
  }
  body.on-coderun .main .cr-manual-label { color: var(--clin-text-dim); }
  body.on-coderun .main .cr-manual-row input {
    background: var(--clin-surface);
    border-color: var(--clin-border);
    color: var(--clin-text);
  }
  body.on-coderun .main .cr-manual-row input:focus { border-color: var(--clin-blue); }
  body.on-coderun .main .cr-manual-btn {
    background: var(--clin-blue);
    color: white;
  }
  body.on-coderun .main .cr-manual-btn:hover { background: #aa0e21; }

  /* Patient bar — V2 clinical look. Sticky directly under the compact
     header so weight context + New stay in view while content scrolls. */
  body.on-coderun .main .cr-patient-bar-v2 {
    background: var(--clin-blue-light);
    border: none;
    border-left: 4px solid var(--clin-blue);
    color: var(--clin-text);
    border-radius: 0;
    padding: 0 18px;
    margin-bottom: 0;
    box-shadow: 0 1px 2px rgba(56,56,56,0.06);
    position: sticky;
    top: var(--fd-hdr-h);
    z-index: 70;
    height: var(--fd-patbar-h);
    box-sizing: border-box;
    flex-wrap: nowrap;
  }
  body.on-coderun .main .cr-patient-bar-v2 .cr-pat-summary {
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow: hidden;
  }
  body.on-coderun .main .cr-patient-bar-v2.peds {
    background: var(--clin-pink);
    border-left-color: #ec4899;
  }
  body.on-coderun .main .cr-pat-summary { color: var(--clin-text); }
  body.on-coderun .main .cr-pat-summary .lt { color: var(--clin-text-dim); }
  /* Start CPR button (right side of patient bar) */
  .cr-cpr-toggle-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-blue);
    color: var(--clin-blue);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 9px 18px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-cpr-toggle-btn:hover { background: var(--clin-blue); color: white; }
  .cr-cpr-toggle-btn.active {
    background: var(--clin-red);
    border-color: var(--clin-red);
    color: white;
  }
  .cr-cpr-toggle-btn.active:hover { background: #aa0e21; border-color: #aa0e21; }

  /* New Patient: subtler button in clinical theme */
  body.on-coderun .main .cr-new-pat-btn {
    background: transparent;
    border: 1px solid var(--clin-text-dim);
    color: var(--clin-text-dim);
    padding: 7px 12px;
    font-size: 11px;
  }
  body.on-coderun .main .cr-new-pat-btn:hover { background: var(--clin-text-dim); color: white; }

  /* ============================================================
     COMPACT CPR CONTROL BAR — shows when CPR active
  ============================================================ */
  .cr-cpr-control {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 10px;
    padding: 14px;
    margin: 12px 0;
    box-shadow: var(--clin-shadow);
    display: none;
  }
  .cr-cpr-control.show { display: block; }
  .cpr-row-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .cpr-ratio-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .cpr-ratio-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 8px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .cpr-ratio-btn.active {
    background: var(--clin-green);
    border-color: var(--clin-green);
    color: white;
  }
  .cpr-ratio-btn:hover:not(.active) { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cpr-action-btn {
    background: var(--clin-surface);
    border: 2px solid var(--clin-border);
    color: var(--clin-text);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 10px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cpr-action-btn:hover { border-color: var(--clin-blue); color: var(--clin-blue); }
  .cpr-action-btn.defib { border-color: var(--clin-red); color: var(--clin-red); }
  .cpr-action-btn.defib:hover { background: var(--clin-red); color: white; }
  .cpr-row-mid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    padding: 10px 4px;
    border-top: 1px solid var(--clin-surface-alt);
    border-bottom: 1px solid var(--clin-surface-alt);
  }
  .cpr-bpm-cell {
    text-align: left;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .cpr-bpm-cell .ico { font-size: 18px; line-height: 1; }
  .cpr-bpm-cell .val {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--clin-red);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .cpr-bpm-cell .lbl {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--clin-text-muted);
    letter-spacing: 0.04em;
  }
  .cpr-reset-btn {
    background: var(--clin-blue);
    color: white;
    border: none;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(183,17,37,0.35);
    text-transform: uppercase;
  }
  .cpr-reset-btn:hover { background: #aa0e21; transform: scale(1.03); }
  .cpr-time-cell {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .cpr-time-cell .val {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--clin-blue);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .cpr-time-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--clin-text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cpr-row-bot {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .cr-pulse-mini {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--clin-red);
    opacity: 0.25;
    transition: all 0.06s;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }
  .cr-pulse-mini.beat { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px rgba(183,17,37,0.6); }

  /* Bottom tab bar — clinical look */
  body.on-coderun .main .rc-tabbar {
    background: var(--clin-blue);
    color: white;
    border-top: none;
    box-shadow: 0 -2px 8px rgba(56,56,56,0.15);
  }
  body.on-coderun .main .rc-tab-btn {
    background: none;
    color: rgba(255,255,255,0.65);
    border-top: 3px solid transparent;
    border-bottom: none;
  }
  body.on-coderun .main .rc-tab-btn.active {
    color: white;
    background: rgba(255,255,255,0.06);
    border-top-color: var(--clin-yellow);
    border-bottom: none;
  }
  body.on-coderun .main .rc-tab-btn svg path { stroke: currentColor; }

  /* Settings collapsible — light theme */
  body.on-coderun .main .ct-settings {
    background: var(--clin-surface);
    border: 1px solid var(--clin-border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  body.on-coderun .main .ct-settings summary {
    color: var(--clin-text-dim) !important;
  }
  body.on-coderun .main .ct-toggle-row,
  body.on-coderun .main .ct-bpm-row {
    border-top: 1px solid var(--clin-surface-alt);
  }
  body.on-coderun .main .ct-toggle-label .main { color: var(--clin-text); }
